scalar DateTime
scalar Any

type ErrorResult {
  message: String!
  code: String
  field: String
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

input PaginationInput {
  first: Int
  after: String
  last: Int
  before: String
}

type AuthenticationError {
  message: String!
}

type AuthorizationError {
  message: String!
  requiredRole: String
}

type BusinessLogicError {
  code: String!
  details: String
  message: String!
}

input DateRangeInput {
  start: DateTime!
  end: DateTime
}
