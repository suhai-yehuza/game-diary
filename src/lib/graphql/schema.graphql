}

# Comment Types
type Comment {
  id: ID!
  content: String!
  user: UserSummary!
  user_id: ID!
  parent_id: ID!
  parent_type: ParentType!
  depth: Int!
  created_at: DateTime!
  updated_at: DateTime!
  deleted_at: DateTime
  childComments: CommentConnection!
  totalChildCommentCount: Int!
  reactions: [Reaction!]!
  totalReactionCount: Int!
}

enum ParentType {
  GAME_LOG
  COMMENT
  BASKETBALL_GAME
  BASKETBALL_PLAYER
  BASKETBALL_TEAM
  PUBLIC_COMMENT
  PUBLIC_REACTION
}

type CommentConnection {
  edges: [CommentEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type CommentEdge {
  cursor: String!
  node: Comment!
}

# Reaction Types
type Reaction {
  id: ID!
  emoji: String!
  user: UserSummary!
  user_id: ID!
  target_id: ID!
  target_type: ParentType!
  created_at: DateTime!
  updated_at: DateTime!
  deleted_at: DateTime
}

# Public Comment Types (for NBA games, players, teams - no authentication required)
type PublicComment {
  id: ID!
