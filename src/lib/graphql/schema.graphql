  city: String
  state: String
  country: String
  logo: String
  conference: String
  division: String
  league: String
  season: Int
  stats: ITeamStats
  h2h: ITeamH2H
  standings: [ConferenceStanding!]
}

type TeamSummary {
  id: String!
  code: String!
  name: String!
  nickname: String!
  logo: String
}

type ConferenceStanding {
  name: String!
  win: Int!
  loss: Int!
}

type ITeamStats {
