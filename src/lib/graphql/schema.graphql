# Comment Types
type Comment {
  id: ID!
  content: String!
  user: UserSummary!
  userId: ID!
  parentId: ID!
  parentType: ParentType!
  depth: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
  childComments: CommentConnection!
  reactions: [Reaction!]!
}

enum ParentType {
  game_log
  comment
}

type CommentConnection {
  edges: [CommentEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type CommentEdge {
  cursor: String!
  node: Comment!
}

# Reaction Types
type Reaction {
  id: ID!
  emoji: ReactionEmojiType!
  user: UserSummary!
  userId: ID!
  targetId: ID!
  targetType: ParentType!
  createdAt: DateTime!
  updatedAt: DateTime!
}

enum ReactionEmojiType {
  THUMBS_UP
  THUMBS_DOWN
  LOVE
  LAUGH
  WOW
  SAD
  ANGRY
  FIRE
  CLAP
  EYES
  ROCKET
  MUSCLE
  GOAT
  BULLSEYE
  BASKETBALL
  SOCCER
  FOOTBALL
  BASEBALL
  TENNIS
  GOLF
}

