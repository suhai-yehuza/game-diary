type Mutation {
  acceptFriendRequest(friendshipId: ID!): AcceptFriendRequestResponse!
  createComment(input: CreateCommentInput!): CreateCommentResponse!
  createGame(input: CreateGameInput!): CreateGameResponse!
  createGameLog(input: CreateGameLogInput!): CreateGameLogResponse!
  createGameStats(input: CreateGameStatsInput!): CreateGameStatsResponse!
  createReaction(input: CreateReactionInput!): CreateReactionResponse!
  deleteComment(id: ID!): DeleteCommentResponse!
  deleteGame(id: ID!): DeleteGameResponse!
  deleteGameLog(id: ID!): DeleteGameLogResponse!
  deleteGameStats(id: ID!): DeleteGameStatsResponse!
  deletePlayerStats(id: ID!): DeletePlayerStatsResponse!
  deleteReaction(id: ID!): DeleteReactionResponse!
  deleteUser(id: ID!): DeleteUserResponse!
  favoritePlayer(id: ID!): FavoritePlayerResponse!
  favoriteTeam(id: ID!): FavoriteTeamResponse!
  rejectFriendRequest(friendshipId: ID!): RejectFriendRequestResponse!
  removeFriend(friendshipId: ID!): RemoveFriendResponse!
  sendFriendRequest(userId: ID!): SendFriendRequestResponse!
  updateComment(id: ID!, input: UpdateCommentInput!): UpdateCommentResponse!
  updateFriendshipStatus(input: UpdateFriendshipStatusInput!): UpdateFriendshipStatusResponse!
  updateGame(id: ID!, input: UpdateGameInput!): UpdateGameResponse!
  updateGameLog(id: ID!, input: UpdateGameLogInput!): UpdateGameLogResponse!
  updateGameStats(id: ID!, input: UpdateGameStatsInput!): UpdateGameStatsResponse!
  updatePlayer(id: ID!, input: UpdatePlayerInput!): UpdatePlayerResponse!
  updatePlayerStats(id: ID!, input: UpdatePlayerStatsInput!): UpdatePlayerStatsResponse!
}

type MutationResponse {
  errors: [ErrorResult!]
