schema {
  query: Query
  mutation: Mutation
}

type Query {
  # User queries
  me: UserSummary
  user(id: ID!): UserSummary
  users(filters: UserFilters, pagination: PaginationInput): [UserSummary!]!
  searchUsers(
    first: Int
    after: String
    searchTerm: String
    filters: UserSearchFilters
  ): UserConnection!

  # Game queries
  game(id: ID!): Game
  games(filters: GameFilters, pagination: PaginationInput): GameConnection!
  liveGames(first: Int, after: String): GameConnection!
  gameLog(id: ID!): GameLog
  gameLogs(filters: GameLogFilters, pagination: PaginationInput): GameLogConnection!

  # Comment queries
  comments(filters: CommentFilters, pagination: PaginationInput): CommentConnection!

  # Reaction queries
  reactions(targetId: ID!, targetType: ParentType!): [Reaction!]!
}

type Mutation {
  # User mutations
  sendFriendRequest(userId: ID!): SendFriendRequestResponse!
  acceptFriendRequest(friendshipId: ID!): AcceptFriendRequestResponse!
  rejectFriendRequest(friendshipId: ID!): RejectFriendRequestResponse!
  removeFriend(friendshipId: ID!): RemoveFriendResponse!

  # Game mutations
  createGame(input: CreateGameInput!): CreateGameResponse!
  createGameLog(input: CreateGameLogInput!): CreateGameLogResponse!
  updateGameLog(id: ID!, input: UpdateGameLogInput!): UpdateGameLogResponse!
  deleteGameLog(id: ID!): DeleteGameLogResponse!

  # Comment mutations
  createComment(input: CreateCommentInput!): CreateCommentResponse!
  updateComment(id: ID!, input: UpdateCommentInput!): UpdateCommentResponse!
  deleteComment(id: ID!): DeleteCommentResponse!

  # Reaction mutations
  createReaction(input: CreateReactionInput!): CreateReactionResponse!
  deleteReaction(id: ID!): DeleteReactionResponse!
}

# Scalars
scalar DateTime
scalar Any

# Common Types
type ErrorResult {
  message: String!
  code: String
  field: String
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

input PaginationInput {
  first: Int
  after: String
  last: Int
  before: String
}

type AuthenticationError {
  message: String!
}

type AuthorizationError {
  message: String!
  requiredRole: String
}

type BusinessLogicError {
  code: String!
  details: String
  message: String!
}

input DateRangeInput {
  start: DateTime!
  end: DateTime
}

# User Types
type UserSummary {
  id: ID!
  username: String!
  first_name: String!
  last_name: String!
  email_address: String
  image_url: String
}

type DBUser {
  id: ID!
  username: String!
  first_name: String
  last_name: String
  email_address: String
  image_url: String
  object: String!
  has_image: Boolean!
  profile_image_url: String
  primary_email_address_id: String
  primary_phone_number_id: String
  external_id: String
  last_active_at: DateTime
  last_sign_in_at: DateTime
  bio: String
  timezone: String
  preferred_language: String
  created_at: DateTime!
  updated_at: DateTime!
  deleted_at: DateTime
  inbound_friendship_ids: [String!]
  outbound_friendship_ids: [String!]
  comments: [Comment!]!
  reactions: [Reaction!]!
  gameLogs: [GameLog!]!
  friendships: [Friendship!]!
  initiatedFriendships: [Friendship!]!
}

type Friendship {
  id: ID!
  status: FriendshipStatus!
  created_at: DateTime!
  updated_at: DateTime!
  initiator: UserSummary!
  recipient: UserSummary!
}

enum FriendshipStatus {
  ACCEPTED
  BLOCKED
  PENDING
  REJECTED
}

# Game Types
type Game {
  id: ID!
  date: DateTime!
  status: String!
  game_type: String!
  nba_game_id: ID
  home_team_id: String!
  away_team_id: String!
  home_team_score: Int
  away_team_score: Int
  created_at: DateTime!
  updated_at: DateTime!
}

type GameLog {
  id: ID!
  game: Game!
  user: UserSummary!
  rating_for_game: Int!
  notes: String
  tags: [String!]
  watched_date: DateTime
  watched_setting: String
  watched_location: String
  watched_scope: String
  classification: Classification!
  created_at: DateTime!
  updated_at: DateTime!
  deleted_at: DateTime
  comments: CommentConnection!
  reactions: [Reaction!]!
}

enum Classification {
  PRIVATE
  PROTECTED
  PUBLIC
}

enum GameStatusEnum {
  SCHEDULED
  LIVE
  FINISHED
  CANCELLED
}

# Comment Types
type Comment {
  id: ID!
  content: String!
  user: UserSummary!
  user_id: ID!
  parent_id: ID!
  parent_type: ParentType!
  depth: Int!
  created_at: DateTime!
  updated_at: DateTime!
  deleted_at: DateTime
  childComments: CommentConnection!
  reactions: [Reaction!]!
}

enum ParentType {
  GAME_LOG
  COMMENT
}

type CommentConnection {
  edges: [CommentEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type CommentEdge {
  cursor: String!
  node: Comment!
}

# Reaction Types
type Reaction {
  id: ID!
  emoji: String!
  user: UserSummary!
  user_id: ID!
  target_id: ID!
  target_type: ParentType!
  created_at: DateTime!
  updated_at: DateTime!
}

# Connection Types
type GameConnection {
  edges: [GameEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type GameEdge {
  cursor: String!
  node: Game!
}

type GameLogConnection {
  edges: [GameLogEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type GameLogEdge {
  cursor: String!
  node: GameLog!
}

type UserConnection {
  edges: [UserEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type UserEdge {
  cursor: String!
  node: UserSummary!
}

# Input Types
input GameFilters {
  dateRange: DateRangeInput
  status: GameStatusEnum
  teamId: ID
  search: String
  season: Int
  arena: String
}

input GameLogFilters {
  userId: ID
  gameId: ID
  dateRange: DateRangeInput
  classification: Classification
  search: String
  searchText: String
  minRating: Int
  maxRating: Int
  watchedSetting: String
  watchedLocation: String
  tags: [String!]
  hasNotes: Boolean
  watchedDateRange: DateRangeInput
  sortBy: String
  sortDirection: String
}

input CommentFilters {
  parentId: ID
  parentType: ParentType
  userId: ID
  search: String
}

input CreateCommentInput {
  content: String!
  parentId: ID!
  parentType: ParentType!
}

input UpdateCommentInput {
  content: String!
}

input CreateReactionInput {
  emoji: String!
  targetId: ID!
  targetType: ParentType!
}

input CreateGameLogInput {
  gameId: ID!
  rating_for_game: Int!
  notes: String
  tags: [String!]
  watched_date: DateTime
  watched_setting: String
  watched_location: String
  watched_scope: String
  classification: Classification!
}

input UpdateGameLogInput {
  rating_for_game: Int
  notes: String
  tags: [String!]
  watched_date: DateTime
  watched_setting: String
  watched_location: String
  watched_scope: String
  classification: Classification
}

input CreateGameInput {
  date: DateTime!
  home_team_id: String!
  away_team_id: String!
  game_type: String!
  nba_game_id: ID
  status: String!
  home_team_score: Int
  away_team_score: Int
}

input UserFilters {
  search: String
  status: String
  role: String
  joinedAfter: DateTime
  joinedBefore: DateTime
  isVerified: Boolean
  hasGameLogs: Boolean
  minGameLogs: Int
  orderBy: String
}

input UserSearchFilters {
  search: String
  status: String
  role: String
  joinedAfter: DateTime
  joinedBefore: DateTime
  isVerified: Boolean
  hasGameLogs: Boolean
  minGameLogs: Int
  orderBy: String
}

# Response Types
type CreateCommentResponse {
  comment: Comment
  errors: [ErrorResult!]
}

type UpdateCommentResponse {
  comment: Comment
  errors: [ErrorResult!]
}

type DeleteCommentResponse {
  success: Boolean!
  errors: [ErrorResult!]
}

type CreateReactionResponse {
  reaction: Reaction
  errors: [ErrorResult!]
}

type DeleteReactionResponse {
  success: Boolean!
  errors: [ErrorResult!]
}

type CreateGameLogResponse {
  gameLog: GameLog
  errors: [ErrorResult!]
}

type UpdateGameLogResponse {
  gameLog: GameLog
  errors: [ErrorResult!]
}

type DeleteGameLogResponse {
  success: Boolean!
  errors: [ErrorResult!]
}

type CreateGameResponse {
  game: Game
  errors: [ErrorResult!]
}

type AcceptFriendRequestResponse {
  errors: [ErrorResult!]
  friendship: Friendship
}

type SendFriendRequestResponse {
  errors: [ErrorResult!]
  friendship: Friendship
}

type RejectFriendRequestResponse {
  errors: [ErrorResult!]
  friendship: Friendship
}

type RemoveFriendResponse {
  success: Boolean!
  errors: [ErrorResult!]
}

type UpdateUserProfileResponse {
  errors: [ErrorResult!]
  user: UserSummary
}
