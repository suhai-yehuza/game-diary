schema {
  query: Query
  mutation: Mutation
}

type Query {
  # User queries
  me: UserSummary
  user(id: ID!): UserSummary
  users(filters: UserFilters, pagination: PaginationInput): [UserSummary!]!
  searchUsers(
    first: Int
    after: String
    searchTerm: String
    filters: UserSearchFilters
  ): UserConnection!

  # Game queries
  game(id: ID!): Game
  games(filters: GameFilters, pagination: PaginationInput): GameConnection!
  liveGames(first: Int, after: String): GameConnection!
  gameLog(id: ID!): GameLog
  gameLogs(filters: GameLogFilters, pagination: PaginationInput): GameLogConnection!

  # Team queries
  team(id: ID!): Team
  teams(filters: TeamFilters): TeamConnection!
  teamStats(teamId: ID!, season: Int!): ITeamStats
  teamH2H(teamId: ID!, opponentId: ID!): ITeamH2H
  teamGameStats(gameId: ID!, teamId: String!): ITeamStats

  # Player queries
  player(id: ID!): Player
  players(filters: IPlayerFilters, pagination: PaginationInput): PlayerConnection!
  playerStats(playerId: ID!, gameId: ID!): IPlayerStats

  # Comment queries
  comments(filters: CommentFilters, pagination: PaginationInput): CommentConnection!

  # Reaction queries
  reactions(targetId: ID!, targetType: ParentType!): [Reaction!]!
}

type Mutation {
  # User mutations
  sendFriendRequest(userId: ID!): SendFriendRequestResponse!
  acceptFriendRequest(friendshipId: ID!): AcceptFriendRequestResponse!
  rejectFriendRequest(friendshipId: ID!): RejectFriendRequestResponse!
  removeFriend(friendshipId: ID!): RemoveFriendResponse!

  # Game mutations
  createGame(input: CreateGameInput!): CreateGameResponse!
  createGameLog(input: CreateGameLogInput!): CreateGameLogResponse!
  updateGameLog(id: ID!, input: CreateGameLogInput!): UpdateGameLogResponse!
  deleteGameLog(id: ID!): DeleteGameLogResponse!

  # Comment mutations
  createComment(input: CreateCommentInput!): CreateCommentResponse!
  updateComment(id: ID!, input: CreateCommentInput!): UpdateCommentResponse!
  deleteComment(id: ID!): DeleteCommentResponse!

  # Reaction mutations
  createReaction(input: CreateReactionInput!): CreateReactionResponse!
  deleteReaction(id: ID!): DeleteReactionResponse!
}

# Scalars
scalar DateTime
scalar Any

# Common Types
type ErrorResult {
  message: String!
  code: String
  field: String
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

input PaginationInput {
  first: Int
  after: String
  last: Int
  before: String
}

type AuthenticationError {
  message: String!
}

type AuthorizationError {
  message: String!
  requiredRole: String
}

type BusinessLogicError {
  code: String!
  details: String
  message: String!
}

input DateRangeInput {
  start: DateTime!
  end: DateTime
}

# User Types
type UserSummary {
  id: ID!
  username: String!
  first_name: String!
  last_name: String!
  emailAddress: String
  image_url: String
}

type DBUser {
  id: ID!
  username: String!
  first_name: String
  last_name: String
  emailAddress: String
  email_verified: Boolean
  email_verification_strategy: String
  password_enabled: Boolean
  two_factor_enabled: Boolean
  image_url: String
  banned: Boolean
  last_sign_in_at: DateTime
  external_id: String
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
  inboundFriendshipIds: [String!]
  outboundFriendshipIds: [String!]
  comments: [Comment!]!
  reactions: [Reaction!]!
  gameLogs: [GameLog!]!
  friendships: [Friendship!]!
  initiatedFriendships: [Friendship!]!
}

type Friendship {
  id: ID!
  status: FriendshipStatus!
  createdAt: DateTime!
  updatedAt: DateTime!
  initiator: UserSummary!
  recipient: UserSummary!
}

enum FriendshipStatus {
  Accepted
  Blocked
  Pending
  Rejected
}

# Game Types
type Game {
  id: ID!
  date: GameDate!
  status: GameStatus!
  arena: Arena
  league: String
  season: Int
  stage: Int
  periods: GamePeriods!
  teams: GameTeams!
  scores: GameScores!
  officials: [String!]!
  timesTied: Int
  leadChanges: Int
  nugget: String
  createdAt: DateTime!
  updatedAt: DateTime!
  homeTeamId: String!
  awayTeamId: String!
  isCompleted: Boolean!
  awayTeamScore: Int
  homeTeamScore: Int
  gameType: String!
  nbaGameId: ID
}

type GameDate {
  start: DateTime!
  end: DateTime
  duration: Int
}

type GameStatus {
  clock: String
  halftime: Boolean!
  short: String!
  long: String!
}

type GamePeriods {
  current: Int!
  total: Int!
  endOfPeriod: Boolean!
}

type GameTeams {
  home: TeamSummary!
  visitors: TeamSummary!
}

type GameScores {
  home: TeamScore!
  visitors: TeamScore!
}

type TeamScore {
  win: Int!
  loss: Int!
  series: SeriesScore!
  linescore: [Int!]!
  points: Int!
}

type SeriesScore {
  win: Int!
  loss: Int!
}

type Arena {
  name: String!
  city: String
  state: String
  country: String
}

type GameLog {
  id: ID!
  game: Game!
  user: UserSummary!
  ratingForGame: Int!
  notes: String
  tags: [String!]
  watchedDate: DateTime
  watchedSetting: String
  watchedLocation: String
  watchedScope: String
  classification: Classification!
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
  comments: CommentConnection!
  reactions: [Reaction!]!
}

enum Classification {
  Private
  Protected
  Public
}

enum GameStatusEnum {
  Scheduled
  Live
  Finished
  Cancelled
}

