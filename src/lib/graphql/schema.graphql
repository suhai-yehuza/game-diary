schema {
  query: Query
  mutation: Mutation
}

type Query {
  # User queries
  me: UserSummary
  user(id: ID!): UserSummary
  users(filters: UserFilters, pagination: PaginationInput): [UserSummary!]!
  searchUsers(
    first: Int
    after: String
    searchTerm: String
    filters: UserSearchFilters
  ): UserConnection!

  # Game queries
  game(id: ID!): Game
  games(filters: GameFilters, pagination: PaginationInput): GameConnection!
  liveGames(first: Int, after: String): GameConnection!
  gameLog(id: ID!): GameLog
  gameLogs(filters: GameLogFilters, pagination: PaginationInput): GameLogConnection!

  # Comment queries
  comments(filters: CommentFilters, pagination: PaginationInput): CommentConnection!

  # Reaction queries
  reactions(targetId: ID!, targetType: ParentType!): [Reaction!]!
}

type Mutation {
  # User mutations
  sendFriendRequest(userId: ID!): SendFriendRequestResponse!
  acceptFriendRequest(friendshipId: ID!): AcceptFriendRequestResponse!
  rejectFriendRequest(friendshipId: ID!): RejectFriendRequestResponse!
  removeFriend(friendshipId: ID!): RemoveFriendResponse!

  # Game mutations
  createGame(input: CreateGameInput!): CreateGameResponse!
  createGameLog(input: CreateGameLogInput!): CreateGameLogResponse!
  updateGameLog(id: ID!, input: CreateGameLogInput!): UpdateGameLogResponse!
  deleteGameLog(id: ID!): DeleteGameLogResponse!

  # Comment mutations
  createComment(input: CreateCommentInput!): CreateCommentResponse!
  updateComment(id: ID!, input: CreateCommentInput!): UpdateCommentResponse!
  deleteComment(id: ID!): DeleteCommentResponse!

  # Reaction mutations
  createReaction(input: CreateReactionInput!): CreateReactionResponse!
  deleteReaction(id: ID!): DeleteReactionResponse!
}

# Scalars
scalar DateTime
scalar Any

# Common Types
type ErrorResult {
  message: String!
  code: String
  field: String
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

input PaginationInput {
  first: Int
  after: String
  last: Int
  before: String
}

type AuthenticationError {
  message: String!
}

type AuthorizationError {
  message: String!
  requiredRole: String
}

type BusinessLogicError {
  code: String!
  details: String
  message: String!
}

input DateRangeInput {
  start: DateTime!
  end: DateTime
}

# User Types
type UserSummary {
  id: ID!
  username: String!
  first_name: String!
  last_name: String!
  emailAddress: String
  image_url: String
}

type DBUser {
  id: ID!
  username: String!
  first_name: String
  last_name: String
  emailAddress: String
  email_verified: Boolean
  email_verification_strategy: String
  password_enabled: Boolean
  two_factor_enabled: Boolean
  image_url: String
  banned: Boolean
  last_sign_in_at: DateTime
  external_id: String
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
  inboundFriendshipIds: [String!]
  outboundFriendshipIds: [String!]
  comments: [Comment!]!
  reactions: [Reaction!]!
  gameLogs: [GameLog!]!
  friendships: [Friendship!]!
  initiatedFriendships: [Friendship!]!
}

type Friendship {
  id: ID!
  status: FriendshipStatus!
  createdAt: DateTime!
  updatedAt: DateTime!
  initiator: UserSummary!
  recipient: UserSummary!
}

enum FriendshipStatus {
  Accepted
  Blocked
  Pending
  Rejected
}

# Game Types
type Game {
  id: ID!
  date: GameDate!
  status: GameStatus!
  arena: Arena
  league: String
  season: Int
  stage: Int
  periods: GamePeriods!
  officials: [String!]!
  timesTied: Int
  leadChanges: Int
  nugget: String
  createdAt: DateTime!
  updatedAt: DateTime!
  homeTeamId: String!
  awayTeamId: String!
  isCompleted: Boolean!
  awayTeamScore: Int
  homeTeamScore: Int
  gameType: String!
  nbaGameId: ID
}

type GameDate {
  start: DateTime!
  end: DateTime
  duration: Int
}

type GameStatus {
  clock: String
  halftime: Boolean!
  short: String!
  long: String!
}

type GamePeriods {
  current: Int!
  total: Int!
  endOfPeriod: Boolean!
}

type Arena {
  name: String!
  city: String
  state: String
  country: String
}

type GameLog {
  id: ID!
  game: Game!
  user: UserSummary!
  ratingForGame: Int!
  notes: String
  tags: [String!]
  watchedDate: DateTime
  watchedSetting: String
  watchedLocation: String
  watchedScope: String
  classification: Classification!
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
  comments: CommentConnection!
  reactions: [Reaction!]!
}

enum Classification {
  Private
  Protected
  Public
}

enum GameStatusEnum {
  Scheduled
  Live
  Finished
  Cancelled
}

# Comment Types
type Comment {
  id: ID!
  content: String!
  user: UserSummary!
  userId: ID!
  parentId: ID!
  parentType: ParentType!
  depth: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
  childComments: CommentConnection!
  reactions: [Reaction!]!
}

enum ParentType {
  game_log
  comment
}

type CommentConnection {
  edges: [CommentEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type CommentEdge {
  cursor: String!
  node: Comment!
}

# Reaction Types
type Reaction {
  id: ID!
  emoji: ReactionEmojiType!
  user: UserSummary!
  userId: ID!
  targetId: ID!
  targetType: ParentType!
  createdAt: DateTime!
  updatedAt: DateTime!
}

enum ReactionEmojiType {
  THUMBS_UP
  THUMBS_DOWN
  LOVE
  LAUGH
  WOW
  SAD
  ANGRY
  FIRE
  CLAP
  EYES
  ROCKET
  MUSCLE
  GOAT
  BULLSEYE
  BASKETBALL
  SOCCER
  FOOTBALL
  BASEBALL
  TENNIS
  GOLF
}

# Connection Types
type GameConnection {
  edges: [GameEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type GameEdge {
  cursor: String!
  node: Game!
}

type GameLogConnection {
  edges: [GameLogEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type GameLogEdge {
  cursor: String!
  node: GameLog!
}

type UserConnection {
  edges: [UserEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type UserEdge {
  cursor: String!
  node: UserSummary!
}

# Input Types
input GameFilters {
  dateRange: DateRangeInput
  status: GameStatusEnum
  teamId: ID
  search: String
  season: Int
  arena: String
}

input GameLogFilters {
  userId: ID
  gameId: ID
  dateRange: DateRangeInput
  classification: Classification
  search: String
  searchText: String
  minRating: Int
  maxRating: Int
  watchedSetting: String
  watchedLocation: String
  tags: [String!]
  hasNotes: Boolean
  watchedDateRange: DateRangeInput
  sortBy: String
  sortDirection: String
}

input CommentFilters {
  parentId: ID
  parentType: ParentType
  userId: ID
  search: String
}

input CreateCommentInput {
  content: String!
  parentId: ID!
  parentType: ParentType!
}

input UpdateCommentInput {
  id: ID!
  content: String!
}

input CreateReactionInput {
  emoji: ReactionEmojiType!
  targetId: ID!
  targetType: ParentType!
}

input CreateGameLogInput {
  gameId: ID!
  ratingForGame: Int!
  notes: String
  tags: [String!]
  watchedDate: DateTime
  watchedSetting: String
  watchedLocation: String
  watchedScope: String
  classification: Classification!
}

input UpdateGameLogInput {
  id: ID!
  ratingForGame: Int
  notes: String
  tags: [String!]
  watchedDate: DateTime
  watchedSetting: String
  watchedLocation: String
  watchedScope: String
  classification: Classification
}

input CreateGameInput {
  date: DateTime!
  homeTeamId: String!
  awayTeamId: String!
  league: String!
  season: Int!
  stage: Int!
  gameType: String!
  nbaGameId: ID
}

input UserFilters {
  search: String
  status: String
  role: String
  joinedAfter: DateTime
  joinedBefore: DateTime
  isVerified: Boolean
  hasGameLogs: Boolean
  minGameLogs: Int
  orderBy: String
}

input UserSearchFilters {
  search: String
  status: String
  role: String
  joinedAfter: DateTime
  joinedBefore: DateTime
  isVerified: Boolean
  hasGameLogs: Boolean
  minGameLogs: Int
  orderBy: String
}

# Response Types
type CreateCommentResponse {
  comment: Comment
  errors: [ErrorResult!]
}

type UpdateCommentResponse {
  comment: Comment
  errors: [ErrorResult!]
}

type DeleteCommentResponse {
  success: Boolean!
  errors: [ErrorResult!]
}

type CreateReactionResponse {
  reaction: Reaction
  errors: [ErrorResult!]
}

type DeleteReactionResponse {
  success: Boolean!
  errors: [ErrorResult!]
}

type CreateGameLogResponse {
  gameLog: GameLog
  errors: [ErrorResult!]
}

type UpdateGameLogResponse {
  gameLog: GameLog
  errors: [ErrorResult!]
}

type DeleteGameLogResponse {
  success: Boolean!
  errors: [ErrorResult!]
}

type CreateGameResponse {
  game: Game
  errors: [ErrorResult!]
}

type AcceptFriendRequestResponse {
  errors: [ErrorResult!]
  friendship: Friendship
}

type SendFriendRequestResponse {
  errors: [ErrorResult!]
  friendship: Friendship
}

type RejectFriendRequestResponse {
  errors: [ErrorResult!]
  friendship: Friendship
}

type RemoveFriendResponse {
  success: Boolean!
  errors: [ErrorResult!]
}

type UpdateUserProfileResponse {
  errors: [ErrorResult!]
  user: UserSummary
}
