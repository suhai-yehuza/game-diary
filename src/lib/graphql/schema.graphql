  points: Int!
  fgp: Float!
  tpp: Float!
  ftp: Float!
  totReb: Int!
  assists: Int!
  steals: Int!
  blocks: Int!
  turnovers: Int!
  pFouls: Int!
  plusMinus: Int!
  fastBreakPoints: Int!
  pointsInPaint: Int!
  biggestLead: Int!
  secondChancePoints: Int!
  pointsOffTurnovers: Int!
  longestRun: Int!
