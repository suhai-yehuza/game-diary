type Query {
  allPlayerStats(season: Int!): [PlayerStats!]!
  allTeamStats(season: Int!): [TeamStats!]!
  comments(parent_id: ID!): [Comment!]!
  friendship(id: ID!): Friendship
  friendships(userId: ID!): [UserBase!]!
  game(id: ID!): Game
  gameLog(gameId: ID!, userId: ID!): GameLog
  gameLogStats(filters: GameLogFilters): GameLogStats!
  gameLogs(filters: GameLogFilters, pagination: PaginationInput): PaginatedResponse!
  gameStats(id: ID!): GameStats
  games(filters: GameFilters, pagination: PaginationInput): PaginatedResponse!
  leagues: [League!]!
  liveGames: [Game!]!
  player(id: ID!): Player
  playerGameStats(game_id: ID!, player_id: ID!): PlayerStats
  playerSeasonStats(playerId: ID!, season: Int!): PlayerStats
  playerSeasonStatsList(pagination: PaginationInput, playerId: ID!): PaginatedResponse!
  playerStats(playerId: ID!, season: Int!): PlayerStats
  playerStatsByTeam(season: Int!, team: String!): [PlayerStats!]!
  players(filters: PlayerFilters, pagination: PaginationInput): PaginatedResponse!
  reactions(targetId: ID!): [Reaction!]!
  seasons: [Season!]!
  team(id: ID!): Team
  teamGameStats(game_id: ID!, team: String!): TeamStats
  teamStats(pagination: PaginationInput, sort: TeamSortInput, teamId: ID!): [TeamStats!]!
  teams(filters: TeamFilters, pagination: PaginationInput): [Team!]!
  topPlayers(season: Int!): [Player!]!
  user(id: ID!): User
  users(pagination: PaginationInput): PaginatedResponse!
}

