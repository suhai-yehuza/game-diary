  user: UserSummary
  user_id: ID
  anonymous_name: String
  anonymous_email: String
  parent_id: ID!
  parent_type: ParentType!
  depth: Int!
  is_approved: Boolean!
  created_at: DateTime!
  updated_at: DateTime!
  deleted_at: DateTime
  childComments: PublicCommentConnection!
  totalChildCommentCount: Int!
  reactions: [PublicReaction!]!
  totalReactionCount: Int!
}

type PublicCommentConnection {
  edges: [PublicCommentEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type PublicCommentEdge {
  cursor: String!
  node: PublicComment!
}

# Public Reaction Types (for NBA games, players, teams - no authentication required)
type PublicReaction {
  id: ID!
