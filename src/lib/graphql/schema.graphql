schema {
  query: Query
  mutation: Mutation
}

type Query {
  # User queries
  me: UserSummary
  user(id: ID!): UserSummary
  users(filters: UserFilters, pagination: PaginationInput): [UserSummary!]!
  searchUsers(
    first: Int
    after: String
    searchTerm: String
    searchField: String
    filters: UserSearchFilters
    pagination: PaginationInput
  ): UserConnection!
  searchGameLogs(
    first: Int
    after: String
    searchTerm: String
    searchField: String
    filters: GameLogSearchFilters
  ): GameLogConnection!

  # Game queries
  game(id: ID!): Game
  games(filters: GameFilters, pagination: PaginationInput): GameConnection!
  liveGames(first: Int, after: String): GameConnection!
  gameLog(id: ID!): GameLog
  gameLogs(filters: GameLogFilters, pagination: PaginationInput): GameLogConnection!
  friendsGameLogs(pagination: PaginationInput): GameLogConnection!

  # NBA Player queries
  nbaPlayer(id: ID!): NBAPlayer
  nbaPlayers(filters: NBAPlayerFilters, pagination: PaginationInput): NBAPlayerConnection!

  # Team queries
  team(id: ID!): Team
  basketball_teams(filters: TeamFilters, pagination: PaginationInput): TeamConnection!

  # Friendship queries
  userFriendships(filters: FriendshipFilters, pagination: PaginationInput): FriendshipConnection!
  friendshipRequests(pagination: PaginationInput): FriendshipConnection!
  friendshipStatus(userId: ID!): FriendshipStatusResponse!

  # Comment queries
  comments(filters: CommentFilters, pagination: PaginationInput): CommentConnection!

  # Public Comment queries (no authentication required)
  publicComments(
    filters: PublicCommentFilters
    pagination: PaginationInput
  ): PublicCommentConnection!

  # Reaction queries
  reactions(targetId: ID!, targetType: ParentType!): [Reaction!]!

  # Public Reaction queries (no authentication required)
  publicReactions(targetId: ID!, targetType: ParentType!): [PublicReaction!]!

  # Notification queries
  userNotifications(
    filters: NotificationFilters
    pagination: PaginationInput
  ): NotificationConnection!
  unreadNotificationsCount: Int!
}

type Mutation {
  # User mutations
  sendFriendRequest(userId: ID!): SendFriendRequestResponse!
  acceptFriendRequest(friendshipId: ID!): AcceptFriendRequestResponse!
  rejectFriendRequest(friendshipId: ID!): RejectFriendRequestResponse!
  removeFriend(friendshipId: ID!): RemoveFriendResponse!

  # Game mutations
  createGame(input: CreateGameInput!): CreateGameResponse!
  createGameLog(input: CreateGameLogInput!): CreateGameLogResponse!
  updateGameLog(id: ID!, input: UpdateGameLogInput!): UpdateGameLogResponse!
  deleteGameLog(id: ID!): DeleteGameLogResponse!

  # Comment mutations
  createComment(input: CreateCommentInput!): CreateCommentResponse!
  updateComment(id: ID!, input: UpdateCommentInput!): UpdateCommentResponse!
  deleteComment(id: ID!): DeleteCommentResponse!

  # Public Comment mutations (no authentication required)
  createPublicComment(input: CreatePublicCommentInput!): CreatePublicCommentResponse!
  updatePublicComment(id: ID!, input: UpdatePublicCommentInput!): UpdatePublicCommentResponse!
  deletePublicComment(id: ID!): DeletePublicCommentResponse!

  # Reaction mutations
  createReaction(input: CreateReactionInput!): CreateReactionResponse!
  deleteReaction(id: ID!): DeleteReactionResponse!

  # Public Reaction mutations (no authentication required)
  createPublicReaction(input: CreatePublicReactionInput!): CreatePublicReactionResponse!
  deletePublicReaction(id: ID!): DeletePublicReactionResponse!

  # Notification mutations
  markNotificationAsRead(notificationId: ID!): MarkNotificationAsReadResponse!
  markAllNotificationsAsRead: MarkAllNotificationsAsReadResponse!
}

# Scalars
scalar DateTime
scalar Any
scalar JSON

# Common Types
type ErrorResult {
  message: String!
  code: String
  field: String
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

input PaginationInput {
  first: Int
  after: String
  last: Int
  before: String
}

type AuthenticationError {
  message: String!
}

type AuthorizationError {
  message: String!
  requiredRole: String
}

type BusinessLogicError {
  code: String!
  details: String
  message: String!
}

input DateRangeInput {
  start: DateTime!
  end: DateTime
}

# User Types
type UserSummary {
  id: ID!
  username: String!
  first_name: String!
  last_name: String!
  email_address: String
  phone_number: String
  image_url: String
  isAdmin: Boolean!
  created_at: DateTime
}

type DBUser {
  id: ID!
  username: String!
  first_name: String
  last_name: String
  email_address: String
  phone_number: String
  image_url: String
  isAdmin: Boolean!
  object: String!
  has_image: Boolean!
  profile_image_url: String
  primary_email_address_id: String
  primary_phone_number_id: String
  external_id: String
  last_active_at: DateTime
  last_sign_in_at: DateTime
  bio: String
  timezone: String
  preferred_language: String
  created_at: DateTime!
  updated_at: DateTime!
  deleted_at: DateTime
  inbound_friendship_ids: [String!]
  outbound_friendship_ids: [String!]
  comments: [Comment!]!
  reactions: [Reaction!]!
  gameLogs: [GameLog!]!
  friendships: [Friendship!]!
  initiatedFriendships: [Friendship!]!
}

type Friendship {
  id: ID!
  status: FriendshipStatus!
  created_at: DateTime!
  updated_at: DateTime!
  initiator: UserSummary!
  recipient: UserSummary!
}

enum FriendshipStatus {
  ACCEPTED
  BLOCKED
  PENDING
  REJECTED
}

# Game Types
type Game {
  id: ID!
  date: DateTime!
  status: JSON
  season: String
  game_id: String
  teams: JSON
  home_team: JSON
  away_team: JSON
  scores: JSON
  arena: JSON
  periods: JSON
  average_rating: Float
  total_ratings: Int
  created_at: DateTime!
  updated_at: DateTime!
  deleted_at: DateTime
  publicComments: PublicCommentConnection!
  totalPublicCommentCount: Int!
  publicReactions: [PublicReaction!]!
  totalPublicReactionCount: Int!
}

type Team {
  id: ID!
  name: String!
  nickname: String
  code: String
  city: String
  logo: String
  all_star: Boolean!
  nba_franchise: Boolean!
  conference: String
  leagues: JSON
  created_at: DateTime!
  updated_at: DateTime!
  publicComments: PublicCommentConnection!
  totalPublicCommentCount: Int!
  publicReactions: [PublicReaction!]!
  totalPublicReactionCount: Int!
}

# NBA Player Types
type NBAPlayer {
  id: ID!
  first_name: String!
  last_name: String!
  birth: JSON
  nba: JSON
  height: JSON
  weight: JSON
  college: String
  affiliation: String
  teams: JSON
  leagues: JSON
  image_url: String
  created_at: DateTime!
  updated_at: DateTime!
  deleted_at: DateTime
  publicComments: PublicCommentConnection!
  totalPublicCommentCount: Int!
  publicReactions: [PublicReaction!]!
  totalPublicReactionCount: Int!
}

type GameLog {
  id: ID!
  game_id: String!
  game: Game!
  user: UserSummary!
  rating_for_game: Int!
  notes: String
  tags: [String!]
  watched_date: DateTime
  watched_setting: String
  watched_location: String
  watched_scope: String
  classification: Classification!
  created_at: DateTime!
  updated_at: DateTime!
  deleted_at: DateTime
  comments: CommentConnection!
  totalCommentCount: Int!
  reactions: [Reaction!]!
  totalReactionCount: Int!
}

enum Classification {
  PRIVATE
  PROTECTED
  PUBLIC
}

