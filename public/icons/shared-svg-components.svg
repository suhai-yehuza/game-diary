<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <!-- Shared definitions and patterns -->
  <defs>
    <!-- Standard viewBox for 200x200 icons -->
    <symbol id="base-200x200" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="90" stroke="#000" stroke-width="2" fill="none"/>
    </symbol>
    
    <!-- Basketball pattern -->
    <g id="basketball-lines">
      <path d="M100 10 L100 190" stroke="#000" stroke-width="2"/>
      <path d="M10 100 L190 100" stroke="#000" stroke-width="2"/>
      <path d="M30 30 L170 170" stroke="#000" stroke-width="2"/>
      <path d="M30 170 L170 30" stroke="#000" stroke-width="2"/>
    </g>
    
    <!-- Standard colors -->
    <linearGradient id="orange-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B00;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="team-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#333333;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="user-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E5E7EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9CA3AF;stop-opacity:1" />
    </linearGradient>
    
    <!-- Basketball icon template -->
    <g id="basketball-icon">
      <circle cx="100" cy="100" r="20" fill="url(#orange-gradient)"/>
      <path d="M80 100 L120 100" stroke="#ffffff" stroke-width="1.5"/>
      <path d="M100 80 L100 120" stroke="#ffffff" stroke-width="1.5"/>
      <path d="M85 85 L115 115" stroke="#ffffff" stroke-width="1.5"/>
      <path d="M85 115 L115 85" stroke="#ffffff" stroke-width="1.5"/>
    </g>
    
    <!-- Court elements -->
    <g id="court-elements">
      <path d="M40 100 L160 100" stroke="#ffffff" stroke-width="2"/>
      <path d="M100 40 L100 160" stroke="#ffffff" stroke-width="2"/>
      <circle cx="100" cy="100" r="30" stroke="#ffffff" stroke-width="2" fill="none"/>
    </g>
    
    <!-- Hoop elements -->
    <g id="hoop-elements">
      <path d="M140 80 L140 120" stroke="#ffffff" stroke-width="3"/>
      <path d="M140 80 L160 80" stroke="#ffffff" stroke-width="3"/>
      <path d="M140 120 L160 120" stroke="#ffffff" stroke-width="3"/>
      <rect x="160" y="70" width="10" height="60" fill="#ffffff"/>
    </g>
    
    <!-- Player silhouette -->
    <g id="player-silhouette">
      <circle cx="100" cy="80" r="25" fill="#9CA3AF"/>
      <path d="M100 40 C 130 40, 160 70, 160 100 C 160 130, 130 160, 100 160 C 70 160, 40 130, 40 100 C 40 70, 70 40, 100 40" 
            fill="#9CA3AF"/>
    </g>
  </defs>
</svg> 