<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Shared gradients -->
    <linearGradient id="team-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#333333;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orange-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B00;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="url(#team-gradient)"/>
  
  <!-- User figure (shared pattern) -->
  <g fill="#ffffff" stroke="#ffffff">
    <!-- Head -->
    <circle cx="100" cy="80" r="30"/>
    
    <!-- Body -->
    <g stroke-width="4">
      <path d="M70 110 L130 110"/>
      <path d="M70 110 L60 160"/>
      <path d="M130 110 L140 160"/>
    </g>
    
    <!-- Arms -->
    <g stroke-width="4">
      <path d="M70 110 L50 130"/>
      <path d="M130 110 L150 130"/>
    </g>
  </g>
  
  <!-- Basketball (shared pattern) -->
  <g>
    <circle cx="100" cy="130" r="15" fill="url(#orange-gradient)"/>
    <g stroke="#ffffff" stroke-width="1">
      <path d="M85 130 L115 130"/>
      <path d="M100 115 L100 145"/>
      <path d="M90 120 L110 140"/>
      <path d="M90 140 L110 120"/>
    </g>
  </g>
  
  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="90" stroke="#ffffff" stroke-width="2" fill="none"/>
</svg> 