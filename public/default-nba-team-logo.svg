<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Shared orange gradient -->
    <linearGradient id="orange-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B00;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Basketball circle -->
  <circle cx="100" cy="100" r="90" fill="url(#orange-gradient)" stroke="#000" stroke-width="2"/>
  
  <!-- Basketball lines (shared pattern) -->
  <g>
    <path d="M100 10 L100 190" stroke="#000" stroke-width="2"/>
    <path d="M10 100 L190 100" stroke="#000" stroke-width="2"/>
    <path d="M30 30 L170 170" stroke="#000" stroke-width="2"/>
    <path d="M30 170 L170 30" stroke="#000" stroke-width="2"/>
  </g>
  
  <!-- NBA text -->
  <text x="100" y="110" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#000">NBA</text>
</svg> 