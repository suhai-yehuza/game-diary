name: Optimized Deployment Workflow

on:
  workflow_call:
    inputs:
      workflow-name:
        description: 'Name of the workflow'
        required: true
        type: string
      environment:
        description: 'Deployment environment'
        required: true
        type: string
      deploy-to-vercel:
        description: 'Whether to deploy to Vercel'
        required: false
        type: boolean
        default: true
    secrets:
      VERCEL_ORG_ID:
        required: false
      VERCEL_PROJECT_ID:
        required: false
      VERCEL_TOKEN:
        required: false
      DATABASE_URL:
        required: false
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:
        required: false
      CLERK_SECRET_KEY:
        required: false
      CLERK_WEBHOOK_SIGNING_SECRET:
        required: false
      VERCEL_AUTOMATION_BYPASS_SECRET:
        required: false

jobs:
  # Combined validation job to reduce parallel jobs
  validation:
    name: Validation (Quality Gate + Unit Tests + Database Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Quality Gate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
        run: |
          echo "Running quality gate validation for ${{ inputs.environment }} environment..."
          ./scripts/deployment-validator.sh ci --skip-e2e-tests --skip-db-tests

      - name: Run Unit Tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
        run: pnpm test:unit

      - name: Run Database Tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
        run: |
          echo "🔍 Validating database trigger definitions..."
          pnpm db:validate-triggers
          echo "🧪 Running comprehensive database trigger tests..."
          pnpm db:test:all-triggers

      - uses: codecov/codecov-action@v4
        if: success()
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

      - name: Upload Validation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-artifacts
          path: |
            logs/
            test-results/
            playwright-report/
            coverage/
            build/
          retention-days: 7

  # Combined E2E tests to reduce parallel jobs
  e2e-tests:
    name: E2E Tests (Combined)
    needs: [validation]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Combined E2E Tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
          DEPLOYMENT_URL: ${{ env.DEFAULT_LOCALHOST_URL || 'http://localhost:3000' }}
          E2E_MOCK_MODE: 'true'
          API_MOCK_MODE: 'true'
          CI: 'true'
        run: |
          echo "Running combined E2E tests..."
          # Run critical tests first
          pnpm exec playwright test tests/e2e/functional/mock-verification.spec.ts --reporter=line
          pnpm exec playwright test tests/e2e/functional/smoke.spec.ts --workers=2 --reporter=line
          pnpm exec playwright test tests/e2e/functional/live-games.spec.ts --workers=2 --reporter=line
          pnpm exec playwright test tests/e2e/functional/responsive.spec.ts --workers=2 --reporter=line
          # Ensure coverage directory exists
          mkdir -p coverage
          # Create a placeholder coverage file if none exists
          if [ ! -f "coverage/lcov.info" ] && [ ! -f "coverage/coverage.json" ]; then
            echo "No coverage files found, creating placeholder"
            echo '{"type": "Coverage", "version": "1.0", "data": {}}' > coverage/coverage.json
          fi

      - name: Upload E2E Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            logs/
            test-results/
            playwright-report/
            coverage/
            build/
          retention-days: 7
          if-no-files-found: warn

  deploy:
    name: Deploy to Vercel
    if: ${{ inputs.deploy-to-vercel }}
    needs: [e2e-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    outputs:
      deployment-url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Vercel
        id: deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          DEPLOYMENT_URL: ${{ secrets.VERCEL_PREVIEW_URL }}
          E2E_AUTH_BYPASS: 'true'
          TEST_USER_EMAIL: 'test@game-diary.com'
          TEST_USER_ID: 'test_user_123'
        run: |
          echo "Deploying to ${{ inputs.environment }} environment..."

          # Install Vercel CLI
          npm install --global vercel@latest

          # Deploy to Vercel
          if [ "${{ inputs.environment }}" = "Production" ]; then
            vercel --prod --token ${{ secrets.VERCEL_TOKEN }}
          else
            vercel --token ${{ secrets.VERCEL_TOKEN }}
          fi

          # Get the deployment URL from the deployment output
          DEPLOYMENT_URL=$(vercel --token ${{ secrets.VERCEL_TOKEN }} 2>&1 | grep -o 'https://[^[:space:]]*\.vercel\.app' | head -1)

          if [ -z "$DEPLOYMENT_URL" ]; then
            # Fallback: try to get from vercel ls
            DEPLOYMENT_URL=$(vercel ls --token ${{ secrets.VERCEL_TOKEN }} | grep -E ".*\.vercel\.app" | head -1 | awk '{print $2}')
          fi

          if [ -z "$DEPLOYMENT_URL" ]; then
            # Final fallback: use environment-specific URL
            if [ "${{ inputs.environment }}" = "Production" ]; then
              DEPLOYMENT_URL="https://game-diary.vercel.app"
            else
              DEPLOYMENT_URL="${{ secrets.VERCEL_PREVIEW_URL }}"
            fi
          fi

          echo "Deployment URL: $DEPLOYMENT_URL"
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT

      - name: Upload Deploy Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-artifacts
          path: |
            logs/
            test-results/
            playwright-report/
            coverage/
            build/
          retention-days: 7
          if-no-files-found: warn

  # Optional post-deploy smoke tests (only run for production)
  e2e-post-deploy-smoke:
    name: E2E Post-Deploy Smoke Tests (Optional)
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    if: ${{ inputs.environment == 'Production' }} # Only run for production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Post-Deploy Smoke E2E
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment-url }}
          E2E_AUTH_BYPASS: 'true'
          TEST_USER_EMAIL: 'test@game-diary.com'
          TEST_USER_ID: 'test_user_123'
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          E2E_MOCK_MODE: 'true'
          API_MOCK_MODE: 'true'
          CI: 'true'
        run: |
          echo "Running post-deploy smoke E2E tests..."
          pnpm exec playwright test tests/e2e/functional/smoke.spec.ts --workers=2 --reporter=line
          # Ensure coverage directory exists
          mkdir -p coverage
          # Create a placeholder coverage file if none exists
          if [ ! -f "coverage/lcov.info" ] && [ ! -f "coverage/coverage.json" ]; then
            echo "No coverage files found, creating placeholder"
            echo '{"type": "Coverage", "version": "1.0", "data": {}}' > coverage/coverage.json
          fi

      - name: Upload Playwright test results (smoke)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-smoke-playwright-test-results
          path: |
            test-results/
            playwright-report/
            coverage/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Deployment Artifacts (smoke)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-smoke-deployment-artifacts
          path: |
            test-results/
            playwright-report/
            coverage/
          retention-days: 7
          if-no-files-found: warn

  # Optional post-deploy navigation tests (only run for production)
  e2e-post-deploy-navigation:
    name: E2E Navigation Tests
    if: false # Temporarily skipped
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Post-Deploy Navigation E2E
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment-url }}
          E2E_AUTH_BYPASS: 'true'
          TEST_USER_EMAIL: 'test@game-diary.com'
          TEST_USER_ID: 'test_user_123'
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          E2E_MOCK_MODE: 'true'
          API_MOCK_MODE: 'true'
          CI: 'true'
        run: |
          echo "Running post-deploy navigation E2E tests..."
          pnpm exec playwright test tests/e2e/functional/navigation.spec.ts --workers=2 --reporter=line
          # Ensure coverage directory exists
          mkdir -p coverage
          # Create a placeholder coverage file if none exists
          if [ ! -f "coverage/lcov.info" ] && [ ! -f "coverage/coverage.json" ]; then
            echo "No coverage files found, creating placeholder"
            echo '{"type": "Coverage", "version": "1.0", "data": {}}' > coverage/coverage.json
          fi

      - name: Upload Playwright test results (navigation)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-navigation-playwright-test-results
          path: |
            test-results/
            playwright-report/
            coverage/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Deployment Artifacts (navigation)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-navigation-deployment-artifacts
          path: |
            test-results/
            playwright-report/
            coverage/
          retention-days: 7
          if-no-files-found: warn
