name: Promote Staging to Production (Weekdays at 9am Pacific)

# Every weekday at 9am Pacific workflow that:
# - Checks for successful staging commits that are 24+ hours old
# - Validates that commits have passed all staging deployment workflows
# - Cherry-picks commits from staging to master if they meet all criteria
# - Only processes commits that have passed staging validation

on:
  schedule:
    - cron: '0 17 * * 1-5' # every weekday (Mon-Fri) at 5pm UTC (9am Pacific)

permissions:
  contents: write
  actions: read

jobs:
  check-and-promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: staging

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all branches
        run: |
          git fetch origin master
          git fetch origin staging

      - name: Get staging commits not in master
        id: get_commits
        run: |
          # Get all staging commits that are not in master
          STAGING_COMMITS=$(git log --oneline origin/master..origin/staging --format="%H %ct %s" | tac)

          if [ -z "$STAGING_COMMITS" ]; then
            echo "No new commits in staging"
            echo "commits_to_process=" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Found commits in staging not in master:"
          echo "$STAGING_COMMITS"

          # Process each commit to check if it's 24+ hours old
          CURRENT_TIME=$(date +%s)
          COMMITS_TO_MERGE=""

          while IFS= read -r line; do
            if [ -n "$line" ]; then
              COMMIT_HASH=$(echo "$line" | cut -d' ' -f1)
              COMMIT_TIME=$(echo "$line" | cut -d' ' -f2)
              COMMIT_MSG=$(echo "$line" | cut -d' ' -f3-)

              AGE_HOURS=$(( (CURRENT_TIME - COMMIT_TIME) / 3600 ))

              echo "Commit: $COMMIT_HASH"
              echo "  Age: $AGE_HOURS hours"
              echo "  Message: $COMMIT_MSG"

              if [ "$AGE_HOURS" -ge 24 ]; then
                echo "  ✅ Ready for merge (24+ hours old)"
                COMMITS_TO_MERGE="$COMMITS_TO_MERGE $COMMIT_HASH"
              else
                echo "  ⏳ Not ready yet ($AGE_HOURS hours old)"
              fi
            fi
          done <<< "$STAGING_COMMITS"

          if [ -n "$COMMITS_TO_MERGE" ]; then
            echo "commits_to_process=true" >> $GITHUB_OUTPUT
            echo "commits_list=$COMMITS_TO_MERGE" >> $GITHUB_OUTPUT
          else
            echo "commits_to_process=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate staging deployment success
        if: steps.get_commits.outputs.commits_to_process == 'true'
        id: validate_deployments
        run: |
          echo "Validating staging deployment success for commits..."

          # Get the list of commits to check
          COMMITS_TO_CHECK="${{ steps.get_commits.outputs.commits_list }}"
          VALID_COMMITS=""

          for commit in $COMMITS_TO_CHECK; do
            echo "Checking deployment status for commit: $commit"

            # Check if staging workflow completed successfully for this commit
            # We'll check the staging workflow run status
            WORKFLOW_STATUS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=$commit&workflow_id=staging.yml" | \
              jq -r '.workflow_runs[0].conclusion // "unknown"')

            echo "  Workflow status: $WORKFLOW_STATUS"

            if [ "$WORKFLOW_STATUS" = "success" ]; then
              echo "  ✅ Staging deployment successful"
              VALID_COMMITS="$VALID_COMMITS $commit"
            else
              echo "  ❌ Staging deployment failed or incomplete"
            fi
          done

          if [ -n "$VALID_COMMITS" ]; then
            echo "valid_commits=true" >> $GITHUB_OUTPUT
            echo "valid_commits_list=$VALID_COMMITS" >> $GITHUB_OUTPUT
          else
            echo "valid_commits=false" >> $GITHUB_OUTPUT
          fi

      - name: Merge commits to master
        if: steps.validate_deployments.outputs.valid_commits == 'true'
        run: |
          echo "Merging validated commits to master..."

          # Checkout master
          git checkout master
          git pull origin master

          # Merge each validated commit individually
          for commit in ${{ steps.validate_deployments.outputs.valid_commits_list }}; do
            echo "Merging validated commit: $commit"

            # Check if fast-forward merge is possible
            if git merge-base --is-ancestor master "$commit"; then
              echo "Fast-forward merge possible for $commit"
              git merge --ff-only "$commit"
            else
              echo "Creating merge commit for $commit"
              git merge --no-ff "$commit" -m "Promote staging commit $commit to production (auto-promotion)"
            fi
          done

          # Push to master
          git push origin master

          echo "Successfully promoted commits to production"

      - name: Summary
        if: always()
        run: |
          echo "## 🔄 Staging to Production Promotion Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commits Found:** ${{ steps.get_commits.outputs.commits_to_process }}" >> $GITHUB_STEP_SUMMARY
          echo "**Valid Commits:** ${{ steps.validate_deployments.outputs.valid_commits }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.get_commits.outputs.commits_to_process }}" = "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Commits Checked:** ${{ steps.get_commits.outputs.commits_list }}" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.validate_deployments.outputs.valid_commits }}" = "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Successfully promoted commits to production**" >> $GITHUB_STEP_SUMMARY
            echo "**Commits promoted:** ${{ steps.validate_deployments.outputs.valid_commits_list }}" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.get_commits.outputs.commits_to_process }}" = "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **No commits passed staging validation**" >> $GITHUB_STEP_SUMMARY
            echo "All commits must have successful staging deployments to be promoted." >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⏭️ **No commits ready for promotion (must be 24+ hours old)**" >> $GITHUB_STEP_SUMMARY
          fi
