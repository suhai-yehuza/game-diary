name: Budget Controls and Cost Optimization

# This workflow demonstrates budget controls and cost optimization strategies
# for GitHub Actions. You can integrate these patterns into your existing workflows.

on:
  workflow_call:
    inputs:
      max-minutes:
        description: 'Maximum runtime in minutes'
        required: false
        type: number
        default: 30
      max-parallel-jobs:
        description: 'Maximum parallel jobs'
        required: false
        type: number
        default: 4
      artifact-retention-days:
        description: 'Artifact retention days'
        required: false
        type: number
        default: 7

jobs:
  budget-check:
    name: Budget Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check current month usage
        run: |
          echo "📊 GitHub Actions Budget Check"
          echo "Current month: $(date +%B %Y)"
          echo "Max runtime per job: ${{ inputs.max-minutes }} minutes"
          echo "Max parallel jobs: ${{ inputs.max-parallel-jobs }}"
          echo "Artifact retention: ${{ inputs.artifact-retention-days }} days"

          # You can add custom budget logic here
          # For example, check if you're approaching monthly limits

          echo "✅ Budget check passed"

  cost-optimized-test:
    name: Cost Optimized Test
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.max-minutes }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies (cached)
        run: pnpm install --frozen-lockfile

      - name: Run tests with timeout
        run: |
          # Set a timeout to prevent runaway tests
          timeout ${{ inputs.max-minutes }}m pnpm test:unit || exit 1

      - name: Upload artifacts (with retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: test-results/
          retention-days: ${{ inputs.artifact-retention-days }}

  parallel-job-limit:
    name: Parallel Job Limit Example
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.max-minutes }}
    strategy:
      # Limit parallel jobs to control costs
      max-parallel: ${{ inputs.max-parallel-jobs }}
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Run browser test
        run: |
          echo "Testing browser: ${{ matrix.browser }}"
          # Your browser-specific test logic here
