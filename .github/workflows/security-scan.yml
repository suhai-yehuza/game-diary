name: Security Analysis

on:
  push:
    branches: ['main', 'master', 'staging', 'production']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    branches: ['main', 'master', 'staging', 'production']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  schedule:
    # Run security scans every day at 3:00 UTC
    - cron: '0 3 * * *'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: |
          echo "Running pnpm audit..."
          pnpm audit --audit-level=moderate || {
            echo "⚠️ Security vulnerabilities found. Please review and fix them."
            exit 1
          }

      - name: Run ESLint security rules
        run: |
          echo "Running ESLint security checks..."
          pnpm eslint src/ --ext .ts,.tsx,.js,.jsx --config eslint.config.js || {
            echo "⚠️ ESLint security issues found. Please review and fix them."
            exit 1
          }

      - name: Check for secrets in code
        run: |
          echo "Checking for potential secrets in code..."
          # More precise check for actual secrets, avoiding false positives
          # Look for patterns that are more likely to be actual secrets
          if grep -r -i -E "(api_key|secret_key|private_key|access_token|auth_token|password=)" src/ --exclude-dir=node_modules --exclude-dir=generated | grep -v -E "(//|/\*|#|console\.|process\.env|import|export|function|const|let|var|type|interface|class)" | grep -v -E "(keyof|typeof|Object\.keys|\.key|\.token|\.secret)"; then
            echo "⚠️ Potential secrets found in code. Please review."
            exit 1
          fi

          # Check for hardcoded API keys or tokens (more specific patterns)
          if grep -r -E "(sk-[a-zA-Z0-9]{48}|pk_[a-zA-Z0-9]{48}|[a-zA-Z0-9]{32,})" src/ --exclude-dir=node_modules --exclude-dir=generated | grep -v -E "(//|/\*|#|console\.|process\.env|import|export|function|const|let|var|type|interface|class)" | grep -v -E "(example|test|mock|dummy|placeholder)"; then
            echo "⚠️ Potential hardcoded API keys found. Please review."
            exit 1
          fi

          echo "✅ No obvious secrets found in code"

      - name: Security scan summary
        run: |
          echo "✅ Security scan completed successfully"
          echo "📊 No critical security issues found"

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          # If you have a custom build process, add it here
          # pnpm run build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{matrix.language}}'
