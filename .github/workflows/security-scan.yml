name: Security Scan

on:
  push:
    branches: ['main', 'master', 'staging', 'production']
  pull_request:
    branches: ['main', 'master', 'staging', 'production']
  schedule:
    # Run security scans every day at 3:00 UTC
    - cron: '0 3 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: |
          echo "Running pnpm audit..."
          pnpm audit --audit-level=moderate || {
            echo "⚠️ Security vulnerabilities found. Please review and fix them."
            exit 1
          }

      - name: Run ESLint security rules
        run: |
          echo "Running ESLint security checks..."
          pnpm eslint src/ --ext .ts,.tsx,.js,.jsx --config .eslintrc.js || {
            echo "⚠️ ESLint security issues found. Please review and fix them."
            exit 1
          }

      - name: Check for secrets in code
        run: |
          echo "Checking for potential secrets in code..."
          # Basic check for common secret patterns
          if grep -r -i "password\|secret\|key\|token" src/ --exclude-dir=node_modules | grep -v "//\|/\*\|#"; then
            echo "⚠️ Potential secrets found in code. Please review."
            exit 1
          fi

      - name: Security scan summary
        run: |
          echo "✅ Security scan completed successfully"
          echo "📊 No critical security issues found"
