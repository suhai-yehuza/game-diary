name: Pre-Production Deployment

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '8'

jobs:
  # Pre-deployment E2E Tests
  pre-deployment-e2e:
    name: Pre-Deployment E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Setup test environment
        run: pnpm test:e2e:optimize

      - name: Run comprehensive E2E tests
        run: pnpm test:e2e:responsive:popular

      - name: Run performance tests
        run: pnpm test:e2e:performance

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pre-deployment-e2e-results
          path: |
            test-results/
            playwright-report/
          retention-days: 30

  # Cross-browser compatibility tests
  cross-browser-tests:
    name: Cross-Browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event.inputs.environment == 'syehuza/demo' || github.ref == 'refs/heads/syehuza/demo'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Setup test environment
        run: pnpm test:e2e:optimize

      - name: Run cross-browser tests
        run: pnpm test:e2e:cross-browser

      - name: Upload cross-browser results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-browser-results
          path: |
            test-results/
            playwright-report/
          retention-days: 30

  # Load testing (for pre-prod only)
  load-testing:
    name: Load Testing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.inputs.environment == 'syehuza/demo' || github.ref == 'refs/heads/syehuza/demo'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Setup test environment
        run: pnpm test:e2e:optimize

      - name: Run load tests
        run: |
          # Run tests with multiple workers to simulate load
          for i in {1..3}; do
            pnpm playwright test tests/e2e/responsive.spec.ts --config=playwright.popular.config.ts --project=chromium &
          done
          wait

      - name: Upload load test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 30

  # Deploy to staging/pre-prod
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'syehuza/demo' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [pre-deployment-e2e, cross-browser-tests, load-testing]
    if: success()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: ${{ github.event.inputs.environment == 'syehuza/demo' && '--prod' || '' }}

  # Post-deployment smoke tests
  post-deployment-smoke:
    name: Post-Deployment Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [deploy]
    if: success()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Setup test environment
        run: pnpm test:e2e:optimize

      - name: Run smoke tests
        run: pnpm test:e2e:fast

      - name: Upload smoke test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # Deployment summary
  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [pre-deployment-e2e, cross-browser-tests, load-testing, deploy, post-deployment-smoke]
    if: always()

    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: deployment-test-results

      - name: Generate deployment summary
        run: |
          echo "## Pre-Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Environment: ${{ github.event.inputs.environment || 'syehuza/demo' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Pre-deployment E2E Tests: ${{ needs.pre-deployment-e2e.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Cross-browser Tests: ${{ needs.cross-browser-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Load Testing: ${{ needs.load-testing.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Deployment: ${{ needs.deploy.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Post-deployment Smoke Tests: ${{ needs.post-deployment-smoke.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Artifacts" >> $GITHUB_STEP_SUMMARY
          if [ -d "deployment-test-results" ]; then
            find deployment-test-results -name "*.json" -exec echo "- {}" \; >> $GITHUB_STEP_SUMMARY
          fi
