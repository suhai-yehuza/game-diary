name: Dependency Updates

on:
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sunday
  workflow_dispatch: # Allow manual triggering
  repository_dispatch:
    types: [dependency-update]

jobs:
  update-deps:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      security-events: write
    env:
      NODE_VERSION: '22'
      PNPM_VERSION: '10'
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PORT: 3100

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install dependencies
        run: pnpm install

      - name: Check for outdated dependencies
        id: check
        run: |
          echo "OUTDATED=$(pnpm outdated --json)" >> $GITHUB_OUTPUT
          if [ "$(echo $OUTDATED | jq 'length')" -gt 0 ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi

      - name: Security audit
        if: steps.check.outputs.has_updates == 'true'
        run: pnpm audit

      - name: Run linting
        if: steps.check.outputs.has_updates == 'true'
        run: pnpm lint

      - name: Type check
        if: steps.check.outputs.has_updates == 'true'
        run: pnpm typecheck

      - name: Run tests
        if: steps.check.outputs.has_updates == 'true'
        run: |
          pnpm test
          pnpm test:e2e

      - name: Build Next.js app
        run: pnpm build

      - name: Check bundle size
        if: steps.check.outputs.has_updates == 'true'
        run: pnpm check:size

      - name: Create Pull Request
        if: steps.check.outputs.has_updates == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): update dependencies'
          title: 'chore(deps): update dependencies'
          body: |
            This PR updates the following dependencies:

            ${{ steps.check.outputs.OUTDATED }}

            Changes made:
            - Updated outdated dependencies to their latest versions
            - Verified compatibility with existing code
            - Ran tests to ensure everything works as expected
            - Performed security audit
            - Checked bundle size impact
          branch: chore/update-dependencies
          base: master
          labels: dependencies,security
          delete-branch: true

      - name: Comment on PR
        if: steps.check.outputs.has_updates == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: 'chore/update-dependencies',
              state: 'open'
            });

            if (pr.length > 0) {
              const testStatus = process.env.TEST_STATUS || '✅ All tests passed successfully!';
              const auditStatus = process.env.AUDIT_STATUS || '✅ Security audit passed!';
              const bundleStatus = process.env.BUNDLE_STATUS || '✅ Bundle size check passed!';

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr[0].number,
                body: `
                  ## Update Status

                  ${testStatus}
                  ${auditStatus}
                  ${bundleStatus}

                  ### Updated Dependencies
                  \`\`\`json
                  ${process.env.OUTDATED}
                  \`\`\`
                `
              });
            }

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: 'chore/update-dependencies',
              state: 'open'
            });

            if (pr.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr[0].number,
                body: '❌ Dependency update failed. Please check the workflow logs for details.'
              });
            }
