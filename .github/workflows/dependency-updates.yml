name: Dependency Updates (Weekly)

# Weekly dependency updates workflow with:
# - Runs weekly on Tuesdays at 2 AM UTC
# - Better dependency checking logic
# - Comprehensive artifact uploads for debugging
# - Enhanced error handling and notifications
# - Improved PR creation and commenting

on:
  schedule:
    - cron: '0 2 * * 2' # Run weekly on Tuesdays at 2 AM UTC
  workflow_dispatch: # Allow manual triggering
  repository_dispatch:
    types: [dependency-update]

jobs:
  update-deps:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      security-events: write
    env:
      NODE_VERSION: '22'
      PNPM_VERSION: '10'
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PORT: 3000
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Check for outdated dependencies
        id: check
        run: |
          echo "Checking for outdated dependencies..."

          # Use a more reliable method to check for outdated packages
          # First, try to get the raw output and extract only JSON
          RAW_OUTPUT=$(pnpm outdated --format=json 2>&1 || echo "[]")

          # Extract only the JSON part (lines starting with { or [)
          OUTDATED_OUTPUT=$(echo "$RAW_OUTPUT" | grep -E '^[[:space:]]*[{\[]' | head -1 || echo "[]")

          # If no JSON found, try alternative approach
          if [ "$OUTDATED_OUTPUT" = "[]" ] || [ -z "$OUTDATED_OUTPUT" ]; then
            # Try running without format flag and parse manually
            RAW_OUTPUT=$(pnpm outdated 2>&1 || echo "")
            if echo "$RAW_OUTPUT" | grep -q "No outdated packages found"; then
              OUTDATED_COUNT=0
              OUTDATED_OUTPUT="[]"
            else
              # Count lines that look like package entries
              OUTDATED_COUNT=$(echo "$RAW_OUTPUT" | grep -c -E '^[a-zA-Z@]' || echo "0")
              OUTDATED_OUTPUT="[]"  # We can't easily parse the non-JSON format
            fi
          else
            # Parse JSON to get count
            OUTDATED_COUNT=$(echo "$OUTDATED_OUTPUT" | jq 'length' 2>/dev/null || echo "0")
          fi

          # Ensure OUTDATED_COUNT is a clean number
          OUTDATED_COUNT=$(echo "$OUTDATED_COUNT" | tr -d '\n\r' | grep -E '^[0-9]+$' || echo "0")

          echo "Found $OUTDATED_COUNT outdated packages"
          echo "outdated_count=$OUTDATED_COUNT" >> $GITHUB_OUTPUT
          echo "outdated_json<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTDATED_OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          if [ "$OUTDATED_COUNT" -gt 0 ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "✅ Found $OUTDATED_COUNT outdated dependencies"
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "✅ All dependencies are up to date"
          fi

      - name: No dependency updates needed
        if: steps.check.outputs.has_updates == 'false'
        run: |
          echo "✅ All dependencies are up to date. No action required."
          echo ""
          echo "Running security audit to check for existing vulnerabilities..."
          pnpm audit || echo "Security audit completed"

      - name: Update dependencies
        if: steps.check.outputs.has_updates == 'true'
        run: |
          echo "Updating dependencies..."
          pnpm deps:update

          # Check if any files were actually changed
          if git diff --quiet; then
            echo "No changes detected after update"
            echo "no_changes=true" >> $GITHUB_OUTPUT
          else
            echo "Changes detected after update"
            echo "no_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: No changes after update
        if: steps.check.outputs.has_updates == 'true' && steps.update-dependencies.outputs.no_changes == 'true'
        run: echo "✅ Dependencies were checked but no updates were applied. This might be due to lock file constraints."

      - name: Security audit
        if: steps.check.outputs.has_updates == 'true' && steps.update-dependencies.outputs.no_changes != 'true'
        id: security-audit
        run: |
          echo "Running security audit..."

          # Run initial audit
          AUDIT_OUTPUT=$(pnpm audit 2>&1 || true)
          echo "$AUDIT_OUTPUT"

          # Check if vulnerabilities were found
          if echo "$AUDIT_OUTPUT" | grep -q "vulnerabilities found"; then
            echo "⚠️ Security vulnerabilities detected"
            echo "has_vulnerabilities=true" >> $GITHUB_OUTPUT

            # Try to fix vulnerabilities automatically
            echo "Attempting to fix vulnerabilities..."
            FIX_OUTPUT=$(pnpm audit fix 2>&1 || true)
            echo "$FIX_OUTPUT"

            # Check if vulnerabilities persist after fix attempt
            AUDIT_AFTER_FIX=$(pnpm audit 2>&1 || true)
            if echo "$AUDIT_AFTER_FIX" | grep -q "vulnerabilities found"; then
              echo "❌ Vulnerabilities persist after automatic fix"
              echo "vulnerabilities_fixed=false" >> $GITHUB_OUTPUT
              echo "vulnerability_details<<EOF" >> $GITHUB_OUTPUT
              echo "$AUDIT_AFTER_FIX" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
            else
              echo "✅ Vulnerabilities fixed automatically"
              echo "vulnerabilities_fixed=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "✅ No security vulnerabilities found"
            echo "has_vulnerabilities=false" >> $GITHUB_OUTPUT
            echo "vulnerabilities_fixed=true" >> $GITHUB_OUTPUT
          fi

      - name: Handle persistent vulnerabilities
        if: steps.check.outputs.has_updates == 'true' && steps.update-dependencies.outputs.no_changes != 'true' && steps.security-audit.outputs.has_vulnerabilities == 'true' && steps.security-audit.outputs.vulnerabilities_fixed == 'false'
        id: vulnerability-handling
        run: |
          echo "⚠️ Persistent vulnerabilities detected that require manual intervention"
          echo "These vulnerabilities may require pnpm overrides or manual package updates"
          echo ""
          echo "Vulnerability details:"
          echo "${{ steps.security-audit.outputs.vulnerability_details }}"
          echo ""
          echo "Consider adding pnpm overrides for affected packages in package.json"
          echo "Example:"
          echo '  "pnpm": {'
          echo '    "overrides": {'
          echo '      "vulnerable-package": "^patched-version"'
          echo '    }'
          echo '  }'

          # Set flag to indicate manual intervention needed
          echo "manual_intervention_needed=true" >> $GITHUB_OUTPUT

      - name: Run linting
        if: steps.check.outputs.has_updates == 'true' && steps.update-dependencies.outputs.no_changes != 'true'
        run: pnpm lint

      - name: Type check
        if: steps.check.outputs.has_updates == 'true' && steps.update-dependencies.outputs.no_changes != 'true'
        run: pnpm typecheck

      - name: Run tests
        if: steps.check.outputs.has_updates == 'true' && steps.update-dependencies.outputs.no_changes != 'true'
        run: |
          pnpm test
          pnpm test:e2e:sanity

      - name: Upload test results (on failure)
        if: failure() && steps.check.outputs.has_updates == 'true' && steps.update-dependencies.outputs.no_changes != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-update-test-results
          path: |
            coverage/
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always() && steps.check.outputs.has_updates == 'true' && steps.update-dependencies.outputs.no_changes != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            test-results/
            playwright-report/
            coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Build Next.js app
        if: steps.check.outputs.has_updates == 'true' && steps.update-dependencies.outputs.no_changes != 'true'
        run: pnpm build

      - name: Check bundle size
        if: steps.check.outputs.has_updates == 'true' && steps.update-dependencies.outputs.no_changes != 'true'
        run: pnpm check:size

      - name: Create Pull Request
        if: steps.check.outputs.has_updates == 'true' && steps.update-dependencies.outputs.no_changes != 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): update dependencies'
          title: 'chore(deps): update dependencies'
          body: |
            ## 🔄 Dependency Updates

            This PR updates the following dependencies:

            **Outdated Packages Found:** ${{ steps.check.outputs.outdated_count }}

            ### Changes Made:
            - ✅ Updated outdated dependencies to their latest versions
            - ✅ Verified compatibility with existing code
            - ✅ Ran tests to ensure everything works as expected
            - ✅ Performed security audit
            - ✅ Checked bundle size impact

            ### Security Status:
            ${{ steps.security-audit.outputs.has_vulnerabilities == 'true' && steps.security-audit.outputs.vulnerabilities_fixed == 'false' && '⚠️ **Security vulnerabilities detected that require manual intervention**' || '✅ **No security vulnerabilities found**' }}

            ${{ steps.vulnerability-handling.outputs.manual_intervention_needed == 'true' && '**Manual Action Required:** Some vulnerabilities persist and may require pnpm overrides or manual package updates. Check the workflow logs for details.' || '' }}

            ### Updated Dependencies:
            ```json
            ${{ steps.check.outputs.outdated_json }}
            ```

            ---
            *This PR was automatically generated by the dependency updates workflow.*
          branch: chore/update-dependencies
          base: master
          labels: dependencies,security,automated
          delete-branch: true

      - name: Comment on PR
        if: steps.check.outputs.has_updates == 'true' && steps.update-dependencies.outputs.no_changes != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: 'chore/update-dependencies',
              state: 'open'
            });

            if (pr.length > 0) {
              const testStatus = process.env.TEST_STATUS || '✅ All tests passed successfully!';
              const auditStatus = process.env.AUDIT_STATUS || '✅ Security audit passed!';
              const bundleStatus = process.env.BUNDLE_STATUS || '✅ Bundle size check passed!';

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr[0].number,
                body: `
                  ## 🔄 Update Status

                  ${testStatus}
                  ${auditStatus}
                  ${bundleStatus}

                  ### Updated Dependencies
                  \`\`\`json
                  ${{ steps.check.outputs.outdated_json }}
                  \`\`\`
                `
              });
            }

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: 'chore/update-dependencies',
              state: 'open'
            });

            if (pr.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr[0].number,
                body: '❌ Dependency update failed. Please check the workflow logs for details.'
              });
            }

      - name: Summary
        if: always()
        run: |
          echo "## 🔄 Dependency Update Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Outdated Packages Found:** ${{ steps.check.outputs.outdated_count }}" >> $GITHUB_STEP_SUMMARY
          echo "**Has Updates:** ${{ steps.check.outputs.has_updates }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.check.outputs.has_updates }}" = "true" ]; then
            if [ "${{ steps.update-dependencies.outputs.no_changes }}" = "true" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "✅ **Dependencies checked but no updates applied**" >> $GITHUB_STEP_SUMMARY
              echo "This might be due to lock file constraints or no actual updates available." >> $GITHUB_STEP_SUMMARY
            else
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "✅ **Dependency updates applied**" >> $GITHUB_STEP_SUMMARY
              echo "A PR has been created with the updates." >> $GITHUB_STEP_SUMMARY

              # Add security status
              if [ "${{ steps.security-audit.outputs.has_vulnerabilities }}" = "true" ]; then
                if [ "${{ steps.security-audit.outputs.vulnerabilities_fixed }}" = "true" ]; then
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "✅ **Security vulnerabilities detected and automatically fixed**" >> $GITHUB_STEP_SUMMARY
                else
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "⚠️ **Security vulnerabilities detected - manual intervention may be required**" >> $GITHUB_STEP_SUMMARY
                  echo "Check the workflow logs for vulnerability details." >> $GITHUB_STEP_SUMMARY
                fi
              else
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "✅ **No security vulnerabilities found**" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **All dependencies are up to date**" >> $GITHUB_STEP_SUMMARY
            echo "No updates needed at this time." >> $GITHUB_STEP_SUMMARY
          fi
