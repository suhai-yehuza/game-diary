name: Base Deployment Workflow

on:
  workflow_call:
    inputs:
      workflow-name:
        description: 'Name of the workflow'
        required: true
        type: string
      environment:
        description: 'Deployment environment'
        required: true
        type: string
      deploy-to-vercel:
        description: 'Whether to deploy to Vercel'
        required: false
        type: boolean
        default: true
    secrets:
      VERCEL_ORG_ID:
        required: false
      VERCEL_PROJECT_ID:
        required: false
      VERCEL_TOKEN:
        required: false
      DATABASE_URL:
        required: false
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:
        required: false
      CLERK_SECRET_KEY:
        required: false
      CLERK_WEBHOOK_SIGNING_SECRET:
        required: false
      VERCEL_AUTOMATION_BYPASS_SECRET:
        required: false
      NEXT_PUBLIC_RAPID_API_KEY:
        required: false
      NEXT_PUBLIC_RAPID_API_HOST:
        required: false
      NEXT_PUBLIC_RAPID_API_BASE_URL:
        required: false

# Environment variables for E2E testing
env:
  # Localhost URLs for different browser tests
  E2E_CHROMIUM_URL: 'http://localhost:3000'
  E2E_WEBKIT_URL: 'http://localhost:3001'
  E2E_FIREFOX_URL: 'http://localhost:3002'
  E2E_MOBILE_URL: 'http://localhost:3003'

  # Mock mode configuration
  E2E_MOCK_MODE: 'true'
  API_MOCK_MODE: 'true'
  CI: 'true'

jobs:
  # Split validation into separate jobs for better isolation
  quality-gate:
    name: Quality Gate Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Quality Gate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
          NEXT_PUBLIC_RAPID_API_KEY: ${{ secrets.NEXT_PUBLIC_RAPID_API_KEY }}
          NEXT_PUBLIC_RAPID_API_HOST: ${{ secrets.NEXT_PUBLIC_RAPID_API_HOST }}
          NEXT_PUBLIC_RAPID_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_RAPID_API_BASE_URL }}
        run: |
          echo "Running quality gate validation for ${{ inputs.environment }} environment..."
          ./scripts/validation-pipeline.sh ci --skip-e2e-tests --skip-db-tests

      - name: Upload Quality Gate Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-artifacts
          path: |
            logs/
            test-results/
            coverage/
          retention-days: 7

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Unit Tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
          NEXT_PUBLIC_RAPID_API_KEY: ${{ secrets.NEXT_PUBLIC_RAPID_API_KEY }}
          NEXT_PUBLIC_RAPID_API_HOST: ${{ secrets.NEXT_PUBLIC_RAPID_API_HOST }}
          NEXT_PUBLIC_RAPID_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_RAPID_API_BASE_URL }}
        run: pnpm test:unit

      - uses: codecov/codecov-action@v4
        if: success()
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

      - name: Upload Unit Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-artifacts
          path: |
            test-results/
            coverage/
          retention-days: 7

  database-tests:
    name: Database Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Database Tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
          NEXT_PUBLIC_RAPID_API_KEY: ${{ secrets.NEXT_PUBLIC_RAPID_API_KEY }}
          NEXT_PUBLIC_RAPID_API_HOST: ${{ secrets.NEXT_PUBLIC_RAPID_API_HOST }}
          NEXT_PUBLIC_RAPID_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_RAPID_API_BASE_URL }}
        run: |
          echo "🔍 Validating database trigger definitions..."
          pnpm db:validate-triggers
          echo "🧪 Running comprehensive database trigger tests..."
          pnpm db:test:all-triggers

      - name: Upload Database Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-test-artifacts
          path: |
            logs/
            test-results/
          retention-days: 7

  # Integration Tests (runs in parallel with mock verification)
  integration-tests:
    name: Integration Tests
    needs: [quality-gate, unit-tests, database-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Integration Tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
          NEXT_PUBLIC_RAPID_API_KEY: ${{ secrets.NEXT_PUBLIC_RAPID_API_KEY }}
          NEXT_PUBLIC_RAPID_API_HOST: ${{ secrets.NEXT_PUBLIC_RAPID_API_HOST }}
          NEXT_PUBLIC_RAPID_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_RAPID_API_BASE_URL }}
          CI: 'true'
        run: |
          echo "🧪 Running integration tests..."
          pnpm test:integration

      - name: Upload Integration Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-artifacts
          path: |
            test-results/
            coverage/
            logs/
          retention-days: 7

  # Global E2E Mock Verification (runs once against all browsers)
  e2e-mock-verification:
    name: E2E Mock Verification (All Browsers)
    needs: [quality-gate, unit-tests, database-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Playwright browsers
        run: |
          echo "🔧 Setting up Playwright browsers for CI environment..."

          # Make sure the script is executable
          chmod +x ./scripts/testing/install-playwright-browsers.sh

          # Try the custom script first
          if ./scripts/testing/install-playwright-browsers.sh --verbose; then
            echo "✅ Custom browser installation script completed successfully"
          else
            echo "⚠️ Custom script failed, trying direct installation..."

            # Fallback: direct installation with verbose output
            echo "Installing Playwright browsers directly..."
            pnpm exec playwright install --with-deps

            # Verify installation
            echo "Verifying browser installation..."
            pnpm exec playwright install --list

            # Test if browsers are accessible
            if pnpm exec playwright install --list | grep -q "chromium" && \
               pnpm exec playwright install --list | grep -q "firefox" && \
               pnpm exec playwright install --list | grep -q "webkit"; then
              echo "✅ Direct browser installation completed successfully"
            else
              echo "❌ Browser installation verification failed"
              echo "Trying one more time with force..."
              pnpm exec playwright install --with-deps --force
              pnpm exec playwright install --list
              exit 1
            fi
          fi

      - name: Start Development Server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
          NEXT_PUBLIC_RAPID_API_KEY: ${{ secrets.NEXT_PUBLIC_RAPID_API_KEY }}
          NEXT_PUBLIC_RAPID_API_HOST: ${{ secrets.NEXT_PUBLIC_RAPID_API_HOST }}
          NEXT_PUBLIC_RAPID_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_RAPID_API_BASE_URL }}
        run: |
          echo "🚀 Starting development server on port 3000..."
          pnpm dev:mock -p 3000 > /dev/null 2>&1 &
          DEV_SERVER_PID=$!

          # Wait for server to be ready
          echo "⏳ Waiting for server to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null 2>&1; then
              echo "✅ Development server is ready!"
              break
            fi
            sleep 2
          done

          # Store PID for cleanup
          echo "DEV_SERVER_PID=$DEV_SERVER_PID" >> $GITHUB_ENV

      - name: Run E2E Mock Verification (All Browsers)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
          NEXT_PUBLIC_RAPID_API_KEY: ${{ secrets.NEXT_PUBLIC_RAPID_API_KEY }}
          NEXT_PUBLIC_RAPID_API_HOST: ${{ secrets.NEXT_PUBLIC_RAPID_API_HOST }}
          NEXT_PUBLIC_RAPID_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_RAPID_API_BASE_URL }}
          DEPLOYMENT_URL: 'http://localhost:3000'
          E2E_MOCK_MODE: 'true'
          API_MOCK_MODE: 'true'
          CI: 'true'
        run: |
          echo "Running E2E Mock Verification against all browsers..."
          pnpm test:e2e:mock-verification --browser=all

      - name: Stop Development Server
        if: always()
        run: |
          if [ -n "$DEV_SERVER_PID" ]; then
            echo "🛑 Stopping development server..."
            kill $DEV_SERVER_PID 2>/dev/null || true
          fi

      - name: Upload E2E Mock Verification Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-mock-verification-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7

