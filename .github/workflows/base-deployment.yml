      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Playwright browsers
        run: |
          echo "🔧 Setting up Playwright browsers for CI environment..."

          # First try the custom script
          if ./scripts/testing/install-playwright-browsers.sh --verbose; then
            echo "✅ Custom browser installation script completed successfully"
          else
            echo "⚠️ Custom script failed, trying direct installation..."

            # Fallback: direct installation
            pnpm exec playwright install --with-deps

            # Verify installation
            echo "Verifying browser installation..."
            pnpm exec playwright install --list

            # Test if browsers are accessible
            if pnpm exec playwright install --list | grep -q "chromium" && \
               pnpm exec playwright install --list | grep -q "firefox" && \
               pnpm exec playwright install --list | grep -q "webkit"; then
              echo "✅ Direct browser installation completed successfully"
            else
              echo "❌ Browser installation verification failed"
              exit 1
            fi
          fi

      - name: Start Development Server (Mobile)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
          NEXT_PUBLIC_RAPID_API_KEY: ${{ secrets.NEXT_PUBLIC_RAPID_API_KEY }}
          NEXT_PUBLIC_RAPID_API_HOST: ${{ secrets.NEXT_PUBLIC_RAPID_API_HOST }}
          NEXT_PUBLIC_RAPID_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_RAPID_API_BASE_URL }}
          CI: 'true'
          E2E_MOCK_MODE: 'true'
          API_MOCK_MODE: 'true'
        run: |
          echo "🚀 Starting development server on port 3003..."
          pnpm dev:mock -p 3003 > /dev/null 2>&1 &
          DEV_SERVER_PID=$!

          # Wait for server to be ready
          echo "⏳ Waiting for server to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:3003 > /dev/null 2>&1; then
              echo "✅ Development server is ready!"
              break
            fi
            sleep 2
          done

          # Store PID for cleanup
          echo "DEV_SERVER_PID=$DEV_SERVER_PID" >> $GITHUB_ENV

      - name: Run E2E Tests (Mobile)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
          NEXT_PUBLIC_RAPID_API_KEY: ${{ secrets.NEXT_PUBLIC_RAPID_API_KEY }}
          NEXT_PUBLIC_RAPID_API_HOST: ${{ secrets.NEXT_PUBLIC_RAPID_API_HOST }}
          NEXT_PUBLIC_RAPID_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_RAPID_API_BASE_URL }}
          CI: 'true'
          DEPLOYMENT_URL: 'http://localhost:3003'
          E2E_MOCK_MODE: 'true'
          API_MOCK_MODE: 'true'
        run: |
          echo "Running E2E tests on Mobile..."
          # Run tests with explicit CI configuration to ensure artifacts are generated
          pnpm exec playwright test tests/e2e/functional/navigation.spec.ts --project="Mobile Chrome" --reporter=list,json,junit,html
          pnpm exec playwright test tests/e2e/functional/smoke.spec.ts --project="Mobile Chrome" --reporter=list,json,junit,html
          pnpm exec playwright test tests/e2e/functional/live-games.spec.ts --project="Mobile Chrome" --reporter=list,json,junit,html

      - name: Stop Development Server (Mobile)
        if: always()
        run: |
          if [ -n "$DEV_SERVER_PID" ]; then
            echo "🛑 Stopping development server..."
            kill $DEV_SERVER_PID 2>/dev/null || true
          fi

      - name: Upload E2E Mobile Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-mobile-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: warn

  deploy:
    name: Deploy to Vercel
    if: ${{ inputs.deploy-to-vercel }}
    needs: [e2e-chromium, e2e-webkit, e2e-firefox, e2e-mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    outputs:
      deployment-url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Vercel
        id: deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
          NEXT_PUBLIC_RAPID_API_KEY: ${{ secrets.NEXT_PUBLIC_RAPID_API_KEY }}
          NEXT_PUBLIC_RAPID_API_HOST: ${{ secrets.NEXT_PUBLIC_RAPID_API_HOST }}
          NEXT_PUBLIC_RAPID_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_RAPID_API_BASE_URL }}
          CI: 'true'
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          DEPLOYMENT_URL: ${{ secrets.VERCEL_PREVIEW_URL }}
          E2E_AUTH_BYPASS: 'true'
          TEST_USER_EMAIL: 'test@game-diary.com'
          TEST_USER_ID: 'test_user_123'
        run: |
          echo "Deploying to ${{ inputs.environment }} environment..."

          # Install Vercel CLI
          npm install --global vercel@latest

          # Show Vercel CLI version and configuration
          echo "Vercel CLI version:"
          vercel --version

          echo "Vercel configuration:"
          vercel --token ${{ secrets.VERCEL_TOKEN }} 2>&1 | head -10 || echo "Vercel command failed, continuing..."

          # Deploy to Vercel
          if [ "${{ inputs.environment }}" = "Production" ]; then
            # For production, deploy with --skip-domain to prevent automatic domain assignment
            # We'll promote the deployment after verification
            vercel --prod --skip-domain --token ${{ secrets.VERCEL_TOKEN }}
          else
            vercel --token ${{ secrets.VERCEL_TOKEN }}
          fi

          # Get the deployment URL from the deployment output
          echo "Extracting deployment URL..."

          # Store the deployment output for URL extraction
          DEPLOYMENT_OUTPUT=$(vercel --token ${{ secrets.VERCEL_TOKEN }} 2>&1)
          echo "Deployment output:"
          echo "$DEPLOYMENT_OUTPUT" | head -20

          # Method 1: Try to get from deployment output (most reliable for fresh deployments)
          DEPLOYMENT_URL=$(echo "$DEPLOYMENT_OUTPUT" | grep -o 'https://[^[:space:]]*\.vercel\.app' | head -1)

          if [ -z "$DEPLOYMENT_URL" ]; then
            # Method 2: Try to get from vercel ls (for recent deployments)
            echo "Method 2: Trying vercel ls..."
            VERCEL_LS_OUTPUT=$(vercel ls --token ${{ secrets.VERCEL_TOKEN }} 2>&1)
            echo "Vercel ls output:"
            echo "$VERCEL_LS_OUTPUT" | head -20
            DEPLOYMENT_URL=$(echo "$VERCEL_LS_OUTPUT" | grep -E ".*\.vercel\.app" | head -1 | awk '{print $2}')
          fi

          if [ -z "$DEPLOYMENT_URL" ]; then
            # Method 3: Try to get from vercel inspect
            echo "Method 3: Trying vercel inspect..."
            VERCEL_INSPECT_OUTPUT=$(vercel inspect --token ${{ secrets.VERCEL_TOKEN }} 2>&1)
            echo "Vercel inspect output:"
            echo "$VERCEL_INSPECT_OUTPUT" | head -20
            DEPLOYMENT_URL=$(echo "$VERCEL_INSPECT_OUTPUT" | grep -o 'https://[^[:space:]]*\.vercel\.app' | head -1)
          fi

          if [ -z "$DEPLOYMENT_URL" ]; then
            # Final fallback: use environment-specific URL
            if [ "${{ inputs.environment }}" = "Production" ]; then
              DEPLOYMENT_URL="https://game-diary.vercel.app"
            else
              DEPLOYMENT_URL="${{ secrets.VERCEL_PREVIEW_URL }}"
            fi
            echo "⚠️ Using fallback URL: $DEPLOYMENT_URL"
          else
            echo "✅ Extracted deployment URL: $DEPLOYMENT_URL"
          fi

          echo "Deployment URL: $DEPLOYMENT_URL"
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT

      - name: Upload Deploy Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-artifacts
          path: |
            logs/
            test-results/
            playwright-report/
            coverage/
            build/
          retention-days: 7
          if-no-files-found: warn

  # Unified post-deployment verification (staging and production)
  post-deploy-verification:
    name: E2E Post-Deployment Verification (${{ inputs.environment }})
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.environment == 'Production' && 60 || 45 }}
    environment: ${{ inputs.environment }}
    if: ${{ inputs.environment == 'Staging' || inputs.environment == 'Production' }}
    outputs:
      deployment-url: ${{ needs.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup validation scripts
        run: |
          echo "🔧 Setting up validation scripts..."
          chmod +x scripts/validation/*.sh
          echo "✅ Validation scripts are now executable"

      - name: Setup Playwright browsers
        run: |
          echo "🔧 Setting up Playwright browsers for CI environment..."
          if ./scripts/testing/install-playwright-browsers.sh --verbose; then
            echo "✅ Custom browser installation script completed successfully"
          else
            echo "⚠️ Custom script failed, trying direct installation..."
            pnpm exec playwright install --with-deps
            pnpm exec playwright install --list
          fi

      - name: Validate and Test Deployment
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
          NEXT_PUBLIC_RAPID_API_KEY: ${{ secrets.NEXT_PUBLIC_RAPID_API_KEY }}
          NEXT_PUBLIC_RAPID_API_HOST: ${{ secrets.NEXT_PUBLIC_RAPID_API_HOST }}
          NEXT_PUBLIC_RAPID_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_RAPID_API_BASE_URL }}
          CI: 'true'
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment-url }}
          E2E_AUTH_BYPASS: 'true'
          TEST_USER_EMAIL: 'test@game-diary.com'
          TEST_USER_ID: 'test_user_123'
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          E2E_POST_DEPLOY_VERIFICATION: 'true'
          E2E_MOCK_MODE: 'false'
          API_MOCK_MODE: 'false'
        run: |
          # Set environment-specific variables
          if [ "${{ inputs.environment }}" = "Production" ]; then
            ENVIRONMENT_NAME="production"
            VERIFICATION_MESSAGE="optimized post-deployment verification"
          else
            ENVIRONMENT_NAME="staging"
            VERIFICATION_MESSAGE="staging post-deployment verification"
          fi

          echo "🚀 Running $VERIFICATION_MESSAGE..."
          echo "Deployment URL: $DEPLOYMENT_URL"

          # Validate deployment URL
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "❌ Deployment URL is empty"
            exit 1
          fi

          # Comprehensive deployment validation using our validation script
          echo "🔍 Running comprehensive deployment validation..."
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "Using Vercel automation bypass for validation..."
            if ./scripts/validation/deployment-validate.sh "$DEPLOYMENT_URL" --bypass-secret "$VERCEL_AUTOMATION_BYPASS_SECRET" --ci; then
              echo "✅ Deployment validation passed"
            else
              echo "❌ Deployment validation failed"
              exit 1
            fi
          else
            echo "Running validation without bypass secret..."
            if ./scripts/validation/deployment-validate.sh "$DEPLOYMENT_URL" --ci; then
              echo "✅ Deployment validation passed"
            else
              echo "❌ Deployment validation failed"
              exit 1
            fi
          fi

          # Run comprehensive post-deployment verification tests
          echo "📋 Running post-deployment verification tests..."
          pnpm exec playwright test tests/e2e/functional/post-deploy-verification.spec.ts --workers=1 --reporter=line || {
            echo "❌ Post-deployment verification tests failed"
            exit 1
          }

          echo "✅ $ENVIRONMENT_NAME post-deployment verification completed"

      - name: Upload Post-Deployment Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.environment }}-post-deploy-verification-artifacts
          path: |
            test-results/
            playwright-report/
            coverage/
          retention-days: 7
          if-no-files-found: warn

      - name: Post-Deployment Summary
        if: always()
        env:
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment-url }}
        run: |
          echo ""
          echo "📋 Post-Deployment Verification Summary"
          echo "====================================="
          echo "🚀 Deployment URL: $DEPLOYMENT_URL"
          echo "✅ Post-deployment verification: PASSED"
          echo "🔍 Health checks completed"
          echo "📊 Test artifacts generated"
          echo "✅ Post-deployment verification completed successfully!"

  # Reusable job for updating domains (staging and production)
  update-domain:
    name: Update ${{ inputs.environment }} Domain
    needs: [post-deploy-verification]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    if: ${{ inputs.environment == 'Staging' || inputs.environment == 'Production' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm i -g vercel@latest

      - name: Make helper script executable
        run: chmod +x scripts/vercel-deploy-helper.sh

      # Update Domain with Team Context Support
      # This step handles Vercel deployment promotion with proper team context to avoid
      # "Deployment belongs to a different team" errors. It uses the VERCEL_ORG_ID
      # secret to specify the correct team context for all Vercel CLI operations.
      #
      # Required GitHub Secrets:
      # - VERCEL_TOKEN: Your Vercel API token
      # - VERCEL_ORG_ID: Your team ID (e.g., "suhais-projects-33a81a2a")
      # - VERCEL_PROJECT_ID: Your project ID (optional but recommended)
      #
      # To get your team ID, run: vercel teams ls
      # To get your project ID, run: vercel project ls
      - name: Update Domain
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOYMENT_URL: ${{ needs.post-deploy-verification.outputs.deployment-url }}
        run: |
          # Set environment-specific variables
          if [ "${{ inputs.environment }}" = "Production" ]; then
            DOMAIN_NAME="www.game-diary.io"
            DOMAIN_URL="https://www.game-diary.io"
            ENVIRONMENT_NAME="production"
            VERIFICATION_ENDPOINT="/api/health"
          else
            DOMAIN_NAME="staging.game-diary.io"
            DOMAIN_URL="https://staging.game-diary.io"
            ENVIRONMENT_NAME="staging"
            VERIFICATION_ENDPOINT="/api/health"
          fi

          echo "🔗 Updating $ENVIRONMENT_NAME domain to point to latest deployment..."
          echo "Deployment URL: $DEPLOYMENT_URL"
          echo "Domain: $DOMAIN_NAME"
          echo "Team ID: $VERCEL_ORG_ID"

          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "❌ Deployment URL is empty, skipping domain update"
            exit 1
          fi

          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "❌ VERCEL_ORG_ID is not set, using default team context"
          fi

          # Wait a moment for deployment to be fully ready
          echo "⏳ Waiting for deployment to be ready..."
          sleep 10

          # Update the domain based on environment
          if [ "${{ inputs.environment }}" = "Production" ]; then
            # For production, use 'vercel promote' with proper team context
            echo "🔄 Promoting deployment to production..."

            # Set team context for the promotion
            if [ -n "$VERCEL_ORG_ID" ]; then
              echo "Using team context: $VERCEL_ORG_ID"
              if vercel promote "$DEPLOYMENT_URL" --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" --yes; then
                echo "✅ Successfully promoted deployment to production: $DEPLOYMENT_URL"
              else
                echo "❌ Failed to promote deployment to production"
                exit 1
              fi
            else
              # Fallback without team context (should work if token has correct permissions)
              if vercel promote "$DEPLOYMENT_URL" --token "$VERCEL_TOKEN" --yes; then
                echo "✅ Successfully promoted deployment to production: $DEPLOYMENT_URL"
              else
                echo "❌ Failed to promote deployment to production"
                exit 1
              fi
            fi
          else
            # For staging, use 'vercel alias set' since staging.game-diary.io is a custom domain
            echo "🔄 Setting staging domain alias..."

            # Try with team context first
            if [ -n "$VERCEL_ORG_ID" ]; then
              echo "Using team context: $VERCEL_ORG_ID"
              if vercel alias set "$DEPLOYMENT_URL" "$DOMAIN_NAME" --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"; then
                echo "✅ Successfully updated $DOMAIN_NAME to point to: $DEPLOYMENT_URL"
              else
                echo "⚠️ Team context alias set failed, trying without team context..."
                if vercel alias set "$DEPLOYMENT_URL" "$DOMAIN_NAME" --token "$VERCEL_TOKEN"; then
                  echo "✅ Successfully updated $DOMAIN_NAME to point to: $DEPLOYMENT_URL"
                else
                  echo "❌ Failed to update staging domain with both team context and fallback"
                  echo "⚠️ This might be due to insufficient token permissions for domain management"
                  echo "⚠️ The deployment was successful, but domain alias update failed"
                  echo "⚠️ You may need to manually update the domain alias or check token permissions"
                  # Don't exit with error for staging domain issues, as the deployment itself succeeded
                  echo "⚠️ Continuing with deployment verification..."
                fi
              fi
            else
              if vercel alias set "$DEPLOYMENT_URL" "$DOMAIN_NAME" --token "$VERCEL_TOKEN"; then
                echo "✅ Successfully updated $DOMAIN_NAME to point to: $DEPLOYMENT_URL"
              else
                echo "❌ Failed to update staging domain"
                echo "⚠️ This might be due to insufficient token permissions for domain management"
                echo "⚠️ The deployment was successful, but domain alias update failed"
                echo "⚠️ You may need to manually update the domain alias or check token permissions"
                # Don't exit with error for staging domain issues, as the deployment itself succeeded
                echo "⚠️ Continuing with deployment verification..."
              fi
            fi
          fi

          # Verify the domain is working
          echo "🔍 Verifying domain is accessible..."
          for i in {1..5}; do
            if curl -f -s --max-time 30 "$DOMAIN_URL$VERIFICATION_ENDPOINT" > /dev/null 2>&1; then
              echo "✅ $ENVIRONMENT_NAME domain is accessible and working"
              break
            fi
            if [ $i -eq 5 ]; then
              echo "⚠️ $ENVIRONMENT_NAME domain verification failed after 5 attempts, but deployment may still be working"
            fi
            echo "⏳ Retrying domain verification... (attempt $i/5)"
            sleep 10
          done

      - name: Upload Domain Update Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.environment }}-domain-update-artifacts
          path: |
            logs/
            test-results/
          retention-days: 7
          if-no-files-found: warn
