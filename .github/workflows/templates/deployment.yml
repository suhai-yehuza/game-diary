# Simplified Deployment Workflow Template
# This template provides a clean, maintainable deployment workflow

name: ${{ inputs.workflow-name }}

on:
  workflow_call:
    inputs:
      workflow-name:
        description: 'Name of the workflow'
        required: true
        type: string
      environment:
        description: 'Deployment environment'
        required: true
        type: string

      deploy-to-vercel:
        description: 'Whether to deploy to Vercel'
        required: false
        type: boolean
        default: true
    secrets:
      VERCEL_ORG_ID:
        required: false
      VERCEL_PROJECT_ID:
        required: false
      DATABASE_URL:
        required: false
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:
        required: false
      CLERK_SECRET_KEY:
        required: false
      CLERK_WEBHOOK_SIGNING_SECRET:
        required: false

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: ./.github/workflows/templates/setup.yml
        with:
          node-version: '22'
          pnpm-version: '10'
        secrets:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}

      - name: Run Quality Gate
        run: |
          echo "Running full quality gate validation for ${{ inputs.environment }} environment..."
          ./scripts/deployment-validator.sh ci --skip-e2e-tests --skip-db-tests

  unit-tests:
    name: Unit Tests
    needs: [quality-gate]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: ./.github/workflows/templates/setup.yml
        with:
          node-version: '22'
          pnpm-version: '10'
        secrets:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}

      - name: Run Unit Tests
        run: pnpm test:unit

      - uses: codecov/codecov-action@v4
        if: success()
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  database-tests:
    name: Database Tests
    needs: [quality-gate]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: ./.github/workflows/templates/setup.yml
        with:
          node-version: '22'
          pnpm-version: '10'
        secrets:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}

      - name: Run Database Tests
        run: |
          echo "🔍 Validating database trigger definitions..."
          pnpm db:validate-triggers

          echo "🧪 Running comprehensive database trigger tests..."
          echo "Testing game ratings, notifications, and friendship triggers..."
          pnpm db:test:all-triggers

  basic-e2e-tests:
    name: Basic E2E Tests
    needs: [quality-gate]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    strategy:
      matrix:
        test: [mock-verification, sanity, smoke]
    steps:
      - uses: ./.github/workflows/templates/setup.yml
        with:
          node-version: '22'
          pnpm-version: '10'
        secrets:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}

      - uses: ./.github/workflows/templates/playwright-setup.yml
        with:
          install-deps: false
          validate-browsers: true

      - name: Run Basic E2E Tests
        run: |
          if [ "${{ matrix.test }}" = "mock-verification" ]; then
            echo "Running mock verification tests..."
            pnpm test:e2e:mock-verification
          else
            echo "Running ${{ matrix.test }} tests..."
            ./scripts/ci-e2e-tests.sh ${{ matrix.test }}
          fi

  functional-e2e-tests:
    name: Functional E2E Tests
    needs: [basic-e2e-tests]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: ./.github/workflows/templates/setup.yml
        with:
          node-version: '22'
          pnpm-version: '10'
        secrets:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}

      - uses: ./.github/workflows/templates/playwright-setup.yml
        with:
          install-deps: false
          validate-browsers: true

      - name: Run Functional E2E Tests
        run: pnpm test:e2e:full

  pages-e2e-tests:
    name: Pages E2E Tests
    needs: [functional-e2e-tests]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: ./.github/workflows/templates/setup.yml
        with:
          node-version: '22'
          pnpm-version: '10'
        secrets:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}

      - uses: ./.github/workflows/templates/playwright-setup.yml
        with:
          install-deps: false
          validate-browsers: true

      - name: Run Pages E2E Tests
        run: pnpm test:e2e:pages

  deploy:
    name: Deploy
    needs: [unit-tests, database-tests, basic-e2e-tests, functional-e2e-tests, pages-e2e-tests]
    if: ${{ inputs.deploy-to-vercel && success() }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: ./.github/workflows/templates/setup.yml
        with:
          node-version: '22'
          pnpm-version: '10'
        secrets:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}

      - name: Deploy to Vercel
        run: |
          echo "Deploying to ${{ inputs.environment }} environment..."
          # Add deployment logic here
