# Reusable workflow template for Playwright browser installation
name: Playwright Setup

on:
  workflow_call:
    inputs:
      install-deps:
        description: 'Install system dependencies'
        required: false
        default: 'false'
        type: boolean
      validate-browsers:
        description: 'Validate browser installation'
        required: false
        default: 'true'
        type: boolean

jobs:
  playwright-setup:
    name: Install Playwright Browsers
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright Browsers
        run: |
          if [ "${{ inputs.install-deps }}" = "true" ]; then
            echo "Installing Playwright browsers with system dependencies..."
            pnpm exec playwright install --with-deps
          else
            echo "Installing Playwright browsers..."
            pnpm exec playwright install
          fi

          # Debug: List Playwright cache
          ls -lR $HOME/.cache/ms-playwright || echo "No playwright cache found"

      - name: Validate Browser Installation
        if: inputs.validate-browsers == 'true'
        run: |
          echo "Validating browser installation..."
          CHROMIUM_FOUND=false

          if [ -d "$HOME/.cache/ms-playwright" ]; then
            for chromium_dir in "$HOME/.cache/ms-playwright"/chromium_headless_shell-*; do
              if [ -d "$chromium_dir" ] && [ -f "$chromium_dir/chrome-linux/headless_shell" ]; then
                echo "✅ Chromium headless shell found at: $chromium_dir/chrome-linux/headless_shell"
                ls -la "$chromium_dir/chrome-linux/headless_shell"
                CHROMIUM_FOUND=true
                break
              fi
            done
          fi

          if [ "$CHROMIUM_FOUND" = false ]; then
            echo "❌ Chromium headless shell is missing!"
            ls -la $HOME/.cache/ms-playwright/ || echo "Cache directory not found"
            exit 1
          fi
