name: 'CodeQL (Disabled - Consolidated into Security Analysis)'

# This workflow has been consolidated into security-scan.yml
# to reduce redundant runs and improve efficiency
on:
  # Disabled - consolidated into security-scan.yml
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: true
        default: 'Manual run of disabled workflow'

jobs:
  disabled:
    name: Workflow Disabled
    runs-on: ubuntu-latest
    steps:
      - name: Workflow Disabled
        run: |
          echo "This workflow has been consolidated into security-scan.yml"
          echo "Reason: ${{ inputs.reason }}"
          echo "Please use the Security Analysis workflow instead."
