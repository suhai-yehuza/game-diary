      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Playwright browsers
        run: |
          echo "🔧 Setting up Playwright browsers for CI environment..."

          # First try the custom script
          if ./scripts/testing/install-playwright-browsers.sh --verbose; then
            echo "✅ Custom browser installation script completed successfully"
          else
            echo "⚠️ Custom script failed, trying direct installation..."

            # Fallback: direct installation
            pnpm exec playwright install --with-deps

            # Verify installation
            echo "Verifying browser installation..."
            pnpm exec playwright install --list

            # Test if browsers are accessible
            if pnpm exec playwright install --list | grep -q "chromium" && \
               pnpm exec playwright install --list | grep -q "firefox" && \
               pnpm exec playwright install --list | grep -q "webkit"; then
              echo "✅ Direct browser installation completed successfully"
            else
              echo "❌ Browser installation verification failed"
              exit 1
            fi
          fi

      - name: Start Development Server (Mobile)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
          NEXT_PUBLIC_RAPID_API_KEY: ${{ secrets.NEXT_PUBLIC_RAPID_API_KEY }}
          NEXT_PUBLIC_RAPID_API_HOST: ${{ secrets.NEXT_PUBLIC_RAPID_API_HOST }}
          NEXT_PUBLIC_RAPID_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_RAPID_API_BASE_URL }}
          CI: 'true'
          E2E_MOCK_MODE: 'true'
          API_MOCK_MODE: 'true'
        run: |
          echo "🚀 Starting development server on port 3003..."
          pnpm dev:mock -p 3003 > /dev/null 2>&1 &
          DEV_SERVER_PID=$!

          # Wait for server to be ready
          echo "⏳ Waiting for server to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:3003 > /dev/null 2>&1; then
              echo "✅ Development server is ready!"
              break
            fi
            sleep 2
          done

          # Store PID for cleanup
          echo "DEV_SERVER_PID=$DEV_SERVER_PID" >> $GITHUB_ENV

      - name: Run E2E Tests (Mobile)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
          NEXT_PUBLIC_RAPID_API_KEY: ${{ secrets.NEXT_PUBLIC_RAPID_API_KEY }}
          NEXT_PUBLIC_RAPID_API_HOST: ${{ secrets.NEXT_PUBLIC_RAPID_API_HOST }}
          NEXT_PUBLIC_RAPID_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_RAPID_API_BASE_URL }}
          CI: 'true'
          DEPLOYMENT_URL: 'http://localhost:3003'
          E2E_MOCK_MODE: 'true'
          API_MOCK_MODE: 'true'
        run: |
          echo "Running E2E tests on Mobile..."
          # Run tests with explicit CI configuration to ensure artifacts are generated
          pnpm exec playwright test tests/e2e/functional/navigation.spec.ts --project="Mobile Chrome" --reporter=list,json,junit,html
          pnpm exec playwright test tests/e2e/functional/smoke.spec.ts --project="Mobile Chrome" --reporter=list,json,junit,html
          pnpm exec playwright test tests/e2e/functional/live-games.spec.ts --project="Mobile Chrome" --reporter=list,json,junit,html

      - name: Stop Development Server (Mobile)
        if: always()
        run: |
          if [ -n "$DEV_SERVER_PID" ]; then
            echo "🛑 Stopping development server..."
            kill $DEV_SERVER_PID 2>/dev/null || true
          fi

      - name: Upload E2E Mobile Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-mobile-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: warn

  # Validation summary
  summary:
    name: Validation Summary
    needs:
      [
        quality-gate,
        unit-tests,
        database-tests,
        integration-tests,
        e2e-mock-verification,
        e2e-chromium,
        e2e-webkit,
        e2e-firefox,
        e2e-mobile,
      ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate Validation Summary
        run: |
          echo "## 🔍 ${{ inputs.workflow-name }} Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Purpose:** Code validation and testing only" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Quality gate summary
          if [ "${{ needs.quality-gate.result }}" = "success" ]; then
            echo "### ✅ Quality Gate Results" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** PASSED" >> $GITHUB_STEP_SUMMARY
            echo "- Linting and type checking completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Quality Gate Results" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # Unit tests summary
          if [ "${{ needs.unit-tests.result }}" = "success" ]; then
            echo "### ✅ Unit Test Results" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** PASSED" >> $GITHUB_STEP_SUMMARY
            echo "- Unit tests completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Unit Test Results" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # Database tests summary
          if [ "${{ needs.database-tests.result }}" = "success" ]; then
            echo "### ✅ Database Test Results" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** PASSED" >> $GITHUB_STEP_SUMMARY
            echo "- Database tests completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Database Test Results" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # Integration tests summary
          if [ "${{ needs.integration-tests.result }}" = "success" ]; then
            echo "### ✅ Integration Test Results" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** PASSED" >> $GITHUB_STEP_SUMMARY
            echo "- Integration tests completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Integration Test Results" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # E2E tests summary (if not skipped)
          if [ "${{ inputs.skip-e2e-tests }}" = "false" ]; then
            # Check if all E2E jobs succeeded
            if [ "${{ needs.e2e-mock-verification.result }}" = "success" ] && \
               [ "${{ needs.e2e-chromium.result }}" = "success" ] && \
               [ "${{ needs.e2e-webkit.result }}" = "success" ] && \
               [ "${{ needs.e2e-firefox.result }}" = "success" ] && \
               [ "${{ needs.e2e-mobile.result }}" = "success" ]; then
              echo "### ✅ E2E Test Results" >> $GITHUB_STEP_SUMMARY
              echo "**Status:** PASSED" >> $GITHUB_STEP_SUMMARY
              echo "- E2E Mock Verification completed" >> $GITHUB_STEP_SUMMARY
              echo "- Chromium tests completed" >> $GITHUB_STEP_SUMMARY
              echo "- WebKit tests completed" >> $GITHUB_STEP_SUMMARY
              echo "- Firefox tests completed" >> $GITHUB_STEP_SUMMARY
              echo "- Mobile tests completed" >> $GITHUB_STEP_SUMMARY
            else
              echo "### ❌ E2E Test Results" >> $GITHUB_STEP_SUMMARY
              echo "**Status:** FAILED" >> $GITHUB_STEP_SUMMARY
              echo "- E2E Mock Verification: ${{ needs.e2e-mock-verification.result }}" >> $GITHUB_STEP_SUMMARY
              echo "- Chromium: ${{ needs.e2e-chromium.result }}" >> $GITHUB_STEP_SUMMARY
              echo "- WebKit: ${{ needs.e2e-webkit.result }}" >> $GITHUB_STEP_SUMMARY
              echo "- Firefox: ${{ needs.e2e-firefox.result }}" >> $GITHUB_STEP_SUMMARY
              echo "- Mobile: ${{ needs.e2e-mobile.result }}" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "### ⏭️ E2E Test Results" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** SKIPPED" >> $GITHUB_STEP_SUMMARY
            echo "- E2E tests were skipped for this validation" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** This is a validation only. No deployment was performed." >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:** If validation passes, merge to staging for deployment testing." >> $GITHUB_STEP_SUMMARY
