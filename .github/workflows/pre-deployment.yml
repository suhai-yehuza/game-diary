              break
            fi
            sleep 2
          done

          # Store PID for cleanup
          echo "DEV_SERVER_PID=$DEV_SERVER_PID" >> $GITHUB_ENV

      - name: Run E2E Tests (WebKit)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
          NEXT_PUBLIC_RAPID_API_KEY: ${{ secrets.NEXT_PUBLIC_RAPID_API_KEY }}
          NEXT_PUBLIC_RAPID_API_HOST: ${{ secrets.NEXT_PUBLIC_RAPID_API_HOST }}
          NEXT_PUBLIC_RAPID_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_RAPID_API_BASE_URL }}
          CI: 'true'
          DEPLOYMENT_URL: ${{ env.E2E_WEBKIT_URL }}
        run: |
          echo "Running E2E tests on WebKit..."
          # Run tests with explicit CI configuration to ensure artifacts are generated
          pnpm exec playwright test tests/e2e/functional/navigation.spec.ts --project=webkit --reporter=list,json,junit,html
          pnpm exec playwright test tests/e2e/functional/smoke.spec.ts --project=webkit --reporter=list,json,junit,html
          pnpm exec playwright test tests/e2e/functional/live-games.spec.ts --project=webkit --reporter=list,json,junit,html

      - name: Stop Development Server (WebKit)
        if: always()
        run: |
          if [ -n "$DEV_SERVER_PID" ]; then
            echo "🛑 Stopping development server..."
            kill $DEV_SERVER_PID 2>/dev/null || true
          fi

      - name: Upload E2E WebKit Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-webkit-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: warn

  e2e-firefox:
