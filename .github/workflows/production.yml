name: Production Deployment Streamlined (MTWTh)

# Manual trigger for production deployments
on:
  workflow_dispatch:
    inputs:
      max-commits:
        description: 'Maximum number of commits to cherry-pick (max 10)'
        required: false
        type: number
        default: 10
      min-age-hours:
        description: 'Minimum age of commits in hours before they can be cherry-picked'
        required: false
        type: number
        default: 24
      require-staging-success:
        description: 'Require successful staging deployment for commits'
        required: false
        type: boolean
        default: true
      skip-cherry-pick:
        description: 'Skip cherry-picking and deploy current deployment branch'
        required: false
        type: boolean
        default: false
  schedule:
    # Automated production deployment on MTWTh at 10am Pacific
    - cron: '0 18 * * 1-4' # Monday-Thursday at 6pm UTC (10am Pacific)

permissions:
  contents: write
  actions: read

jobs:
  # Cherry-pick eligible commits from staging to deployment branch
  cherry-pick-to-deployment:
    name: Cherry Pick to Deployment Branch
    if: ${{ !inputs.skip-cherry-pick || github.event_name == 'schedule' }}
    uses: ./.github/workflows/cherry-pick-commits.yml
    with:
      source-branch: 'staging'
      target-branch: 'deployment'
      max-commits: ${{ inputs.max-commits || 10 }}
      min-age-hours: ${{ inputs.min-age-hours || 24 }}
      require-staging-success: ${{ inputs.require-staging-success || true }}

  # Deploy and verify using reusable workflow
  deploy:
    name: Deploy to Production
    needs: [cherry-pick-to-deployment]
    if: always() && (needs.cherry-pick-to-deployment.result == 'skipped' || needs.cherry-pick-to-deployment.outputs.has-new-commits == 'true')
    uses: ./.github/workflows/deploy-and-verify.yml
    with:
      workflow-name: 'Production Deployment Streamlined'
      environment: 'Production'
    secrets:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      NEXT_PUBLIC_RAPID_API_KEY: ${{ secrets.NEXT_PUBLIC_RAPID_API_KEY }}
      NEXT_PUBLIC_RAPID_API_HOST: ${{ secrets.NEXT_PUBLIC_RAPID_API_HOST }}
      NEXT_PUBLIC_RAPID_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_RAPID_API_BASE_URL }}

  # Job to handle when deployment is skipped
  deployment-skipped:
    name: Deployment Skipped (No New Commits)
    needs: [cherry-pick-to-deployment]
    runs-on: ubuntu-latest
    if: always() && needs.cherry-pick-to-deployment.result == 'success' && needs.cherry-pick-to-deployment.outputs.has-new-commits != 'true'
    steps:
      - name: Generate Skip Summary
        run: |
          echo "## 🚀 Production Deployment Summary (Streamlined)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Branch:** deployment" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow Type:** Streamlined (staging-tested commits only)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🍒 Cherry-Pick Results" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ⏭️ No new commits to deploy" >> $GITHUB_STEP_SUMMARY
          echo "**Commits Cherry-Picked:** 0 (no eligible commits found)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ⏭️ Skipped (no new commits to deploy)" >> $GITHUB_STEP_SUMMARY
          echo "**Reason:** No eligible commits were found for cherry-picking" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔍 Post-Deployment Verification" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ⏭️ Skipped (no deployment performed)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Domain Update" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ⏭️ Skipped (no deployment performed)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "- No deployment was performed due to no new commits" >> $GITHUB_STEP_SUMMARY
          echo "- Production environment remains unchanged" >> $GITHUB_STEP_SUMMARY
          echo "- Next scheduled deployment will check for new commits" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** This streamlined workflow skips redundant testing since commits were already validated in staging." >> $GITHUB_STEP_SUMMARY

  # Summary job to provide deployment information
  deployment-summary:
    name: Production Deployment Summary
    needs: [cherry-pick-to-deployment, deploy]
    runs-on: ubuntu-latest
    if: always() && (needs.cherry-pick-to-deployment.result == 'skipped' || needs.cherry-pick-to-deployment.outputs.has-new-commits == 'true')
    steps:
      - name: Generate Deployment Summary
        run: |
          echo "## 🚀 Production Deployment Summary (Streamlined)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Branch:** deployment" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow Type:** Streamlined (staging-tested commits only)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Cherry-pick summary
          if [ "${{ needs.cherry-pick-to-deployment.result }}" = "success" ]; then
            if [ "${{ needs.cherry-pick-to-deployment.outputs.commits-cherry-picked }}" = "0" ] || [ "${{ needs.cherry-pick-to-deployment.outputs.commits-cherry-picked }}" = "" ]; then
              echo "### 🍒 Cherry-Pick Results" >> $GITHUB_STEP_SUMMARY
              echo "**Status:** ⏭️ SUCCESS (no new commits)" >> $GITHUB_STEP_SUMMARY
              echo "**Commits Cherry-Picked:** 0 (no eligible commits found)" >> $GITHUB_STEP_SUMMARY
            else
              echo "### 🍒 Cherry-Pick Results" >> $GITHUB_STEP_SUMMARY
              echo "**Status:** ✅ Success" >> $GITHUB_STEP_SUMMARY
              echo "**Commits Cherry-Picked:** ${{ needs.cherry-pick-to-deployment.outputs.commits-cherry-picked }}" >> $GITHUB_STEP_SUMMARY
              echo "**Cherry-Picked Commits:** ${{ needs.cherry-pick-to-deployment.outputs.cherry-picked-commits }}" >> $GITHUB_STEP_SUMMARY
            fi
          elif [ "${{ needs.cherry-pick-to-deployment.result }}" = "skipped" ]; then
            echo "### 🍒 Cherry-Pick Results" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** ⏭️ Skipped (manual skip requested)" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 🍒 Cherry-Pick Results" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** ❌ Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # Deployment summary
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "### 🚀 Production Deployment" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** ✅ Success" >> $GITHUB_STEP_SUMMARY
            echo "**Deployment URL:** ${{ needs.deploy.outputs.deployment-url }}" >> $GITHUB_STEP_SUMMARY
            echo "**Domain:** https://www.game-diary.io" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 🚀 Production Deployment" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** ❌ Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # Post-deployment verification summary
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "### 🔍 Post-Deployment Verification" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** ✅ Success" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 🔍 Post-Deployment Verification" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** ❌ Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # Domain update summary
          if [ "${{ needs.update-domain.result }}" = "success" ]; then
            echo "### 🔗 Domain Update" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** ✅ Success" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 🔗 Domain Update" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** ❌ Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "- Monitor production environment for any issues" >> $GITHUB_STEP_SUMMARY
          echo "- Check application logs and metrics" >> $GITHUB_STEP_SUMMARY
          echo "- Verify all features are working as expected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** This streamlined workflow skips redundant testing since commits were already validated in staging." >> $GITHUB_STEP_SUMMARY
