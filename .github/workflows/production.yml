name: Vercel Production Deployment

# Production deployment workflow with:
# - Manual trigger capability
# - Scheduled deployments (M-Th 9AM PT)
# - Push to master deployments
# - Comprehensive validation before deployment
# - Post-deployment validation (soak period handled in staging)
# - Rollback capabilities

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  NODE_VERSION: '22'
  PNPM_VERSION: '10'
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  PORT: 3000
  # Production deployment configuration
  VERCEL_PRODUCTION_URL: ${{ secrets.VERCEL_PRODUCTION_URL }}
  VERCEL_STAGING_URL: ${{ secrets.VERCEL_STAGING_URL }}
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
  CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
  VERCEL_PREVIEW_URL: ${{ secrets.VERCEL_PREVIEW_URL }}

on:
  # Scheduled: 9am PT (Standard Time: Nov–Mar, 17:00 UTC; Daylight Time: Mar–Nov, 16:00 UTC)
  schedule:
    - cron: '0 17 * * 1-4' # 9am PT, Mon-Thu, Standard Time
    - cron: '0 16 * * 1-4' # 9am PT, Mon-Thu, Daylight Time
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      reason:
        description: 'Deployment reason'
        required: true
        default: 'Manual deployment'
        type: string
      skip_validation:
        description: 'Skip pre-deployment validation'
        required: false
        default: false
        type: boolean
      skip_commit_age_check:
        description: 'Skip commit age validation (24-hour requirement)'
        required: false
        default: false
        type: boolean
  # Auto-deploy removed - production deployments are now manual or scheduled only

jobs:
  validate-staging:
    name: Validate Staging Readiness
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_validation && github.event_name != 'push' }}
    continue-on-error: true
    environment: Production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    outputs:
      staging_ready: ${{ steps.staging_ready_check.outputs.staging_ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Check Staging Readiness
        run: ./scripts/deployment-manager.sh status
      - name: Validate Staging Metrics
        id: staging_ready_check
        run: |
          if ./scripts/deployment-manager.sh status | grep -q "Staging: ✅ Ready for production"; then
            echo "✅ Staging is ready for production deployment"
            echo "staging_ready=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Staging is not ready for production deployment"
            echo "staging_ready=false" >> $GITHUB_OUTPUT
          fi

  validate-direct-push:
    name: Validate Direct Push (No Soak)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && !inputs.skip_validation }}
    environment: Production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Run Basic Validation
        run: |
          echo "🔍 Running basic validation for direct push to master..."
          echo "✅ Code quality checks will be done in quality-gate job"
          echo "✅ Unit tests will be done in unit-tests job"
          echo "✅ E2E tests will be done in e2e job"
          echo "✅ Skipping soak period validation for direct push"
          echo "✅ Commit age validation will be done in deploy job"
          echo "✅ Direct push validation completed"

  quality-gate:
    name: Quality Gate (Lint, Typecheck, Format, Build)
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Run CI Quality Gate
        run: ./scripts/ci-quality-gate.sh production

  unit-tests:
    name: Unit Tests
    needs: [quality-gate]
    runs-on: ubuntu-latest
    environment: Production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Run CI Unit Tests
        run: ./scripts/ci-unit-tests.sh
      - uses: codecov/codecov-action@v4
        if: success()
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
      - name: Upload unit test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            coverage/
            test-results/
          retention-days: 7

  e2e-functional:
    name: E2E Functional Tests
    needs: [quality-gate]
    runs-on: ubuntu-latest
    environment: Production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PLAYWRIGHT_TEST: true
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
    strategy:
      matrix:
        test: [sanity, smoke, critical] # progressive testing: sanity → smoke → critical
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: ./scripts/install-playwright-browsers.sh --verbose
      - name: Run CI E2E Functional Tests
        run: ./scripts/ci-e2e-tests.sh ${{ matrix.test }}
        # Progressive testing: each level includes all previous levels' tests
      - name: Upload E2E functional test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-functional-${{ matrix.test }}-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  e2e-pages:
    name: E2E Pages Tests
    needs: [quality-gate]
    runs-on: ubuntu-latest
    environment: Production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PLAYWRIGHT_TEST: true
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
    strategy:
      matrix:
        test: [base, content, interactive] # progressive testing: base → content → interactive
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: ./scripts/install-playwright-browsers.sh --verbose
      - name: Run CI E2E Pages Tests
        run: ./scripts/ci-e2e-tests.sh ${{ matrix.test }}
        # Progressive testing: each level includes all previous levels' tests
      - name: Upload E2E pages test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-pages-${{ matrix.test }}-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  e2e-advanced:
    name: E2E Advanced Tests (Navigation, Responsive, Cross-Browser, Full)
    needs: [e2e-functional, e2e-pages]
    runs-on: ubuntu-latest
    environment: Production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PLAYWRIGHT_TEST: true
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
    strategy:
      matrix:
        test: [navigation, responsive, cross-browser, full]
        include:
          - test: navigation
            timeout: 30
          - test: responsive
            timeout: 60
          - test: cross-browser
            timeout: 60
          - test: full
            timeout: 120
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: ./scripts/install-playwright-browsers.sh --verbose
      - name: Run E2E Advanced Tests (${{ matrix.test }})
        run: ./scripts/ci-e2e-tests.sh ${{ matrix.test }}
        # Each level includes all previous levels' tests, but runs once per matrix item
      - name: Upload E2E advanced test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-advanced-${{ matrix.test }}-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Vercel Production
    needs: [quality-gate, unit-tests, e2e-functional, e2e-pages, e2e-advanced, validate-staging]
    runs-on: ubuntu-latest
    if: needs.validate-staging.outputs.staging_ready == 'true' && success()
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Cache Vercel CLI
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-vercel-cli-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vercel-cli-
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        id: vercel_deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} --yes)
          echo "VERCEL_DEPLOYMENT_URL=$url" >> $GITHUB_ENV
      - name: Update Deployment Status
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            ./scripts/deployment-manager.sh manual-deploy "Push to master deployment"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ./scripts/deployment-manager.sh manual-deploy "${{ github.event.inputs.reason || 'Manual deployment' }}"
          else
            ./scripts/deployment-manager.sh manual-deploy "Scheduled production deployment"
          fi
      - name: Check commit age (must be at least 24 hours old)
        if: ${{ !inputs.skip_commit_age_check }}
        run: |
          git fetch origin master
          LATEST_COMMIT_TIME=$(git log -1 --format=%ct origin/master)
          NOW=$(date +%s)
          AGE=$(( (NOW - LATEST_COMMIT_TIME) / 3600 ))
          if [ "$AGE" -lt 24 ]; then
            echo "Latest commit is less than 24 hours old ($AGE hours). Skipping deployment."
            exit 78
          fi
      - name: Skip commit age check
        if: ${{ inputs.skip_commit_age_check }}
        run: |
          echo "⚠️  Commit age validation skipped by user request"
          echo "This bypasses the 24-hour safety requirement"

  post-deployment-smoke:
    name: Post-Deployment Smoke Tests
    needs: [deploy]
    runs-on: ubuntu-latest
    if: success()
    environment: Production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: ./scripts/install-playwright-browsers.sh --verbose
      - run: DEPLOYMENT_URL="$VERCEL_DEPLOYMENT_URL" pnpm run timed test:e2e:smoke
      - name: Upload smoke test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  deployment-skipped:
    name: Deployment Skipped (Staging Not Ready)
    needs: [validate-staging]
    runs-on: ubuntu-latest
    if: needs.validate-staging.outputs.staging_ready == 'false'
    steps:
      - name: Notice
        run: echo "::notice::Staging is not ready for production deployment. Deployment skipped."
