name: Vercel Production Deployment

# Production deployment workflow with:
# - Manual trigger capability
# - Auto-deployment support after staging soak
# - Comprehensive validation before deployment
# - Post-deployment monitoring
# - Rollback capabilities

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  NODE_VERSION: '22'
  PNPM_VERSION: '10'
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  PORT: 3000
  # Production deployment configuration
  VERCEL_PRODUCTION_URL: ${{ secrets.VERCEL_PRODUCTION_URL }}
  VERCEL_STAGING_URL: ${{ secrets.VERCEL_STAGING_URL }}
  SOAK_DURATION: 1800 # 30 minutes for production soak
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
  CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
  VERCEL_PREVIEW_URL: ${{ secrets.VERCEL_PREVIEW_URL }}

on:
  # Scheduled: 9am PT (Standard Time: Nov–Mar, 17:00 UTC; Daylight Time: Mar–Nov, 16:00 UTC)
  schedule:
    - cron: '0 17 * * 1-4' # 9am PT, Mon-Thu, Standard Time
    - cron: '0 16 * * 1-4' # 9am PT, Mon-Thu, Daylight Time
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      reason:
        description: 'Deployment reason'
        required: true
        default: 'Manual deployment'
        type: string
      skip_validation:
        description: 'Skip pre-deployment validation'
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [auto-deploy-production]

jobs:
  validate-staging:
    name: Validate Staging Readiness
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_validation && github.event_name != 'push' }}
    environment: Production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Check Staging Readiness
        run: ./scripts/deployment-manager.sh status
      - name: Validate Staging Metrics
        run: |
          if ! ./scripts/deployment-manager.sh status | grep -q "Staging: ✅ Ready for production"; then
            echo "❌ Staging is not ready for production deployment"
            exit 1
          fi
          echo "✅ Staging is ready for production deployment"

  quality-gate:
    name: Quality Gate (Lint, Typecheck, Format, Build)
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Run CI Quality Gate
        run: ./scripts/ci-quality-gate.sh production

  unit-tests:
    name: Unit Tests
    needs: [quality-gate]
    runs-on: ubuntu-latest
    environment: Production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Run CI Unit Tests
        run: ./scripts/ci-unit-tests.sh
      - uses: codecov/codecov-action@v4
        if: success()
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
      - name: Upload unit test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            coverage/
            test-results/
          retention-days: 7

  e2e-critical:
    name: Critical E2E Tests
    needs: [quality-gate]
    runs-on: ubuntu-latest
    environment: Production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - name: Run Critical E2E Tests
        run: ./scripts/ci-e2e-tests.sh critical
      - name: Upload E2E test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-critical-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Vercel Production
    needs: [validate-staging, unit-tests, e2e-critical]
    runs-on: ubuntu-latest
    if: success()
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Cache Vercel CLI
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-vercel-cli-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vercel-cli-
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
      - name: Update Deployment Status
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            ./scripts/deployment-manager.sh manual-deploy "Push to master deployment"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ./scripts/deployment-manager.sh manual-deploy "${{ github.event.inputs.reason || 'Manual deployment' }}"
          else
            ./scripts/deployment-manager.sh manual-deploy "Auto-deployment after staging soak"
          fi
      - name: Check commit age (must be at least 24 hours old)
        run: |
          git fetch origin master
          LATEST_COMMIT_TIME=$(git log -1 --format=%ct origin/master)
          NOW=$(date +%s)
          AGE=$(( (NOW - LATEST_COMMIT_TIME) / 3600 ))
          if [ "$AGE" -lt 24 ]; then
            echo "Latest commit is less than 24 hours old ($AGE hours). Skipping deployment."
            exit 78
          fi

  production-soak:
    name: Production Soak Period
    needs: [deploy]
    runs-on: ubuntu-latest
    if: success()
    environment: Production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VERCEL_PRODUCTION_URL: ${{ secrets.VERCEL_PRODUCTION_URL }}
      SOAK_DURATION: 1800
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Start Production Soak Period
        run: ./scripts/soak-monitor.sh start production ${{ env.SOAK_DURATION }}
      - name: Monitor Production Soak Period
        run: ./scripts/soak-monitor.sh monitor production ${{ env.SOAK_DURATION }}
        timeout-minutes: 35
      - name: Upload production soak logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-soak-logs
          path: ./.soak/
          retention-days: 7

  post-deployment-validation:
    name: Post-Deployment Validation
    needs: [production-soak]
    runs-on: ubuntu-latest
    if: success()
    environment: Production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - name: Run Post-Deployment Smoke Tests
        run: pnpm run timed test:e2e:smoke
      - name: Upload validation results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: post-deployment-validation-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
