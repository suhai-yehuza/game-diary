name: Production Deployment (24h Soak Period)

# Manual trigger and automated schedule for production deployments
on:
  workflow_dispatch:
    inputs:
      skip-soak-check:
        description: 'Skip 24h soak period check (emergency use only)'
        required: false
        type: boolean
        default: false
      force-deploy:
        description: 'Force deployment even if staging deployment failed or no new commits'
        required: false
        type: boolean
        default: false
  schedule:
    # Automated production deployment on MTWTh at 10am Pacific
    - cron: '0 18 * * 1-4' # Monday-Thursday at 10am Pacific (6pm UTC)

permissions:
  contents: write
  actions: read

jobs:
  # Check soak period and staging deployment status
  validate-deployment-readiness:
    name: Validate Deployment Readiness
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip-soak-check || github.event_name == 'schedule' }}
    outputs:
      ready-for-production: ${{ steps.check-readiness.outputs.ready }}
      staging-deployment-age: ${{ steps.check-readiness.outputs.age-hours }}
      staging-deployment-status: ${{ steps.check-readiness.outputs.status }}
      has-eligible-commits: ${{ steps.check-readiness.outputs.has-eligible-commits }}
      staging-commit-hash: ${{ steps.check-readiness.outputs.staging-commit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check staging deployment readiness
        id: check-readiness
        run: |
          echo "Checking staging deployment readiness for production..."

          # Get the latest staging deployment
          STAGING_DEPLOYMENT=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?workflow_id=Staging%20Deployment%20(Automatic%20from%20Master)&branch=staging&status=completed&conclusion=success&per_page=1" | \
            jq -r '.workflow_runs[0] // empty')

          # Get the latest failed staging deployment (if any)
          FAILED_STAGING_DEPLOYMENT=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?workflow_id=Staging%20Deployment%20(Automatic%20from%20Master)&branch=staging&status=completed&conclusion=failure&per_page=1" | \
            jq -r '.workflow_runs[0] // empty')

          if [ -z "$STAGING_DEPLOYMENT" ]; then
            echo "❌ No successful staging deployment found"
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "status=no-staging-deployment" >> $GITHUB_OUTPUT
            echo "has-eligible-commits=false" >> $GITHUB_OUTPUT
            echo "staging-commit=none" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get deployment timestamp and commit hash
          DEPLOYMENT_TIME=$(echo "$STAGING_DEPLOYMENT" | jq -r '.created_at')
          DEPLOYMENT_ID=$(echo "$STAGING_DEPLOYMENT" | jq -r '.id')
          STAGING_COMMIT=$(echo "$STAGING_DEPLOYMENT" | jq -r '.head_sha')

          echo "Latest staging deployment: $DEPLOYMENT_ID at $DEPLOYMENT_TIME"
          echo "Staging commit: $STAGING_COMMIT"
          echo "staging-commit=$STAGING_COMMIT" >> $GITHUB_OUTPUT

          # Check if there are recent failures that are more recent than the last successful deployment
          if [ -n "$FAILED_STAGING_DEPLOYMENT" ]; then
            FAILED_TIME=$(echo "$FAILED_STAGING_DEPLOYMENT" | jq -r '.created_at')
            FAILED_COMMIT=$(echo "$FAILED_STAGING_DEPLOYMENT" | jq -r '.head_sha')

            echo "Found failed staging deployment: $FAILED_COMMIT at $FAILED_TIME"

            # Check if the failed deployment is more recent than the last successful one
            if [ "$FAILED_TIME" \> "$DEPLOYMENT_TIME" ]; then
              echo "❌ Recent staging deployment failure detected - blocking production deployment"
              echo "ready=false" >> $GITHUB_OUTPUT
              echo "status=staging-failure" >> $GITHUB_OUTPUT
              echo "has-eligible-commits=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          # Calculate business days in Pacific time
          # Convert deployment time to Pacific time and calculate business days

          # Set timezone to Pacific
          export TZ="America/Los_Angeles"

          # Convert deployment time to Pacific timestamp
          DEPLOYMENT_TIME_PACIFIC=$(date -d "$DEPLOYMENT_TIME" +%s)
          CURRENT_TIME_PACIFIC=$(date +%s)

          # Calculate total seconds difference
          AGE_SECONDS=$((CURRENT_TIME_PACIFIC - DEPLOYMENT_TIME_PACIFIC))
          AGE_HOURS=$((AGE_SECONDS / 3600))

          echo "Deployment age: $AGE_HOURS hours (Pacific time)"
          echo "age-hours=$AGE_HOURS" >> $GITHUB_OUTPUT

          # Calculate business days passed (Pacific time)
          # Business hours: Monday-Friday, 9 AM - 5 PM Pacific (8 hours per day)
          # 2 business days = 16 business hours
          BUSINESS_HOURS_PASSED=$((AGE_HOURS / 8))

          # Get current Pacific time for logging
          CURRENT_PACIFIC_TIME=$(date)
          DEPLOYMENT_PACIFIC_TIME=$(date -d "$DEPLOYMENT_TIME")

          echo "Deployment time (Pacific): $DEPLOYMENT_PACIFIC_TIME"
          echo "Current time (Pacific): $CURRENT_PACIFIC_TIME"
          echo "Business days passed: $BUSINESS_HOURS_PASSED"

          if [ "$BUSINESS_HOURS_PASSED" -ge 2 ]; then
            echo "✅ 2 business days have passed in Pacific time (16 business hours)"
            echo "ready=true" >> $GITHUB_OUTPUT
            echo "status=ready" >> $GITHUB_OUTPUT
            echo "has-eligible-commits=true" >> $GITHUB_OUTPUT
          else
            echo "⏳ Only $BUSINESS_HOURS_PASSED business days have passed in Pacific time (need 2)"
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "status=soak-period-incomplete" >> $GITHUB_OUTPUT
            echo "has-eligible-commits=false" >> $GITHUB_OUTPUT
          fi

  # Check for new commits since staging deployment
  check-new-commits:
    name: Check for New Commits Since Staging
    runs-on: ubuntu-latest
    if: ${{ !inputs.force-deploy && (inputs.skip-soak-check || needs.validate-deployment-readiness.outputs.ready-for-production == 'true') }}
    needs: [validate-deployment-readiness]
    outputs:
      has-new-commits: ${{ steps.check-commits.outputs.has-new-commits }}
      current-commit: ${{ steps.check-commits.outputs.current-commit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new commits since staging deployment
        id: check-commits
        run: |
          echo "Checking for new commits since staging deployment..."

          # Get the current commit hash
          CURRENT_COMMIT=$(git rev-parse HEAD)
          echo "Current commit: $CURRENT_COMMIT"
          echo "current-commit=$CURRENT_COMMIT" >> $GITHUB_OUTPUT

          # Get the staging commit from the previous job
          STAGING_COMMIT="${{ needs.validate-deployment-readiness.outputs.staging-commit-hash }}"
          echo "Staging deployment commit: $STAGING_COMMIT"

          if [ "$STAGING_COMMIT" = "none" ]; then
            echo "No staging deployment found, proceeding with deployment"
            echo "has-new-commits=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if current commit is different from staging commit
          if [ "$CURRENT_COMMIT" = "$STAGING_COMMIT" ]; then
            echo "No new commits since staging deployment"
            echo "has-new-commits=false" >> $GITHUB_OUTPUT
          else
            echo "New commits found since staging deployment"
            echo "has-new-commits=true" >> $GITHUB_OUTPUT
          fi

  # Deploy and verify using reusable workflow
  deploy:
    name: Deploy to Production
    needs: [validate-deployment-readiness, check-new-commits]
    if: ${{ inputs.force-deploy || (inputs.skip-soak-check || needs.validate-deployment-readiness.outputs.ready-for-production == 'true') && (inputs.force-deploy || needs.check-new-commits.outputs.has-new-commits == 'true') }}
    uses: ./.github/workflows/deploy-and-verify.yml
    with:
      workflow-name: 'Production Deployment (24h Soak)'
      environment: 'Production'
    secrets:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      NEXT_PUBLIC_RAPID_API_KEY: ${{ secrets.NEXT_PUBLIC_RAPID_API_KEY }}
      NEXT_PUBLIC_RAPID_API_HOST: ${{ secrets.NEXT_PUBLIC_RAPID_API_HOST }}
      NEXT_PUBLIC_RAPID_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_RAPID_API_BASE_URL }}

  # Job to handle when deployment is completed successfully with no new commits
  deployment-skipped:
    name: Deployment Completed (No New Commits)
    needs: [validate-deployment-readiness, check-new-commits]
    runs-on: ubuntu-latest
    if: always() && !inputs.force-deploy && (needs.validate-deployment-readiness.outputs.has-eligible-commits != 'true' || needs.check-new-commits.outputs.has-new-commits != 'true')
    steps:
      - name: Generate Completion Summary
        run: |
          echo "## ✅ Production Deployment Summary (Completed Successfully)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Source Branch:** staging" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow Type:** 2 Business Days Soak Period" >> $GITHUB_STEP_SUMMARY
          echo "**Schedule:** MTWTh at 10am Pacific" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.validate-deployment-readiness.outputs.staging-deployment-status }}" = "no-staging-deployment" ]; then
            echo "### ⏭️ Soak Period Check" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** SKIPPED" >> $GITHUB_STEP_SUMMARY
            echo "**Reason:** No successful staging deployment found" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.validate-deployment-readiness.outputs.staging-deployment-status }}" = "staging-failure" ]; then
            echo "### ⏭️ Staging Status Check" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** BLOCKED" >> $GITHUB_STEP_SUMMARY
            echo "**Reason:** Recent staging deployment failure detected" >> $GITHUB_STEP_SUMMARY
            echo "**Action Required:** Fix staging deployment before proceeding to production" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.validate-deployment-readiness.outputs.staging-deployment-status }}" = "soak-period-incomplete" ]; then
            echo "### ⏭️ Soak Period Check" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** ⏳ INCOMPLETE" >> $GITHUB_STEP_SUMMARY
            echo "**Staging Deployment Age:** ${{ needs.validate-deployment-readiness.outputs.staging-deployment-age }} hours" >> $GITHUB_STEP_SUMMARY
            echo "**Business Days Passed:** $(( ${{ needs.validate-deployment-readiness.outputs.staging-deployment-age }} / 8 )) days" >> $GITHUB_STEP_SUMMARY
            echo "**Required:** 2 business days (16 business hours) in Pacific time" >> $GITHUB_STEP_SUMMARY
            echo "**Reason:** 2 business days soak period has not elapsed in Pacific time" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.validate-deployment-readiness.outputs.staging-deployment-status }}" = "ready" ]; then
            echo "### ⏭️ Soak Period Check" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** ✅ PASSED" >> $GITHUB_STEP_SUMMARY
            echo "**Staging Deployment Age:** ${{ needs.validate-deployment-readiness.outputs.staging-deployment-age }} hours" >> $GITHUB_STEP_SUMMARY
            echo "**Business Days Passed:** $(( ${{ needs.validate-deployment-readiness.outputs.staging-deployment-age }} / 8 )) days" >> $GITHUB_STEP_SUMMARY
            echo "**Required:** 2 business days (16 business hours) in Pacific time" >> $GITHUB_STEP_SUMMARY
            echo "**Reason:** 2 business days soak period has been completed successfully" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⏭️ Commit Check" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** ✅ PASSED" >> $GITHUB_STEP_SUMMARY
            echo "**Current Commit:** ${{ needs.check-new-commits.outputs.current-commit }}" >> $GITHUB_STEP_SUMMARY
            echo "**Staging Commit:** ${{ needs.validate-deployment-readiness.outputs.staging-commit-hash }}" >> $GITHUB_STEP_SUMMARY
            echo "**Reason:** No new commits since staging deployment - correctly identified no deployment needed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "### 🚀 Production Deployment" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.validate-deployment-readiness.outputs.staging-deployment-status }}" = "staging-failure" ]; then
            echo "**Status:** ⏭️ BLOCKED (staging failure)" >> $GITHUB_STEP_SUMMARY
            echo "**Reason:** Cannot deploy to production due to staging deployment failure" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** ✅ PASSED (no deployment needed)" >> $GITHUB_STEP_SUMMARY
            echo "**Reason:** No new commits since staging deployment - deployment correctly skipped" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔍 Post-Deployment Verification" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.validate-deployment-readiness.outputs.staging-deployment-status }}" = "staging-failure" ]; then
            echo "**Status:** ⏭️ BLOCKED (staging failure)" >> $GITHUB_STEP_SUMMARY
            echo "**Reason:** Cannot verify production due to staging deployment failure" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** ✅ PASSED (no deployment performed)" >> $GITHUB_STEP_SUMMARY
            echo "**Reason:** No deployment was needed, verification correctly skipped" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Domain Update" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.validate-deployment-readiness.outputs.staging-deployment-status }}" = "staging-failure" ]; then
            echo "**Status:** ⏭️ BLOCKED (staging failure)" >> $GITHUB_STEP_SUMMARY
            echo "**Reason:** Cannot update domain due to staging deployment failure" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** ✅ PASSED (no deployment performed)" >> $GITHUB_STEP_SUMMARY
            echo "**Reason:** No deployment was needed, domain update correctly skipped" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.validate-deployment-readiness.outputs.staging-deployment-status }}" = "staging-failure" ]; then
            echo "- 🔍 Investigate the failed staging deployment" >> $GITHUB_STEP_SUMMARY
            echo "- 🛠️ Fix the issues that caused the staging failure" >> $GITHUB_STEP_SUMMARY
            echo "- 🔄 Ensure staging deployment succeeds before proceeding to production" >> $GITHUB_STEP_SUMMARY
            echo "- ⚡ Use 'Force deployment' option if you need to bypass this check (emergency only)" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.validate-deployment-readiness.outputs.staging-deployment-status }}" = "soak-period-incomplete" ]; then
            echo "- Wait for 2 business days to complete" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Wait for new commits to be deployed to staging" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- Continue testing in staging environment" >> $GITHUB_STEP_SUMMARY
          echo "- Next scheduled deployment will check for eligible commits" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.validate-deployment-readiness.outputs.staging-deployment-status }}" = "staging-failure" ]; then
            echo "**Note:** Production deployment is blocked until staging deployment issues are resolved. This prevents deploying broken code to production." >> $GITHUB_STEP_SUMMARY
          else
            echo "**Note:** This deployment completed successfully - no new commits were available for deployment. This is the expected behavior when staging and production are in sync." >> $GITHUB_STEP_SUMMARY
          fi

  # Summary job to provide deployment information
  deployment-summary:
    name: Production Deployment Summary
    needs: [validate-deployment-readiness, check-new-commits, deploy]
    runs-on: ubuntu-latest
    if: always() && (inputs.force-deploy || needs.validate-deployment-readiness.outputs.ready-for-production == 'true')
    steps:
      - name: Generate Deployment Summary
        run: |
          echo "## 🚀 Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Source Branch:** staging" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow Type:** 2 Business Days Soak Period" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "**Schedule:** MTWTh at 10am Pacific" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          # Soak period summary
          if [ "${{ inputs.skip-soak-check }}" = "true" ]; then
            echo "### ⏳ Soak Period Check" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** ⏭️ Skipped (emergency bypass)" >> $GITHUB_STEP_SUMMARY
            echo "**Reason:** Soak period check was bypassed" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⏳ Soak Period Check" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** ✅ PASSED" >> $GITHUB_STEP_SUMMARY
            echo "**Staging Deployment Age:** ${{ needs.validate-deployment-readiness.outputs.staging-deployment-age }} hours" >> $GITHUB_STEP_SUMMARY
            echo "**Business Days Passed:** $(( ${{ needs.validate-deployment-readiness.outputs.staging-deployment-age }} / 8 )) days" >> $GITHUB_STEP_SUMMARY
          fi

          # Commit check summary
          if [ "${{ inputs.force-deploy }}" = "true" ]; then
            echo "### 🔍 Commit Check" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** ⏭️ Skipped (force deploy)" >> $GITHUB_STEP_SUMMARY
            echo "**Reason:** Force deployment bypassed commit check" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 🔍 Commit Check" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** ✅ PASSED" >> $GITHUB_STEP_SUMMARY
            echo "**Current Commit:** ${{ needs.check-new-commits.outputs.current-commit }}" >> $GITHUB_STEP_SUMMARY
            echo "**Staging Commit:** ${{ needs.validate-deployment-readiness.outputs.staging-commit-hash }}" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # Deployment summary
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "### 🚀 Production Deployment" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** ✅ Success" >> $GITHUB_STEP_SUMMARY
            echo "**Deployment URL:** ${{ needs.deploy.outputs.deployment-url }}" >> $GITHUB_STEP_SUMMARY
            echo "**Domain:** https://www.game-diary.io" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 🚀 Production Deployment" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** ❌ Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # Post-deployment verification summary
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "### 🔍 Post-Deployment Verification" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** ✅ Success" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 🔍 Post-Deployment Verification" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** ❌ Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # Domain update summary
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "### 🔗 Domain Update" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** ✅ Success" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 🔗 Domain Update" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** ❌ Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "- Monitor production environment for any issues" >> $GITHUB_STEP_SUMMARY
          echo "- Check application logs and metrics" >> $GITHUB_STEP_SUMMARY
          echo "- Verify all features are working as expected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** This deployment completed the 2 business days soak period requirement." >> $GITHUB_STEP_SUMMARY
