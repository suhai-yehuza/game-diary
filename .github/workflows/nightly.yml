name: Nightly Tests

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

  unit-tests:
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm test:unit

  db-tests:
    needs: quality-gate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test database connection
        run: pnpm db:test-connection
      - name: Test database triggers
        run: pnpm db:test:all-triggers

  e2e-mock-verification:
    needs: quality-gate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
      DEPLOYMENT_URL: ${{ secrets.VERCEL_STAGING_URL }}
      E2E_AUTH_BYPASS: 'true'
      TEST_USER_EMAIL: 'test@game-diary.com'
      TEST_USER_ID: 'test_user_123'
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      E2E_MOCK_MODE: 'true'
      API_MOCK_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Playwright browsers
        run: pnpm exec playwright install --with-deps
      - name: Run E2E Mock Verification
        run: pnpm exec playwright test tests/e2e/functional/mock-verification.spec.ts --reporter=line

  e2e-smoke:
    needs: [unit-tests, db-tests, e2e-mock-verification]
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
      DEPLOYMENT_URL: ${{ secrets.VERCEL_STAGING_URL }}
      E2E_AUTH_BYPASS: 'true'
      TEST_USER_EMAIL: 'test@game-diary.com'
      TEST_USER_ID: 'test_user_123'
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      E2E_MOCK_MODE: 'true'
      API_MOCK_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Playwright browsers
        run: pnpm exec playwright install --with-deps
      - name: Run E2E Smoke Tests (live staging)
        run: pnpm exec playwright test tests/e2e/functional/smoke.spec.ts --reporter=line

  e2e-live-games:
    needs: [unit-tests, db-tests, e2e-mock-verification]
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
      DEPLOYMENT_URL: ${{ secrets.VERCEL_STAGING_URL }}
      E2E_AUTH_BYPASS: 'true'
      TEST_USER_EMAIL: 'test@game-diary.com'
      TEST_USER_ID: 'test_user_123'
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      E2E_MOCK_MODE: 'true'
      API_MOCK_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Playwright browsers
        run: pnpm exec playwright install --with-deps
      - name: Run E2E Live Games (live staging)
        run: pnpm exec playwright test tests/e2e/functional/live-games.spec.ts --reporter=line

  e2e-functional:
    needs: [e2e-smoke, e2e-live-games]
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
      DEPLOYMENT_URL: ${{ secrets.VERCEL_STAGING_URL }}
      E2E_AUTH_BYPASS: 'true'
      TEST_USER_EMAIL: 'test@game-diary.com'
      TEST_USER_ID: 'test_user_123'
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      E2E_MOCK_MODE: 'true'
      API_MOCK_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Playwright browsers
        run: pnpm exec playwright install --with-deps
      - name: Run all functional E2E specs (in series, live staging)
        run: |
          for spec in tests/e2e/functional/*.spec.ts; do
            pnpm exec playwright test "$spec" --reporter=line || exit 1
          done

  e2e-pages:
    needs: e2e-functional
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
      DEPLOYMENT_URL: ${{ secrets.VERCEL_STAGING_URL }}
      E2E_AUTH_BYPASS: 'true'
      TEST_USER_EMAIL: 'test@game-diary.com'
      TEST_USER_ID: 'test_user_123'
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      E2E_MOCK_MODE: 'true'
      API_MOCK_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Playwright browsers
        run: pnpm exec playwright install --with-deps
      - name: Run all page E2E specs (in series, live staging)
        run: |
          for spec in tests/e2e/pages/*.spec.ts; do
            pnpm exec playwright test "$spec" --reporter=line || exit 1
          done

  coverage-report:
    needs: e2e-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate E2E Coverage Report
        run: |
          echo "Generating E2E test coverage report..."
          pnpm e2e:coverage
