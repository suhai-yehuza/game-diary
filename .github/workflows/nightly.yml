name: Nightly Tests

on:
  schedule:
    - cron: '0 2 * * *' # 2 AM UTC daily
  workflow_dispatch:

env:
  NODE_ENV: test

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run linting
        run: pnpm lint
      - name: Run type checking
        run: pnpm type-check
      - name: Run unit tests
        run: pnpm test:unit
      - name: Run database tests
        run: pnpm test:db

  e2e-mock-verification:
    name: E2E Mock Verification
    needs: [quality-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Playwright browsers
        run: pnpm exec playwright install --with-deps
      - name: Run Mock Verification E2E
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
          DEPLOYMENT_URL: ${{ secrets.PRODUCTION_URL }}
        run: pnpm exec playwright test tests/e2e/functional/mock-verification.spec.ts --reporter=line

  e2e-smoke:
    name: E2E Smoke
    needs: [e2e-mock-verification]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Playwright browsers
        run: pnpm exec playwright install --with-deps
      - name: Run Smoke E2E
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
          DEPLOYMENT_URL: ${{ secrets.PRODUCTION_URL }}
        run: pnpm exec playwright test tests/e2e/functional/smoke.spec.ts --reporter=line

  e2e-functional:
    name: E2E Functional
    needs: [e2e-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Playwright browsers
        run: pnpm exec playwright install --with-deps
      - name: Run Functional E2E (excluding mock-verification and smoke)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
          DEPLOYMENT_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          find tests/e2e/functional -name '*.spec.ts' \
            ! -name 'mock-verification.spec.ts' \
            ! -name 'smoke.spec.ts' \
            -exec pnpm exec playwright test {} --reporter=line \;

  e2e-pages:
    name: E2E Pages
    needs: [e2e-functional]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Playwright browsers
        run: pnpm exec playwright install --with-deps
      - name: Run Pages E2E
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
          DEPLOYMENT_URL: ${{ secrets.PRODUCTION_URL }}
        run: pnpm exec playwright test tests/e2e/pages/*.spec.ts --reporter=line

  e2e-smoke-navigation:
    name: E2E Smoke & Navigation (Post-Test)
    needs: [e2e-pages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Playwright browsers
        run: pnpm exec playwright install --with-deps
      - name: Run Post-Test Smoke & Navigation E2E
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
          DEPLOYMENT_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          pnpm exec playwright test tests/e2e/functional/smoke.spec.ts --reporter=line
          pnpm exec playwright test tests/e2e/pages/navigation.spec.ts --reporter=line

  coverage-report:
    name: Generate Coverage Report
    needs: [e2e-smoke-navigation]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate E2E Coverage Report
        run: |
          echo "Generating E2E test coverage report..."
          pnpm e2e:coverage
