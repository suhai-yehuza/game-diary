name: Nightly & Comprehensive Tests

on:
  schedule:
    - cron: '0 2 * * *' # 2am UTC nightly
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10'
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  PORT: 3100

jobs:
  cross-browser-tests:
    name: Cross-Browser Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps
      - run: pnpm test:e2e:cross-browser
      - uses: actions/upload-artifact@v4
        with:
          name: cross-browser-results
          path: |
            test-results/
            playwright-report/
          retention-days: 30

  load-testing:
    name: Load Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps
      - run: |
          for i in {1..3}; do
            pnpm playwright test tests/e2e/responsive.spec.ts --config=playwright.popular.config.ts --project=chromium &
          done
          wait
      - uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 30

  comprehensive-validation:
    name: Comprehensive Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps
      - run: pnpm validate
      - run: pnpm test:ci
      - uses: actions/upload-artifact@v4
        with:
          name: comprehensive-validation-results
          path: |
            test-results/
            playwright-report/
            coverage/
          retention-days: 30

  full-e2e:
    name: Full E2E Suite (Sharded)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps
      - run: pnpm test:e2e:ci:full
      - uses: actions/upload-artifact@v4
        with:
          name: full-e2e-results
          path: |
            test-results/
            playwright-report/
          retention-days: 30

  performance-e2e:
    name: Performance E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps
      - run: pnpm test:e2e:ci:performance
      - uses: actions/upload-artifact@v4
        with:
          name: performance-e2e-results
          path: |
            test-results/
            playwright-report/
          retention-days: 30
