name: Nightly Maintenance

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC

jobs:
  deploy:
    uses: ./.github/workflows/reusable-deployment.yml
    with:
      workflow-name: 'Nightly Maintenance'
      environment: 'Production'
      deploy-to-vercel: false
    secrets:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}

  additional-e2e-suite:
    name: Additional E2E Test Suite
    needs: [deploy]
    runs-on: ubuntu-latest
    environment: 'Production'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Install dependencies
        run: pnpm install

      - name: Setup Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Additional E2E Specs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
        run: |
          echo "Running additional E2E test suite for nightly validation..."
          echo "Note: Basic functional tests already run in deployment template"

          # Run additional comprehensive tests not covered by deployment
          echo "Running cross-browser tests..."
          pnpm test:e2e:cross-browser

          echo "Running responsive tests..."
          pnpm test:e2e:responsive

          echo "Running search tests..."
          pnpm test:e2e:search

          echo "Running performance tests..."
          pnpm test:e2e:performance

          echo "✅ Additional E2E specs completed successfully!"

      - name: Generate E2E Coverage Report
        if: success()
        run: |
          echo "Generating E2E test coverage report..."
          pnpm e2e:coverage
