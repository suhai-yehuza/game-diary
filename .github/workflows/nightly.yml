name: Nightly Tests

on:
  # schedule:
  #   - cron: '0 2 * * *'  # Temporarily disabled - runs at 2 AM UTC daily
  workflow_dispatch: # Allow manual triggering only

jobs:
  # Combined validation job to reduce parallel jobs
  validation:
    name: Validation (Quality Gate + Unit Tests + Database Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and Typecheck
        run: |
          echo "Running linting and type checking..."
          pnpm lint
          pnpm typecheck

      - name: Run Unit Tests
        run: pnpm test:unit

      - name: Test Database Connection and Triggers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "Testing database connection..."
          pnpm db:test-connection
          echo "Testing database triggers..."
          pnpm db:test:all-triggers

      - name: Upload Validation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-artifacts
          path: |
            logs/
            test-results/
            playwright-report/
            coverage/
            build/
          retention-days: 7

  # Combined E2E tests to reduce parallel jobs
  e2e-tests:
    name: E2E Tests (Combined)
    needs: [validation]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
      DEPLOYMENT_URL: ${{ secrets.VERCEL_PREVIEW_URL }}
      E2E_AUTH_BYPASS: 'true'
      TEST_USER_EMAIL: 'test@game-diary.com'
      TEST_USER_ID: 'test_user_123'
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      NEXT_PUBLIC_RAPID_API_KEY: ${{ secrets.NEXT_PUBLIC_RAPID_API_KEY }}
      NEXT_PUBLIC_RAPID_API_HOST: ${{ secrets.NEXT_PUBLIC_RAPID_API_HOST }}
      NEXT_PUBLIC_RAPID_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_RAPID_API_BASE_URL }}
      E2E_MOCK_MODE: 'true'
      API_MOCK_MODE: 'true'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Playwright browsers
        run: |
          echo "🔧 Setting up Playwright browsers for CI environment..."

          # Make sure the script is executable
          chmod +x ./scripts/testing/install-playwright-browsers.sh

          # Try the custom script first
          if ./scripts/testing/install-playwright-browsers.sh --verbose; then
            echo "✅ Custom browser installation script completed successfully"
          else
            echo "⚠️ Custom script failed, trying direct installation..."

            # Fallback: direct installation with verbose output
            echo "Installing Playwright browsers directly..."
            pnpm exec playwright install --with-deps

            # Verify installation
            echo "Verifying browser installation..."
            pnpm exec playwright install --list

            # Test if browsers are accessible
            if pnpm exec playwright install --list | grep -q "chromium" && \
               pnpm exec playwright install --list | grep -q "firefox" && \
               pnpm exec playwright install --list | grep -q "webkit"; then
              echo "✅ Direct browser installation completed successfully"
            else
              echo "❌ Browser installation verification failed"
              echo "Trying one more time with force..."
              pnpm exec playwright install --with-deps --force
              pnpm exec playwright install --list
              exit 1
            fi
          fi

      - name: Run E2E Mock Verification
        run: |
          pnpm exec playwright test tests/e2e/functional/mock-verification.spec.ts --reporter=line
          # Ensure coverage directory exists
          mkdir -p coverage
          # Create a placeholder coverage file if none exists
          if [ ! -f "coverage/lcov.info" ] && [ ! -f "coverage/coverage.json" ]; then
            echo "No coverage files found, creating placeholder"
            echo '{"type": "Coverage", "version": "1.0", "data": {}}' > coverage/coverage.json
          fi

      - name: Run E2E Smoke Tests (live staging)
        run: |
          pnpm exec playwright test tests/e2e/functional/smoke.spec.ts --reporter=line
          # Ensure coverage directory exists
          mkdir -p coverage
          # Create a placeholder coverage file if none exists
          if [ ! -f "coverage/lcov.info" ] && [ ! -f "coverage/coverage.json" ]; then
            echo "No coverage files found, creating placeholder"
            echo '{"type": "Coverage", "version": "1.0", "data": {}}' > coverage/coverage.json
          fi

      - name: Run E2E Live Games (live staging)
        run: |
          pnpm exec playwright test tests/e2e/functional/live-games.spec.ts --reporter=line
          # Ensure coverage directory exists
          mkdir -p coverage
          # Create a placeholder coverage file if none exists
          if [ ! -f "coverage/lcov.info" ] && [ ! -f "coverage/coverage.json" ]; then
            echo "No coverage files found, creating placeholder"
            echo '{"type": "Coverage", "version": "1.0", "data": {}}' > coverage/coverage.json
          fi

      - name: Run all functional E2E specs (in series, live staging)
        run: |
          for spec in tests/e2e/functional/*.spec.ts; do
            # Skip already run tests
            if [[ "$spec" != "tests/e2e/functional/mock-verification.spec.ts" &&
                  "$spec" != "tests/e2e/functional/smoke.spec.ts" &&
                  "$spec" != "tests/e2e/functional/live-games.spec.ts" ]]; then
              pnpm exec playwright test "$spec" --reporter=line || exit 1
            fi
          done

      - name: Run all page E2E specs (in series, live staging)
        run: |
          for spec in tests/e2e/pages/*.spec.ts; do
            pnpm exec playwright test "$spec" --reporter=line || exit 1
          done

      - name: Upload E2E Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            logs/
            test-results/
            playwright-report/
            coverage/
            build/
          retention-days: 7
          if-no-files-found: warn

  coverage-report:
    name: Coverage Report
    needs: [e2e-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate E2E Coverage Report
        run: |
          echo "Generating E2E test coverage report..."
          pnpm test:e2e:coverage

      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-artifacts
          path: |
            logs/
            test-results/
            playwright-report/
            coverage/
            build/
          retention-days: 7
          if-no-files-found: warn
