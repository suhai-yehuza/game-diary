name: Nightly Tests (Weekdays)

on:
  schedule:
    - cron: '0 2 * * 1-5' # Runs at 2 AM UTC on weekdays (Monday-Friday)
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: read
  actions: read

jobs:
  # Use preview workflow for comprehensive validation
  preview:
    name: Nightly Preview Validation
    uses: ./.github/workflows/preview.yml

  coverage-report:
    name: Coverage Report
    needs: [preview]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate E2E Coverage Report
        run: |
          echo "Generating E2E test coverage report..."
          pnpm test:e2e:coverage

      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-artifacts
          path: |
            logs/
            test-results/
            playwright-report/
            coverage/
            build/
          retention-days: 7
          if-no-files-found: warn
