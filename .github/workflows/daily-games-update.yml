name: Hourly Basketball Games Update

# Runs hourly during peak NBA game hours to keep database current
#
# SCHEDULING STRATEGY:
# ===================
#
# NBA games are typically played during these hours (Eastern Time):
# - Weekdays: 7:00 PM - 11:00 PM (games start around 7-8 PM)
# - Weekends: 1:00 PM - 11:00 PM (games start earlier on weekends)
#
# UTC CONVERSION:
# ===============
# - 6 PM Eastern = 11 PM UTC (23:00)
# - 11 PM Eastern = 4 AM UTC (04:00 next day)
# - 1 PM Eastern = 6 PM UTC (18:00)
#
# CRON SCHEDULE BREAKDOWN:
# =======================
# Weekdays (Mon-Fri):
#   - 11 PM UTC (6 PM Eastern) - Start of evening games
#   - 12 AM - 3 AM UTC (7 PM - 10 PM Eastern) - Peak game hours
#
# Weekends (Sat-Sun):
#   - 6 PM - 10 PM UTC (1 PM - 5 PM Eastern) - Afternoon games
#   - 11 PM UTC - 3 AM UTC (6 PM - 10 PM Eastern) - Evening games
#
# This ensures we capture games as they start and update throughout
# the evening, keeping the database current with live game data.
on:
  schedule:
    # Weekdays: Every hour from 11 PM to 4 AM UTC (6 PM - 11 PM Eastern)
    - cron: '0 23 * * 1-5' # 11 PM UTC Monday-Friday
    - cron: '0 0-3 * * 2-6' # 12 AM - 3 AM UTC Tuesday-Saturday

    # Weekends: Every hour from 6 PM to 4 AM UTC (1 PM - 11 PM Eastern)
    - cron: '0 18-23 * * 0' # 6 PM - 11 PM UTC Sunday
    - cron: '0 0-3 * * 1' # 12 AM - 3 AM UTC Monday
    - cron: '0 18-23 * * 6' # 6 PM - 11 PM UTC Saturday
    - cron: '0 0-3 * * 0' # 12 AM - 3 AM UTC Sunday

    # Bridge weekday to weekend transition
    - cron: '0 23 * * 0' # 11 PM UTC Sunday (bridges weekend to weekday)
    - cron: '0 23 * * 6' # 11 PM UTC Saturday (bridges weekday to weekend)

  workflow_dispatch: # Allow manual triggering
    inputs:
      date:
        description: 'Specific date to update (YYYY-MM-DD)'
        required: false
        type: string
      season:
        description: 'Specific season to update (YYYY)'
        required: false
        type: string
      dry-run:
        description: 'Preview changes without updating database'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  update-games:
    name: Update Basketball Games (Hourly) - ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [Production, Staging, Preview]
      fail-fast: false
    environment: ${{ matrix.environment }}

    env:
      NODE_VERSION: '22'
      PNPM_VERSION: '10'
      DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.POSTGRES_URL }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL || secrets.DATABASE_URL }}
      NEXT_PUBLIC_RAPID_API_KEY: ${{ secrets.NEXT_PUBLIC_RAPID_API_KEY }}
      NEXT_PUBLIC_RAPID_API_HOST: ${{ secrets.NEXT_PUBLIC_RAPID_API_HOST }}
      NEXT_PUBLIC_RAPID_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_RAPID_API_BASE_URL }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      KV_URL: ${{ secrets.KV_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      - name: Run type checking
        run: pnpm typecheck

      - name: Show current time and timezone
        run: |
          echo "🕐 Current UTC time: $(date -u)"
          echo "🕐 Current local time: $(date)"
          echo "🌍 Timezone: $(date +%Z)"
          echo "📅 Date: $(date +%Y-%m-%d)"
          echo ""
          echo "🌍 Environment: ${{ matrix.environment }}"
          echo ""
          echo "🎯 TARGET SCHEDULE:"
          echo "   Weekdays: 6 PM - 11 PM Eastern (11 PM - 4 AM UTC)"
          echo "   Weekends: 1 PM - 11 PM Eastern (6 PM - 4 AM UTC)"
          echo ""

      - name: Validate environment variables
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.POSTGRES_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL || secrets.DATABASE_URL }}
          NEXT_PUBLIC_RAPID_API_KEY: ${{ secrets.NEXT_PUBLIC_RAPID_API_KEY }}
          NEXT_PUBLIC_RAPID_API_HOST: ${{ secrets.NEXT_PUBLIC_RAPID_API_HOST }}
          NEXT_PUBLIC_RAPID_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_RAPID_API_BASE_URL }}
        run: |
          echo "🔍 Validating required environment variables..."
          echo ""
          echo "Debug: Checking secret access..."
          echo "  DATABASE_URL length: ${#DATABASE_URL}"
          echo "  POSTGRES_URL length: ${#POSTGRES_URL}"
          echo "  NEXT_PUBLIC_RAPID_API_KEY length: ${#NEXT_PUBLIC_RAPID_API_KEY}"
          echo "  NEXT_PUBLIC_RAPID_API_HOST length: ${#NEXT_PUBLIC_RAPID_API_HOST}"
          echo ""

          # Check if secrets are accessible (even if empty)
          if [ -z "${DATABASE_URL:-}" ] && [ -z "${POSTGRES_URL:-}" ]; then
            echo "❌ ERROR: DATABASE_URL or POSTGRES_URL must be set"
            echo ""
            echo "Troubleshooting:"
            echo "  1. Check if DATABASE_URL secret is configured in GitHub Actions"
            echo "     Go to: Settings → Secrets and variables → Actions"
            echo "  2. Verify the secret name is exactly 'DATABASE_URL' (case-sensitive)"
            echo "  3. Ensure the workflow has permission to access secrets"
            echo ""
            echo "Current secret values (lengths only):"
            echo "  secrets.DATABASE_URL length: ${#DATABASE_URL}"
            echo "  secrets.POSTGRES_URL length: ${#POSTGRES_URL}"
            exit 1
          fi

          if [ -z "${NEXT_PUBLIC_RAPID_API_KEY:-}" ]; then
            echo "❌ ERROR: NEXT_PUBLIC_RAPID_API_KEY must be set"
            echo "  secrets.NEXT_PUBLIC_RAPID_API_KEY length: ${#NEXT_PUBLIC_RAPID_API_KEY}"
            exit 1
          fi

          if [ -z "${NEXT_PUBLIC_RAPID_API_HOST:-}" ]; then
            echo "❌ ERROR: NEXT_PUBLIC_RAPID_API_HOST must be set"
            echo "  secrets.NEXT_PUBLIC_RAPID_API_HOST length: ${#NEXT_PUBLIC_RAPID_API_HOST}"
            exit 1
          fi

          echo "✅ All required environment variables are set"
          echo "   DATABASE_URL: ${DATABASE_URL:+SET (${#DATABASE_URL} chars)}"
          echo "   POSTGRES_URL: ${POSTGRES_URL:+SET (${#POSTGRES_URL} chars)}"
          echo "   NEXT_PUBLIC_RAPID_API_KEY: ${NEXT_PUBLIC_RAPID_API_KEY:+SET (${#NEXT_PUBLIC_RAPID_API_KEY} chars)}"
          echo "   NEXT_PUBLIC_RAPID_API_HOST: ${NEXT_PUBLIC_RAPID_API_HOST:+SET (${#NEXT_PUBLIC_RAPID_API_HOST} chars)}"

      - name: Update basketball games
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.POSTGRES_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL || secrets.DATABASE_URL }}
          NEXT_PUBLIC_RAPID_API_KEY: ${{ secrets.NEXT_PUBLIC_RAPID_API_KEY }}
          NEXT_PUBLIC_RAPID_API_HOST: ${{ secrets.NEXT_PUBLIC_RAPID_API_HOST }}
          NEXT_PUBLIC_RAPID_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_RAPID_API_BASE_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          KV_URL: ${{ secrets.KV_URL }}
        run: |
          # Debug: Verify environment variables are set (without exposing values)
          echo "🔍 Verifying environment variables in script execution context..."
          if [ -z "$DATABASE_URL" ] && [ -z "$POSTGRES_URL" ]; then
            echo "❌ ERROR: Neither DATABASE_URL nor POSTGRES_URL is set in this step"
            echo "This suggests the secret may not be configured or accessible"
            exit 1
          fi

          if [ -n "$DATABASE_URL" ]; then
            echo "✅ DATABASE_URL is set (length: ${#DATABASE_URL} characters)"
          fi

          if [ -n "$POSTGRES_URL" ]; then
            echo "✅ POSTGRES_URL is set (length: ${#POSTGRES_URL} characters)"
          fi

          # Build command based on inputs
          COMMAND="pnpm update:daily-games"

          # Add date parameter if provided, otherwise use script's default 7-day back/forward range
          # This ensures we catch all games including those that need results updated
          if [ -n "${{ github.event.inputs.date }}" ]; then
            COMMAND="$COMMAND --date=${{ github.event.inputs.date }}"
          else
            # Let the script use its default 7-day back and 7-day forward range
            # This ensures we catch past games that need results and future scheduled games
            echo "📅 Using script default: 7 days back and 7 days forward"
          fi

          # Add season parameter if provided
          if [ -n "${{ github.event.inputs.season }}" ]; then
            COMMAND="$COMMAND --season=${{ github.event.inputs.season }}"
          fi

          # Add dry-run flag if requested
          if [ "${{ github.event.inputs.dry-run }}" = "true" ]; then
            COMMAND="$COMMAND --dry-run"
          fi

          echo "Running: $COMMAND"
          $COMMAND

      - name: Check update results
        run: |
          echo "✅ Basketball games update completed successfully for ${{ matrix.environment }}"
          echo "📊 Check the logs above for detailed results"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Basketball games update failed"
          echo "Please check the logs above for error details"
