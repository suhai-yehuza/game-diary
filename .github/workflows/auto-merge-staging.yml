name: Auto Merge - Staging to Master

# Auto-merge workflow that runs hourly to merge staging into master
# whenever there are new commits in staging that are not yet in master
# Note: This is now a backup mechanism since staging pushes trigger immediate merges

on:
  schedule:
    - cron: '0 * * * *' # every hour

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth status || echo "GitHub CLI not authenticated, proceeding with token..."

      - name: Ensure auto-merge label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if auto-merge label exists, create if it doesn't
          if ! gh label list --json name --jq '.[] | select(.name == "auto-merge")' 2>/dev/null | grep -q "auto-merge"; then
            echo "Creating auto-merge label..."
            gh label create "auto-merge" \
              --description "Automated pull request for staging to master merge" \
              --color "0e8a16" 2>/dev/null || echo "Label creation failed or already exists"
          else
            echo "auto-merge label already exists"
          fi

      - name: Fetch all branches
        run: |
          git fetch origin master
          git fetch origin staging

      - name: Check if staging has new commits
        id: check
        run: |
          STAGING_COMMIT=$(git rev-parse origin/staging)
          MASTER_COMMIT=$(git rev-parse origin/master)

          if [ "$STAGING_COMMIT" = "$MASTER_COMMIT" ]; then
            echo "staging_ahead=false" >> $GITHUB_OUTPUT
            echo "No new commits in staging"
          else
            echo "staging_ahead=true" >> $GITHUB_OUTPUT
            echo "Staging is ahead of master"
          fi

      - name: Create or update PR
        if: steps.check.outputs.staging_ahead == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if PR already exists
          PR_NUMBER=$(gh pr list --head staging --base master --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -z "$PR_NUMBER" ]; then
            echo "Creating new PR from staging to master"
            gh pr create \
              --title "Auto-merge: staging → master" \
              --body "Automated PR from staging to master branch" \
              --base master \
              --head staging \
              --label "auto-merge"
            echo "PR created successfully with auto-merge label"
          else
            echo "PR #$PR_NUMBER already exists, updating..."
          fi

      - name: Enable auto-merge
        if: steps.check.outputs.staging_ahead == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --head staging --base master --json number --jq '.[0].number')
          if [ ! -z "$PR_NUMBER" ]; then
            echo "Enabling auto-merge for PR #$PR_NUMBER"
            gh pr merge $PR_NUMBER --auto --merge
          fi

      - name: Summary
        if: always()
        run: |
          echo "## 🔄 Auto-Merge Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Staging Ahead of Master:** ${{ steps.check.outputs.staging_ahead }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.check.outputs.staging_ahead }}" = "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **PR created/updated and auto-merge enabled**" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⏭️ **No new commits to merge**" >> $GITHUB_STEP_SUMMARY
          fi
