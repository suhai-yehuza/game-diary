name: Vercel Staging Deployment with Soak Period

# Enhanced staging deployment workflow with soaking periods:
# - Comprehensive testing before deployment
# - Gradual rollout with health monitoring
# - Automated rollback on issues
# - Performance monitoring during soak
# - Integration with existing E2E testing

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  NODE_VERSION: '22'
  PNPM_VERSION: '10'
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  PORT: 3000
  # Soak period configuration
  SOAK_DURATION: 1800 # 30 minutes
  HEALTH_CHECK_INTERVAL: 30
  PERFORMANCE_CHECK_INTERVAL: 300

on:
  push:
    branches:
      - staging-soak

jobs:
  quality-gate:
    name: Quality Gate (Lint, Typecheck, Format, Build)
    runs-on: ubuntu-latest
    environment: Staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Run CI Quality Gate
        run: ./scripts/ci-quality-gate.sh staging

  unit-tests:
    name: Unit Tests
    needs: [quality-gate]
    runs-on: ubuntu-latest
    environment: Staging
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Run CI Unit Tests
        run: ./scripts/ci-unit-tests.sh
      - uses: codecov/codecov-action@v4
        if: success()
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
      - name: Upload unit test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            coverage/
            test-results/
          retention-days: 7

  e2e:
    name: E2E Tests
    needs: [quality-gate]
    runs-on: ubuntu-latest
    environment: Staging
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    strategy:
      matrix:
        test: [smoke, critical]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - name: Run CI E2E Tests
        run: ./scripts/ci-e2e-tests.sh ${{ matrix.test }}
      - name: Upload E2E test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.test }}-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  e2e-responsive:
    name: Responsive E2E Tests
    needs: [unit-tests, e2e]
    runs-on: ubuntu-latest
    environment: Staging
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - name: Run Responsive E2E Tests
        run: ./scripts/e2e-run.sh responsive 3600
        continue-on-error: false
      - name: Upload E2E test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-responsive-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Vercel Staging
    needs: [e2e-responsive]
    runs-on: ubuntu-latest
    if: success() && needs.e2e-responsive.result == 'success'
    environment: Staging
    outputs:
      deployment-url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - name: Cache Vercel CLI
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-vercel-cli-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vercel-cli-
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=staging --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "Deployment URL: $DEPLOYMENT_URL"

  soak-period:
    name: Soak Period Monitoring
    needs: [deploy]
    runs-on: ubuntu-latest
    if: success() && needs.deploy.result == 'success'
    environment: Staging
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VERCEL_STAGING_URL: ${{ needs.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - name: Install required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc jq curl
      - name: Start Soak Period
        run: |
          echo "Starting soak period for staging deployment"
          echo "Deployment URL: $VERCEL_STAGING_URL"
          echo "Soak duration: $SOAK_DURATION seconds"
          ./scripts/soak-monitor.sh start staging $SOAK_DURATION
      - name: Monitor During Soak Period
        run: |
          echo "Monitoring deployment during soak period..."
          ./scripts/soak-monitor.sh monitor staging $SOAK_DURATION
        continue-on-error: true
      - name: Check Soak Status
        run: |
          echo "=== Final Soak Status ==="
          ./scripts/soak-monitor.sh status
          if [ -f ./.soak/status.json ]; then
            cat ./.soak/status.json | jq '.'
          fi
      - name: Upload Soak Results
        uses: actions/upload-artifact@v4
        with:
          name: soak-period-results
          path: |
            ./.soak/
          retention-days: 30
      - name: Fail if Soak Failed
        if: failure()
        run: |
          echo "❌ Soak period failed - deployment may be unstable"
          exit 1

  post-soak-validation:
    name: Post-Soak Validation
    needs: [soak-period]
    runs-on: ubuntu-latest
    if: success() && needs.soak-period.result == 'success'
    environment: Staging
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VERCEL_STAGING_URL: ${{ needs.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - name: Run Post-Soak E2E Tests
        run: |
          echo "Running comprehensive post-soak validation..."
          DEPLOYMENT_URL="$VERCEL_STAGING_URL" pnpm test:e2e:critical
          DEPLOYMENT_URL="$VERCEL_STAGING_URL" pnpm test:e2e:responsive
      - name: Upload Post-Soak Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: post-soak-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 30

  deployment-summary:
    name: Deployment Summary
    needs: [post-soak-validation]
    runs-on: ubuntu-latest
    if: always()
    environment: Staging
    steps:
      - uses: actions/checkout@v4
      - name: Download Soak Results
        uses: actions/download-artifact@v4
        with:
          name: soak-period-results
          path: ./.soak
      - name: Generate Deployment Summary
        run: |
          echo "## 🚀 Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f ./.soak/status.json ]; then
            echo "### Soak Period Results" >> $GITHUB_STEP_SUMMARY
            cat ./.soak/status.json | jq -r '
              "**Status:** " + .status + "\n" +
              "**Environment:** " + .environment + "\n" +
              "**Start Time:** " + .start_time + "\n" +
              "**End Time:** " + (.end_time // "N/A") + "\n" +
              "**Duration:** " + (.duration // "N/A") + " seconds\n"
            ' >> $GITHUB_STEP_SUMMARY

            if [ -f ./.soak/metrics.json ]; then
              echo "### Final Metrics" >> $GITHUB_STEP_SUMMARY
              cat ./.soak/metrics.json | jq -r '
                "**Total Checks:** " + (.total_checks // 0) + "\n" +
                "**Healthy Checks:** " + (.healthy_checks // 0) + "\n" +
                "**Error Rate:** " + ((.error_rate // 0) * 100 | tostring) + "%\n" +
                "**Avg Response Time:** " + (.avg_response_time // 0) + "ms\n"
              ' >> $GITHUB_STEP_SUMMARY
            fi
          fi

          echo "### Job Results" >> $GITHUB_STEP_SUMMARY
          echo "- Quality Gate: ${{ needs.quality-gate.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Unit Tests: ${{ needs.unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- E2E Tests: ${{ needs.e2e.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Responsive Tests: ${{ needs.e2e-responsive.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Deployment: ${{ needs.deploy.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Soak Period: ${{ needs.soak-period.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Post-Soak Validation: ${{ needs.post-soak-validation.result }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.post-soak-validation.result }}" = "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Deployment completed successfully with soak period validation!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Deployment failed during soak period or validation!**" >> $GITHUB_STEP_SUMMARY
          fi
