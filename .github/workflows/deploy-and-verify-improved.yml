name: Deploy and Verify Workflow (Improved)

on:
  workflow_call:
    inputs:
      workflow-name:
        description: 'Name of the workflow'
        required: true
        type: string
      environment:
        description: 'Deployment environment'
        required: true
        type: string
        default: 'Production'
      debug-mode:
        description: 'Enable debug mode'
        required: false
        type: boolean
        default: false
    secrets:
      VERCEL_ORG_ID:
        required: false
      VERCEL_PROJECT_ID:
        required: false
      VERCEL_TOKEN:
        required: false
      DATABASE_URL:
        required: false
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:
        required: false
      CLERK_SECRET_KEY:
        required: false
      CLERK_WEBHOOK_SIGNING_SECRET:
        required: false
      VERCEL_AUTOMATION_BYPASS_SECRET:
        required: false
      NEXT_PUBLIC_RAPID_API_KEY:
        required: false
      NEXT_PUBLIC_RAPID_API_HOST:
        required: false
      NEXT_PUBLIC_RAPID_API_BASE_URL:
        required: false

permissions:
  contents: write
  actions: read

jobs:
  # Enhanced deploy job with better error handling and debugging
  deploy:
    name: Deploy to Vercel (Enhanced)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    outputs:
      deployment-url: ${{ steps.deploy.outputs.url }}
      deployment-id: ${{ steps.deploy.outputs.deployment-id }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup debugging tools
        if: ${{ inputs.debug-mode }}
        run: |
          echo "🔧 Setting up debugging tools..."
          sudo apt-get update -qq
          sudo apt-get install -y jq curl wget

      - name: Validate Vercel configuration
        run: |
          echo "🔍 Validating Vercel configuration..."

          # Check required secrets
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "❌ VERCEL_TOKEN is not set"
            exit 1
          fi

          if [ -z "${{ secrets.VERCEL_ORG_ID }}" ]; then
            echo "⚠️ VERCEL_ORG_ID is not set - using default team context"
          fi

          if [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "⚠️ VERCEL_PROJECT_ID is not set - using default project"
          fi

          echo "✅ Vercel configuration validation passed"

      - name: Deploy to Vercel (Enhanced)
        id: deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
          NEXT_PUBLIC_RAPID_API_KEY: ${{ secrets.NEXT_PUBLIC_RAPID_API_KEY }}
          NEXT_PUBLIC_RAPID_API_HOST: ${{ secrets.NEXT_PUBLIC_RAPID_API_HOST }}
          NEXT_PUBLIC_RAPID_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_RAPID_API_BASE_URL }}
          CI: 'true'
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          DEPLOYMENT_URL: ${{ secrets.VERCEL_PREVIEW_URL }}
          E2E_AUTH_BYPASS: 'true'
          TEST_USER_EMAIL: 'test@game-diary.com'
          TEST_USER_ID: 'test_user_123'
        run: |
          echo "🚀 Deploying to ${{ inputs.environment }} environment..."

          # Enhanced error handling
          set -e

          # Install Vercel CLI with version pinning
          echo "📦 Installing Vercel CLI..."
          npm install --global vercel@latest

          # Show Vercel CLI version and configuration
          echo "🔧 Vercel CLI version:"
          vercel --version

          # Test Vercel authentication
          echo "🔐 Testing Vercel authentication..."
          if ! vercel --token ${{ secrets.VERCEL_TOKEN }} whoami >/dev/null 2>&1; then
            echo "❌ Vercel authentication failed"
            exit 1
          fi
          echo "✅ Vercel authentication successful"

          # Deploy to Vercel with enhanced error handling
          echo "🚀 Starting deployment..."

          # Set team context if available
          local vercel_cmd="vercel"
          if [ -n "${{ secrets.VERCEL_ORG_ID }}" ]; then
            vercel_cmd="$vercel_cmd --scope ${{ secrets.VERCEL_ORG_ID }}"
          fi

          # Add token
          vercel_cmd="$vercel_cmd --token ${{ secrets.VERCEL_TOKEN }}"

          # Add environment-specific flags
          if [ "${{ inputs.environment }}" = "Production" ]; then
            vercel_cmd="$vercel_cmd --prod"
          fi

          # Add debug mode if enabled
          if [ "${{ inputs.debug-mode }}" = "true" ]; then
            vercel_cmd="$vercel_cmd --debug"
          fi

          echo "🔧 Running: $vercel_cmd"

          # Execute deployment with retry logic
          local deployment_output=""
          for attempt in {1..3}; do
            echo "Attempt $attempt/3: Deploying to Vercel..."
            if deployment_output=$($vercel_cmd 2>&1); then
              echo "✅ Deployment successful"
              break
            elif [ $attempt -eq 3 ]; then
              echo "❌ Deployment failed after 3 attempts"
              echo "Deployment output:"
              echo "$deployment_output"
              exit 1
            else
              echo "⚠️ Attempt $attempt failed, retrying in 10 seconds..."
              echo "Deployment output:"
              echo "$deployment_output"
              sleep 10
            fi
          done

          # Enhanced URL extraction with multiple methods
          echo "🔍 Extracting deployment URL..."

          # Method 1: Parse from deployment output
          local deployment_url=$(echo "$deployment_output" | grep -o 'https://[^[:space:]]*\.vercel\.app' | head -1)

          if [ -z "$deployment_url" ]; then
            echo "⚠️ Method 1 failed, trying Method 2..."

            # Method 2: Use vercel ls
            local vercel_ls_output=$(vercel ls --token ${{ secrets.VERCEL_TOKEN }} 2>&1)
            deployment_url=$(echo "$vercel_ls_output" | grep -E ".*\.vercel\.app" | head -1 | awk '{print $2}')
          fi

          if [ -z "$deployment_url" ]; then
            echo "⚠️ Method 2 failed, trying Method 3..."

            # Method 3: Use vercel inspect
            local vercel_inspect_output=$(vercel inspect --token ${{ secrets.VERCEL_TOKEN }} 2>&1)
            deployment_url=$(echo "$vercel_inspect_output" | grep -o 'https://[^[:space:]]*\.vercel\.app' | head -1)
          fi

          if [ -z "$deployment_url" ]; then
            echo "⚠️ All methods failed, using fallback URL..."
            if [ "${{ inputs.environment }}" = "Production" ]; then
              deployment_url="https://game-diary.vercel.app"
            else
              deployment_url="${{ secrets.VERCEL_PREVIEW_URL }}"
            fi
          fi

          echo "✅ Deployment URL: $deployment_url"
          echo "url=$deployment_url" >> $GITHUB_OUTPUT

          # Extract deployment ID if possible
          local deployment_id=$(echo "$deployment_output" | grep -o 'https://[^[:space:]]*\.vercel\.app' | head -1 | sed 's/.*\///' | sed 's/\.vercel\.app//')
          if [ -n "$deployment_id" ]; then
            echo "deployment-id=$deployment_id" >> $GITHUB_OUTPUT
          fi

      - name: Upload Deploy Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-artifacts-enhanced
          path: |
            logs/
            test-results/
            playwright-report/
            coverage/
            build/
          retention-days: 7
          if-no-files-found: warn

  # Enhanced post-deployment verification with better error handling
  post-deploy-verification:
    name: E2E Post-Deployment Verification (${{ inputs.environment }}) (Enhanced)
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.environment == 'Production' && 90 || 60 }}
    environment: ${{ inputs.environment }}
    outputs:
      deployment-url: ${{ needs.deploy.outputs.deployment-url }}
      verification-status: ${{ steps.verify.outputs.status }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup debugging tools
        if: ${{ inputs.debug-mode }}
        run: |
          echo "🔧 Setting up debugging tools..."
          sudo apt-get update -qq
          sudo apt-get install -y jq curl wget

      - name: Setup validation scripts
        run: |
          echo "🔧 Setting up validation scripts..."
          chmod +x scripts/validation/*.sh
          echo "✅ Validation scripts are now executable"

      - name: Setup Playwright browsers (Enhanced)
        run: |
          echo "🔧 Setting up Playwright browsers for CI environment..."

          # Enhanced browser installation with retry logic
          for attempt in {1..3}; do
            echo "Attempt $attempt/3: Installing Playwright browsers..."
            if ./scripts/testing/install-playwright-browsers.sh --verbose; then
              echo "✅ Custom browser installation script completed successfully"
              break
            elif [ $attempt -eq 3 ]; then
              echo "⚠️ Custom script failed, trying direct installation..."
              pnpm exec playwright install --with-deps
              pnpm exec playwright install --list
            else
              echo "⚠️ Attempt $attempt failed, retrying in 10 seconds..."
              sleep 10
            fi
          done

      - name: Validate and Test Deployment (Enhanced)
        id: verify
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
          NEXT_PUBLIC_RAPID_API_KEY: ${{ secrets.NEXT_PUBLIC_RAPID_API_KEY }}
          NEXT_PUBLIC_RAPID_API_HOST: ${{ secrets.NEXT_PUBLIC_RAPID_API_HOST }}
          NEXT_PUBLIC_RAPID_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_RAPID_API_BASE_URL }}
          CI: 'true'
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment-url }}
          E2E_AUTH_BYPASS: 'true'
          TEST_USER_EMAIL: 'test@game-diary.com'
          TEST_USER_ID: 'test_user_123'
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          E2E_POST_DEPLOY_VERIFICATION: 'true'
          MOCK_MODE: 'false'
        run: |
          # Enhanced error handling
          set -e

          # Set environment-specific variables
          if [ "${{ inputs.environment }}" = "Production" ]; then
            ENVIRONMENT_NAME="production"
            VERIFICATION_MESSAGE="optimized post-deployment verification"
          else
            ENVIRONMENT_NAME="staging"
            VERIFICATION_MESSAGE="staging post-deployment verification"
          fi

          echo "🚀 Running $VERIFICATION_MESSAGE..."
          echo "Deployment URL: $DEPLOYMENT_URL"

          # Validate deployment URL
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "❌ Deployment URL is empty"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Enhanced deployment validation with retry logic
          echo "🔍 Running comprehensive deployment validation..."

          for attempt in {1..3}; do
            echo "Attempt $attempt/3: Validating deployment..."
            if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
              echo "Using Vercel automation bypass for validation..."
              if ./scripts/validation/deployment-validate.sh "$DEPLOYMENT_URL" --bypass-secret "$VERCEL_AUTOMATION_BYPASS_SECRET" --ci; then
                echo "✅ Deployment validation passed"
                break
              elif [ $attempt -eq 3 ]; then
                echo "❌ Deployment validation failed after 3 attempts"
                echo "status=failed" >> $GITHUB_OUTPUT
                exit 1
              else
                echo "⚠️ Attempt $attempt failed, retrying in 10 seconds..."
                sleep 10
              fi
            else
              echo "Running validation without bypass secret..."
              if ./scripts/validation/deployment-validate.sh "$DEPLOYMENT_URL" --ci; then
                echo "✅ Deployment validation passed"
                break
              elif [ $attempt -eq 3 ]; then
                echo "❌ Deployment validation failed after 3 attempts"
                echo "status=failed" >> $GITHUB_OUTPUT
                exit 1
              else
                echo "⚠️ Attempt $attempt failed, retrying in 10 seconds..."
                sleep 10
              fi
            fi
          done

          # Run comprehensive post-deployment verification tests
          echo "📋 Running post-deployment verification tests..."

          # Ensure CI environment variable is set for coverage generation
          export CI=true
          echo "CI environment variable: $CI"

          # Create necessary directories
          mkdir -p test-results
          mkdir -p playwright-report
          mkdir -p coverage

          # Enhanced test execution with retry logic
          for attempt in {1..2}; do
            echo "Attempt $attempt/2: Running E2E tests..."
            if pnpm exec playwright test tests/e2e/functional/post-deploy-verification.spec.ts --workers=1 --reporter=list,json,junit,html; then
              echo "✅ E2E tests passed"
              break
            elif [ $attempt -eq 2 ]; then
              echo "❌ E2E tests failed after 2 attempts"
              echo "status=failed" >> $GITHUB_OUTPUT
              exit 1
            else
              echo "⚠️ Attempt $attempt failed, retrying in 15 seconds..."
              sleep 15
            fi
          done

          echo "✅ $ENVIRONMENT_NAME post-deployment verification completed"
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload Post-Deployment Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.environment }}-post-deploy-verification-artifacts-enhanced
          path: |
            test-results/
            playwright-report/
            coverage/
          retention-days: 7
          if-no-files-found: warn

      - name: Post-Deployment Summary (Enhanced)
        if: always()
        env:
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment-url }}
        run: |
          echo ""
          echo "📋 Post-Deployment Verification Summary (Enhanced)"
          echo "================================================"
          echo "🚀 Deployment URL: $DEPLOYMENT_URL"
          echo "✅ Post-deployment verification: ${{ steps.verify.outputs.status }}"
          echo "🔍 Health checks completed"
          echo "📊 Test artifacts generated"
          echo "✅ Post-deployment verification completed successfully!"

  # Enhanced domain update with better error handling
  update-domain:
    name: Update ${{ inputs.environment }} Domain (Enhanced)
    needs: [post-deploy-verification]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm i -g vercel@latest

      - name: Make helper script executable
        run: chmod +x scripts/vercel-deploy-helper.sh

      - name: Update Domain (Enhanced)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOYMENT_URL: ${{ needs.post-deploy-verification.outputs.deployment-url }}
        run: |
          # Enhanced error handling
          set -e

          # Set environment-specific variables
          if [ "${{ inputs.environment }}" = "Production" ]; then
            DOMAIN_NAME="www.game-diary.io"
            DOMAIN_URL="https://www.game-diary.io"
            ENVIRONMENT_NAME="production"
            VERIFICATION_ENDPOINT="/api/health"
          else
            DOMAIN_NAME="staging.game-diary.io"
            DOMAIN_URL="https://staging.game-diary.io"
            ENVIRONMENT_NAME="staging"
            VERIFICATION_ENDPOINT="/api/health"
          fi

          echo "🔗 Updating $ENVIRONMENT_NAME domain to point to latest deployment..."
          echo "Deployment URL: $DEPLOYMENT_URL"
          echo "Domain: $DOMAIN_NAME"
          echo "Team ID: $VERCEL_ORG_ID"

          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "❌ Deployment URL is empty, skipping domain update"
            exit 1
          fi

          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "⚠️ VERCEL_ORG_ID is not set, using default team context"
          fi

          # Wait a moment for deployment to be fully ready
          echo "⏳ Waiting for deployment to be ready..."
          sleep 15

          # Enhanced domain update with retry logic
          if [ "${{ inputs.environment }}" = "Production" ]; then
            echo "🔄 Promoting deployment to production..."

            # Retry logic for production promotion
            for attempt in {1..3}; do
              echo "Attempt $attempt/3: Promoting to production..."
              if [ -n "$VERCEL_ORG_ID" ]; then
                echo "Using team context: $VERCEL_ORG_ID"
                if vercel promote "$DEPLOYMENT_URL" --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" --yes; then
                  echo "✅ Successfully promoted deployment to production: $DEPLOYMENT_URL"
                  break
                elif [ $attempt -eq 3 ]; then
                  echo "❌ Failed to promote deployment to production after 3 attempts"
                  exit 1
                else
                  echo "⚠️ Attempt $attempt failed, retrying in 10 seconds..."
                  sleep 10
                fi
              else
                if vercel promote "$DEPLOYMENT_URL" --token "$VERCEL_TOKEN" --yes; then
                  echo "✅ Successfully promoted deployment to production: $DEPLOYMENT_URL"
                  break
                elif [ $attempt -eq 3 ]; then
                  echo "❌ Failed to promote deployment to production after 3 attempts"
                  exit 1
                else
                  echo "⚠️ Attempt $attempt failed, retrying in 10 seconds..."
                  sleep 10
                fi
              fi
            done
          else
            echo "🔄 Setting staging domain alias..."

            # Retry logic for staging domain alias
            for attempt in {1..3}; do
              echo "Attempt $attempt/3: Setting staging domain alias..."
              if [ -n "$VERCEL_ORG_ID" ]; then
                echo "Using team context: $VERCEL_ORG_ID"
                if vercel alias set "$DEPLOYMENT_URL" "$DOMAIN_NAME" --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"; then
                  echo "✅ Successfully updated $DOMAIN_NAME to point to: $DEPLOYMENT_URL"
                  break
                elif [ $attempt -eq 3 ]; then
                  echo "⚠️ Team context alias set failed, trying without team context..."
                  if vercel alias set "$DEPLOYMENT_URL" "$DOMAIN_NAME" --token "$VERCEL_TOKEN"; then
                    echo "✅ Successfully updated $DOMAIN_NAME to point to: $DEPLOYMENT_URL"
                    break
                  else
                    echo "❌ Failed to update staging domain with both team context and fallback"
                    echo "⚠️ This might be due to insufficient token permissions for domain management"
                    echo "⚠️ The deployment was successful, but domain alias update failed"
                    echo "⚠️ You may need to manually update the domain alias or check token permissions"
                    exit 1
                  fi
                else
                  echo "⚠️ Attempt $attempt failed, retrying in 10 seconds..."
                  sleep 10
                fi
              else
                if vercel alias set "$DEPLOYMENT_URL" "$DOMAIN_NAME" --token "$VERCEL_TOKEN"; then
                  echo "✅ Successfully updated $DOMAIN_NAME to point to: $DEPLOYMENT_URL"
                  break
                elif [ $attempt -eq 3 ]; then
                  echo "❌ Failed to update staging domain after 3 attempts"
                  echo "⚠️ This might be due to insufficient token permissions for domain management"
                  echo "⚠️ The deployment was successful, but domain alias update failed"
                  echo "⚠️ You may need to manually update the domain alias or check token permissions"
                  exit 1
                else
                  echo "⚠️ Attempt $attempt failed, retrying in 10 seconds..."
                  sleep 10
                fi
              fi
            done
          fi

          # Enhanced domain verification with retry logic
          echo "🔍 Verifying domain is accessible..."
          for i in {1..10}; do
            if curl -f -s --max-time 30 "$DOMAIN_URL$VERIFICATION_ENDPOINT" > /dev/null 2>&1; then
              echo "✅ $ENVIRONMENT_NAME domain is accessible and working"
              break
            fi
            if [ $i -eq 10 ]; then
              echo "⚠️ $ENVIRONMENT_NAME domain verification failed after 10 attempts, but deployment may still be working"
            fi
            echo "⏳ Retrying domain verification... (attempt $i/10)"
            sleep 15
          done

      - name: Upload Domain Update Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.environment }}-domain-update-artifacts-enhanced
          path: |
            logs/
            test-results/
          retention-days: 7
          if-no-files-found: warn
