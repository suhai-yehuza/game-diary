name: Staging Deployment (Automatic from Master)

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      force-deploy:
        description: 'Force deployment even if no new commits'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  # Check if there are new commits since last staging deployment
  check-new-commits:
    name: Check for New Commits
    runs-on: ubuntu-latest
    if: ${{ !inputs.force-deploy || github.event_name == 'push' }}
    outputs:
      has-new-commits: ${{ steps.check-commits.outputs.has-new-commits }}
      last-staging-commit: ${{ steps.check-commits.outputs.last-staging-commit }}
      current-commit: ${{ steps.check-commits.outputs.current-commit }}
      has-recent-failures: ${{ steps.check-commits.outputs.has-recent-failures }}
      last-failed-commit: ${{ steps.check-commits.outputs.last-failed-commit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new commits since last staging deployment
        id: check-commits
        run: |
          echo "Checking for new commits since last staging deployment..."

          # Get the current commit hash
          CURRENT_COMMIT=$(git rev-parse HEAD)
          echo "Current commit: $CURRENT_COMMIT"
          echo "current-commit=$CURRENT_COMMIT" >> $GITHUB_OUTPUT

          # Get the last staging deployment commit from GitHub API
          echo "Fetching last staging deployment info..."

          # Get the latest successful staging deployment
          STAGING_DEPLOYMENT=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?workflow_id=staging.yml&branch=staging&status=completed&conclusion=success&per_page=1" | \
            jq -r '.workflow_runs[0] // empty')

          # Get the latest failed staging deployment (if any)
          FAILED_STAGING_DEPLOYMENT=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?workflow_id=staging.yml&branch=staging&status=completed&conclusion=failure&per_page=1" | \
            jq -r '.workflow_runs[0] // empty')

          if [ -z "$STAGING_DEPLOYMENT" ]; then
            echo "No previous staging deployment found, proceeding with deployment"
            echo "has-new-commits=true" >> $GITHUB_OUTPUT
            echo "last-staging-commit=none" >> $GITHUB_OUTPUT
            echo "has-recent-failures=false" >> $GITHUB_OUTPUT
            echo "last-failed-commit=none" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get the commit hash from the last staging deployment
          LAST_STAGING_COMMIT=$(echo "$STAGING_DEPLOYMENT" | jq -r '.head_sha')
          LAST_STAGING_TIME=$(echo "$STAGING_DEPLOYMENT" | jq -r '.created_at')
          echo "Last staging deployment commit: $LAST_STAGING_COMMIT"
          echo "last-staging-commit=$LAST_STAGING_COMMIT" >> $GITHUB_OUTPUT

          # Check if there are recent failures
          if [ -n "$FAILED_STAGING_DEPLOYMENT" ]; then
            FAILED_COMMIT=$(echo "$FAILED_STAGING_DEPLOYMENT" | jq -r '.head_sha')
            FAILED_TIME=$(echo "$FAILED_STAGING_DEPLOYMENT" | jq -r '.created_at')

            echo "Found failed staging deployment: $FAILED_COMMIT at $FAILED_TIME"
            echo "last-failed-commit=$FAILED_COMMIT" >> $GITHUB_OUTPUT

            # Check if the failed deployment is more recent than the last successful one
            FAILED_TIME_UNIX=$(date -d "$FAILED_TIME" +%s)
            LAST_STAGING_TIME_UNIX=$(date -d "$LAST_STAGING_TIME" +%s)
            if [ "$FAILED_TIME_UNIX" -gt "$LAST_STAGING_TIME_UNIX" ]; then
              echo "⚠️ Recent staging deployment failure detected"
              echo "has-recent-failures=true" >> $GITHUB_OUTPUT

              # Check if current commit is the same as the failed commit
              if [ "$CURRENT_COMMIT" = "$FAILED_COMMIT" ]; then
                echo "❌ Current commit is the same as the failed commit - deployment blocked"
                echo "has-new-commits=false" >> $GITHUB_OUTPUT
                exit 0
              fi

              # Check if current commit is newer than the failed commit
              if [ "$CURRENT_COMMIT" != "$FAILED_COMMIT" ]; then
                echo "✅ Current commit is different from failed commit - proceeding with deployment"
                echo "has-new-commits=true" >> $GITHUB_OUTPUT
                exit 0
              fi
            else
              echo "✅ Failed deployment is older than last successful deployment"
              echo "has-recent-failures=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "No recent failed deployments found"
            echo "has-recent-failures=false" >> $GITHUB_OUTPUT
            echo "last-failed-commit=none" >> $GITHUB_OUTPUT
          fi

          # Check if current commit is different from last staging commit
          if [ "$CURRENT_COMMIT" = "$LAST_STAGING_COMMIT" ]; then
            echo "No new commits since last staging deployment"
            echo "has-new-commits=false" >> $GITHUB_OUTPUT
          else
            echo "New commits found since last staging deployment"
            echo "has-new-commits=true" >> $GITHUB_OUTPUT
          fi

  # Deploy to staging if there are new commits or force-deploy is enabled
  deploy:
    name: Deploy to Staging
    needs: [check-new-commits]
    if: ${{ inputs.force-deploy || (needs.check-new-commits.outputs.has-new-commits == 'true' && needs.check-new-commits.outputs.has-recent-failures != 'true') }}
    uses: ./.github/workflows/base-deployment.yml
    with:
      workflow-name: 'Staging Deployment'
      environment: 'Staging'
      deploy-to-vercel: true
    secrets:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      NEXT_PUBLIC_RAPID_API_KEY: ${{ secrets.NEXT_PUBLIC_RAPID_API_KEY }}
      NEXT_PUBLIC_RAPID_API_HOST: ${{ secrets.NEXT_PUBLIC_RAPID_API_HOST }}
      NEXT_PUBLIC_RAPID_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_RAPID_API_BASE_URL }}

  # Handle case when deployment is blocked due to recent failures
  deployment-blocked:
    name: Deployment Blocked (Recent Failures)
    needs: [check-new-commits]
    runs-on: ubuntu-latest
    if: always() && !inputs.force-deploy && needs.check-new-commits.outputs.has-recent-failures == 'true'
    steps:
      - name: Generate Blocked Summary
        run: |
          echo "## 🚀 Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Source Branch:** staging (synced from master)" >> $GITHUB_STEP_SUMMARY
          echo "**Purpose:** Automatic staging deployment for 24h soak testing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### ⏭️ Commit Check" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** BLOCKED" >> $GITHUB_STEP_SUMMARY
          echo "**Current Commit:** ${{ needs.check-new-commits.outputs.current-commit }}" >> $GITHUB_STEP_SUMMARY
          echo "**Last Staging Commit:** ${{ needs.check-new-commits.outputs.last-staging-commit }}" >> $GITHUB_STEP_SUMMARY
          echo "**Last Failed Commit:** ${{ needs.check-new-commits.outputs.last-failed-commit }}" >> $GITHUB_STEP_SUMMARY
          echo "**Reason:** Recent staging deployment failure detected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🚀 Staging Deployment" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ⏭️ BLOCKED (recent failures)" >> $GITHUB_STEP_SUMMARY
          echo "**Reason:** Deployment blocked due to recent staging failure" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "- 🔍 Investigate the failed staging deployment" >> $GITHUB_STEP_SUMMARY
          echo "- 🛠️ Fix the issues that caused the failure" >> $GITHUB_STEP_SUMMARY
          echo "- 🔄 Push a new commit to trigger a fresh deployment" >> $GITHUB_STEP_SUMMARY
          echo "- ⚡ Use 'Force deployment' option if you need to bypass this check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** This blocking prevents deploying the same failed commit repeatedly." >> $GITHUB_STEP_SUMMARY

  # Handle case when deployment is skipped due to no new commits
  deployment-skipped:
    name: Deployment Skipped (No New Commits)
    needs: [check-new-commits]
    runs-on: ubuntu-latest
    if: always() && !inputs.force-deploy && needs.check-new-commits.outputs.has-new-commits != 'true' && needs.check-new-commits.outputs.has-recent-failures != 'true'
    steps:
      - name: Generate Skip Summary
        run: |
          echo "## 🚀 Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Source Branch:** staging (synced from master)" >> $GITHUB_STEP_SUMMARY
          echo "**Purpose:** Automatic staging deployment for 24h soak testing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### ⏭️ Commit Check" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** SKIPPED" >> $GITHUB_STEP_SUMMARY
          echo "**Current Commit:** ${{ needs.check-new-commits.outputs.current-commit }}" >> $GITHUB_STEP_SUMMARY
          echo "**Last Staging Commit:** ${{ needs.check-new-commits.outputs.last-staging-commit }}" >> $GITHUB_STEP_SUMMARY
          echo "**Reason:** No new commits since last staging deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🚀 Staging Deployment" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ⏭️ SKIPPED (no new commits)" >> $GITHUB_STEP_SUMMARY
          echo "**Reason:** No new commits to deploy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "- Wait for new commits to be pushed to staging" >> $GITHUB_STEP_SUMMARY
          echo "- Use 'Force deployment' option if you need to redeploy the same commit" >> $GITHUB_STEP_SUMMARY
          echo "- Continue testing in staging environment" >> $GITHUB_STEP_SUMMARY

  staging-summary:
    name: Staging Deployment Summary
    needs: [deploy, deployment-blocked, deployment-skipped]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate Staging Summary
        run: |
          echo "## 🚀 Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Source Branch:** staging (synced from master)" >> $GITHUB_STEP_SUMMARY
          echo "**Purpose:** Automatic staging deployment for 24h soak testing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check if deployment was blocked
          if [ "${{ needs.deployment-blocked.result }}" = "success" ]; then
            echo "### ⏭️ Deployment Status" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** BLOCKED" >> $GITHUB_STEP_SUMMARY
            echo "**Reason:** Recent staging deployment failure detected" >> $GITHUB_STEP_SUMMARY
            echo "**Last Failed Commit:** ${{ needs.check-new-commits.outputs.last-failed-commit }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Note:** Deployment blocked to prevent repeated failures. Fix the issues and push a new commit." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.deployment-skipped.result }}" = "success" ]; then
            echo "### ⏭️ Deployment Status" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** SKIPPED" >> $GITHUB_STEP_SUMMARY
            echo "**Reason:** No new commits since last staging deployment" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Note:** This is a successful skip - no deployment was needed." >> $GITHUB_STEP_SUMMARY
          else
            # Deployment summary
            if [ "${{ needs.deploy.result }}" = "success" ]; then
              echo "### ✅ Deployment Results" >> $GITHUB_STEP_SUMMARY
              echo "**Status:** SUCCESS" >> $GITHUB_STEP_SUMMARY
              echo "- Staging deployment completed" >> $GITHUB_STEP_SUMMARY
              echo "- Post-deployment verification passed" >> $GITHUB_STEP_SUMMARY
              echo "- Staging domain updated" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### ⏰ Soak Period Started" >> $GITHUB_STEP_SUMMARY
              echo "**Status:** ACTIVE" >> $GITHUB_STEP_SUMMARY
              echo "- 24 business hours soak period has begun" >> $GITHUB_STEP_SUMMARY
              echo "- Production deployment will be available after soak period" >> $GITHUB_STEP_SUMMARY
            else
              echo "### ❌ Deployment Results" >> $GITHUB_STEP_SUMMARY
              echo "**Status:** FAILED" >> $GITHUB_STEP_SUMMARY
              echo "- Staging deployment failed" >> $GITHUB_STEP_SUMMARY
              echo "- Soak period not started" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Note:** Future deployments will be blocked until this issue is resolved." >> $GITHUB_STEP_SUMMARY
            fi
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.deployment-blocked.result }}" = "success" ]; then
            echo "- 🔍 Investigate the failed staging deployment" >> $GITHUB_STEP_SUMMARY
            echo "- 🛠️ Fix the issues that caused the failure" >> $GITHUB_STEP_SUMMARY
            echo "- 🔄 Push a new commit to trigger a fresh deployment" >> $GITHUB_STEP_SUMMARY
            echo "- ⚡ Use 'Force deployment' option if you need to bypass this check" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.deployment-skipped.result }}" = "success" ]; then
            echo "- Wait for new commits to be pushed to staging" >> $GITHUB_STEP_SUMMARY
            echo "- Use 'Force deployment' option if you need to redeploy the same commit" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Test the staging environment thoroughly" >> $GITHUB_STEP_SUMMARY
            echo "- Wait 24 business hours for soak period" >> $GITHUB_STEP_SUMMARY
            echo "- Trigger production deployment when ready" >> $GITHUB_STEP_SUMMARY
          fi
