name: Staging Deployment (Automatic from Master)

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      force-deploy:
        description: 'Force deployment even if no new commits'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  # Check if there are new commits since last staging deployment
  check-new-commits:
    name: Check for New Commits
    runs-on: ubuntu-latest
    if: ${{ !inputs.force-deploy || github.event_name == 'push' }}
    outputs:
      has-new-commits: ${{ steps.check-commits.outputs.has-new-commits }}
      last-staging-commit: ${{ steps.check-commits.outputs.last-staging-commit }}
      current-commit: ${{ steps.check-commits.outputs.current-commit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: staging

      - name: Check for new commits since last staging deployment
        id: check-commits
        run: |
          echo "Checking for new commits since last staging deployment..."

          # Get the current commit hash
          CURRENT_COMMIT=$(git rev-parse HEAD)
          echo "Current commit: $CURRENT_COMMIT"
          echo "current-commit=$CURRENT_COMMIT" >> $GITHUB_OUTPUT

          # Get the last staging deployment commit from GitHub releases
          echo "Fetching last staging deployment info from GitHub releases..."

          # Try to get the latest staging deployment from releases
          if [ -f "scripts/get-latest-deployment.sh" ]; then
            # Make script executable if needed
            chmod +x scripts/get-latest-deployment.sh

            # Get latest staging deployment
            if LAST_STAGING_COMMIT=$(./scripts/get-latest-deployment.sh staging commit_hash 2>/dev/null); then
              echo "Found staging deployment in GitHub releases:"
              echo "  Commit: $LAST_STAGING_COMMIT"
              echo "last-staging-commit=$LAST_STAGING_COMMIT" >> $GITHUB_OUTPUT
            else
              echo "No previous staging deployment found in GitHub releases, proceeding with deployment"
              echo "has-new-commits=true" >> $GITHUB_OUTPUT
              echo "last-staging-commit=none" >> $GITHUB_OUTPUT
              echo "has-recent-failures=false" >> $GITHUB_OUTPUT
              echo "last-failed-commit=none" >> $GITHUB_OUTPUT
              exit 0
            fi
          else
            echo "Deployment script not found, falling back to workflow search..."

            # Fallback to old method for backward compatibility
            STAGING_DEPLOYMENT=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?workflow_id=staging.yml&branch=staging&status=completed&conclusion=success&per_page=1" | \
              jq -r '.workflow_runs[0] // empty')

            if [ -z "$STAGING_DEPLOYMENT" ]; then
              echo "No previous staging deployment found, proceeding with deployment"
              echo "has-new-commits=true" >> $GITHUB_OUTPUT
              echo "last-staging-commit=none" >> $GITHUB_OUTPUT
              echo "has-recent-failures=false" >> $GITHUB_OUTPUT
              echo "last-failed-commit=none" >> $GITHUB_OUTPUT
              exit 0
            fi

            # Get the commit hash from the last staging deployment
            LAST_STAGING_COMMIT=$(echo "$STAGING_DEPLOYMENT" | jq -r '.head_sha')
            LAST_STAGING_TIME=$(echo "$STAGING_DEPLOYMENT" | jq -r '.created_at')
            echo "Last staging deployment commit: $LAST_STAGING_COMMIT"
            echo "last-staging-commit=$LAST_STAGING_COMMIT" >> $GITHUB_OUTPUT
          fi

          # Note: We no longer block deployments based on previous failures
          # The deployment will succeed or fail based on the current commit's jobs
          echo "has-recent-failures=false" >> $GITHUB_OUTPUT
          echo "last-failed-commit=none" >> $GITHUB_OUTPUT

          # Check if current commit is different from last staging commit
          if [ "$CURRENT_COMMIT" = "$LAST_STAGING_COMMIT" ]; then
            echo "No new commits since last staging deployment"
            echo "has-new-commits=false" >> $GITHUB_OUTPUT
          else
            echo "New commits found since last staging deployment"
            echo "has-new-commits=true" >> $GITHUB_OUTPUT
          fi

  # Preview validation (same as preview workflow)
  validation:
    name: Staging Preview Validation
    needs: [check-new-commits]
    if: ${{ inputs.force-deploy || needs.check-new-commits.outputs.has-new-commits == 'true' }}
    uses: ./.github/workflows/pre-deployment.yml
    with:
      workflow-name: 'Staging Preview Validation'
      environment: 'Staging'
      skip-e2e-tests: false
    secrets:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
      NEXT_PUBLIC_RAPID_API_KEY: ${{ secrets.NEXT_PUBLIC_RAPID_API_KEY }}
      NEXT_PUBLIC_RAPID_API_HOST: ${{ secrets.NEXT_PUBLIC_RAPID_API_HOST }}
      NEXT_PUBLIC_RAPID_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_RAPID_API_BASE_URL }}

  # Deploy to staging if there are new commits or force-deploy is enabled
  deploy:
    name: Deploy to Staging
    needs: [check-new-commits, validation]
    if: ${{ inputs.force-deploy || needs.check-new-commits.outputs.has-new-commits == 'true' }}
    uses: ./.github/workflows/deploy-and-verify.yml
    with:
      workflow-name: 'Staging Deployment'
      environment: 'Staging'
    secrets:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      NEXT_PUBLIC_RAPID_API_KEY: ${{ secrets.NEXT_PUBLIC_RAPID_API_KEY }}
      NEXT_PUBLIC_RAPID_API_HOST: ${{ secrets.NEXT_PUBLIC_RAPID_API_HOST }}
      NEXT_PUBLIC_RAPID_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_RAPID_API_BASE_URL }}

  # Create deployment release for tracking
  create-deployment-release:
    name: Create Deployment Release
    needs: [deploy]
    runs-on: ubuntu-latest
    if: success()
    outputs:
      release-id: ${{ steps.create-release.outputs.release_id }}
      release-url: ${{ steps.create-release.outputs.release_url }}
      release-tag: ${{ steps.create-release.outputs.release_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: staging

      - name: Create Deployment Release
        id: create-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Creating deployment release for tracking..."

          # Get current commit hash
          CURRENT_COMMIT=$(git rev-parse HEAD)

          # Get deployment ID from Vercel (this would need to be passed from the deploy job)
          # For now, we'll use the workflow run ID as a proxy
          DEPLOYMENT_ID="${{ github.run_id }}"
          WORKFLOW_RUN_ID="${{ github.run_id }}"

          # Create the release
          if [ -f "scripts/create-deployment-release.sh" ]; then
            chmod +x scripts/create-deployment-release.sh
            ./scripts/create-deployment-release.sh staging "$CURRENT_COMMIT" "$DEPLOYMENT_ID" "$WORKFLOW_RUN_ID"

            # Capture outputs
            echo "release_id=$(cat $GITHUB_OUTPUT | grep 'release_id=' | cut -d'=' -f2)" >> $GITHUB_OUTPUT
            echo "release_url=$(cat $GITHUB_OUTPUT | grep 'release_url=' | cut -d'=' -f2)" >> $GITHUB_OUTPUT
            echo "release_tag=$(cat $GITHUB_OUTPUT | grep 'release_tag=' | cut -d'=' -f2)" >> $GITHUB_OUTPUT
          else
            echo "Deployment release script not found, skipping release creation"
          fi

  # Handle case when deployment is skipped due to no new commits
  deployment-skipped:
    name: Deployment Skipped (No New Commits)
    needs: [check-new-commits]
    runs-on: ubuntu-latest
    if: always() && !inputs.force-deploy && needs.check-new-commits.outputs.has-new-commits != 'true'
    steps:
      - name: Generate Skip Summary
        run: |
          echo "## 🚀 Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Source Branch:** staging (synced from master)" >> $GITHUB_STEP_SUMMARY
          echo "**Purpose:** Automatic staging deployment for 2 business days soak testing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### ⏭️ Commit Check" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** SKIPPED" >> $GITHUB_STEP_SUMMARY
          echo "**Current Commit:** ${{ needs.check-new-commits.outputs.current-commit }}" >> $GITHUB_STEP_SUMMARY
          echo "**Last Staging Commit:** ${{ needs.check-new-commits.outputs.last-staging-commit }}" >> $GITHUB_STEP_SUMMARY
          echo "**Reason:** No new commits since last staging deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🚀 Staging Deployment" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ⏭️ SKIPPED (no new commits)" >> $GITHUB_STEP_SUMMARY
          echo "**Reason:** No new commits to deploy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "- Wait for new commits to be pushed to staging" >> $GITHUB_STEP_SUMMARY
          echo "- Use 'Force deployment' option if you need to redeploy the same commit" >> $GITHUB_STEP_SUMMARY
          echo "- Continue testing in staging environment" >> $GITHUB_STEP_SUMMARY

  staging-summary:
    name: Staging Deployment Summary
    needs: [validation, deploy, deployment-skipped, create-deployment-release]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate Staging Summary
        run: |
          echo "## 🚀 Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Source Branch:** staging (synced from master)" >> $GITHUB_STEP_SUMMARY
          echo "**Purpose:** Automatic staging deployment for 2 business days soak testing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check if deployment was skipped
          if [ "${{ needs.deployment-skipped.result }}" = "success" ]; then
            echo "### ⏭️ Deployment Status" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** SKIPPED" >> $GITHUB_STEP_SUMMARY
            echo "**Reason:** No new commits since last staging deployment" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Note:** This is a successful skip - no deployment was needed." >> $GITHUB_STEP_SUMMARY
          else
            # Validation summary
            if [ "${{ needs.validation.result }}" = "success" ]; then
              echo "### ✅ Validation Results" >> $GITHUB_STEP_SUMMARY
              echo "**Status:** SUCCESS" >> $GITHUB_STEP_SUMMARY
              echo "- Code quality checks passed" >> $GITHUB_STEP_SUMMARY
              echo "- Type checking passed" >> $GITHUB_STEP_SUMMARY
              echo "- Unit tests passed" >> $GITHUB_STEP_SUMMARY
              echo "- Integration tests passed" >> $GITHUB_STEP_SUMMARY
              echo "- Database validation passed" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            else
              echo "### ❌ Validation Results" >> $GITHUB_STEP_SUMMARY
              echo "**Status:** FAILED" >> $GITHUB_STEP_SUMMARY
              echo "- Validation checks failed" >> $GITHUB_STEP_SUMMARY
              echo "- Deployment skipped due to validation failure" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi

            # Deployment summary
            if [ "${{ needs.deploy.result }}" = "success" ]; then
              echo "### ✅ Deployment Results" >> $GITHUB_STEP_SUMMARY
              echo "**Status:** SUCCESS" >> $GITHUB_STEP_SUMMARY
              echo "- Staging deployment completed" >> $GITHUB_STEP_SUMMARY
              echo "- Post-deployment verification passed" >> $GITHUB_STEP_SUMMARY
              echo "- Staging domain updated" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### ⏰ Soak Period Started" >> $GITHUB_STEP_SUMMARY
              echo "**Status:** ACTIVE" >> $GITHUB_STEP_SUMMARY
              echo "- 2 business days soak period has begun" >> $GITHUB_STEP_SUMMARY
              echo "- Production deployment will be available after soak period" >> $GITHUB_STEP_SUMMARY
            else
              echo "### ❌ Deployment Results" >> $GITHUB_STEP_SUMMARY
              echo "**Status:** FAILED" >> $GITHUB_STEP_SUMMARY
              echo "- Staging deployment failed" >> $GITHUB_STEP_SUMMARY
              echo "- Soak period not started" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Note:** Future deployments will be blocked until this issue is resolved." >> $GITHUB_STEP_SUMMARY
            fi
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.deployment-skipped.result }}" = "success" ]; then
            echo "- Wait for new commits to be pushed to staging" >> $GITHUB_STEP_SUMMARY
            echo "- Use 'Force deployment' option if you need to redeploy the same commit" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Test the staging environment thoroughly" >> $GITHUB_STEP_SUMMARY
            echo "- Wait 2 business days for soak period" >> $GITHUB_STEP_SUMMARY
            echo "- Trigger production deployment when ready" >> $GITHUB_STEP_SUMMARY
          fi
