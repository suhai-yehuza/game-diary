name: Staging Deployment (Automatic from Master)

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      force-deploy:
        description: 'Force deployment even if no new commits'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  deploy:
    name: Deploy to Staging
    uses: ./.github/workflows/base-deployment.yml
    with:
      workflow-name: 'Staging Deployment'
      environment: 'Staging'
      deploy-to-vercel: true
    secrets:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      NEXT_PUBLIC_RAPID_API_KEY: ${{ secrets.NEXT_PUBLIC_RAPID_API_KEY }}
      NEXT_PUBLIC_RAPID_API_HOST: ${{ secrets.NEXT_PUBLIC_RAPID_API_HOST }}
      NEXT_PUBLIC_RAPID_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_RAPID_API_BASE_URL }}

  staging-summary:
    name: Staging Deployment Summary
    needs: [deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate Staging Summary
        run: |
          echo "## 🚀 Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Source Branch:** staging (synced from master)" >> $GITHUB_STEP_SUMMARY
          echo "**Purpose:** Automatic staging deployment for 24h soak testing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Deployment summary
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "### ✅ Deployment Results" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** SUCCESS" >> $GITHUB_STEP_SUMMARY
            echo "- Staging deployment completed" >> $GITHUB_STEP_SUMMARY
            echo "- Post-deployment verification passed" >> $GITHUB_STEP_SUMMARY
            echo "- Staging domain updated" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ⏰ Soak Period Started" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** ACTIVE" >> $GITHUB_STEP_SUMMARY
            echo "- 24 business hours soak period has begun" >> $GITHUB_STEP_SUMMARY
            echo "- Production deployment will be available after soak period" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Deployment Results" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** FAILED" >> $GITHUB_STEP_SUMMARY
            echo "- Staging deployment failed" >> $GITHUB_STEP_SUMMARY
            echo "- Soak period not started" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "- Test the staging environment thoroughly" >> $GITHUB_STEP_SUMMARY
          echo "- Wait 24 business hours for soak period" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger production deployment when ready" >> $GITHUB_STEP_SUMMARY
