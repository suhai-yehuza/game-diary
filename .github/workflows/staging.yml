name: Vercel Staging Deployment

# Staging deployment workflow that:
# - Deploys the current staging branch to staging environment
# - Runs comprehensive testing before deployment
# - 30-minute soak period with health monitoring
# - Post-deployment validation
# - Does NOT merge to master (that happens via hourly workflow)

on:
  push:
    branches:
      - staging

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  NODE_VERSION: '22'
  PNPM_VERSION: '10'
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  PORT: 3000
  VERCEL_STAGING_URL: ${{ secrets.VERCEL_STAGING_URL }}
  VERCEL_PRODUCTION_URL: ${{ secrets.VERCEL_PRODUCTION_URL }}
  VERCEL_PREVIEW_URL: ${{ secrets.VERCEL_PREVIEW_URL }}
  SOAK_DURATION: 1800 # 30 minutes
  HEALTH_CHECK_INTERVAL: 30
  PERFORMANCE_CHECK_INTERVAL: 300
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
  CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}

jobs:
  quality-gate:
    name: Quality Gate (Lint, Typecheck, Format, Build)
    runs-on: ubuntu-latest
    environment: Staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Run CI Quality Gate
        run: ./scripts/ci-quality-gate.sh staging

  unit-tests:
    name: Unit Tests
    needs: [quality-gate]
    runs-on: ubuntu-latest
    environment: Staging
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Run CI Unit Tests
        run: ./scripts/ci-unit-tests.sh
      - uses: codecov/codecov-action@v4
        if: success()
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
      - name: Upload unit test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            coverage/
            test-results/
          retention-days: 7

  e2e:
    name: E2E Tests
    needs: [quality-gate]
    runs-on: ubuntu-latest
    environment: Staging
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PLAYWRIGHT_TEST: true
    strategy:
      matrix:
        test: [smoke, critical]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - name: Run CI E2E Tests
        run: ./scripts/ci-e2e-tests.sh ${{ matrix.test }}
      - name: Upload E2E test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.test }}-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  e2e-responsive:
    name: Responsive E2E Tests
    needs: [unit-tests, e2e]
    runs-on: ubuntu-latest
    environment: Staging
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PLAYWRIGHT_TEST: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - name: Run Responsive E2E Tests
        run: ./scripts/e2e-run.sh responsive 3600
        continue-on-error: false
      - name: Upload E2E test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-responsive-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Vercel Staging
    needs: [e2e-responsive]
    runs-on: ubuntu-latest
    if: success()
    environment: Staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Cache Vercel CLI
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-vercel-cli-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vercel-cli-
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=staging --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}

  soak-period:
    name: Soak Period Monitoring
    needs: [deploy]
    runs-on: ubuntu-latest
    if: success()
    environment: Staging
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VERCEL_STAGING_URL: ${{ secrets.VERCEL_STAGING_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Install required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc jq curl
      - name: Initialize Soak Directory
        run: |
          echo "=== Initializing soak directory ==="
          mkdir -p ./.soak
          echo '{"status":"initialized","timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","environment":"staging"}' > ./.soak/status.json
          echo "✅ Soak directory initialized"
          ls -la ./.soak/
      - name: Start Soak Period
        run: |
          echo "Starting soak period for staging deployment"
          echo "Deployment URL: $VERCEL_STAGING_URL"
          echo "Soak duration: $SOAK_DURATION seconds"

          # Debug: Check if soak script exists and is executable
          ls -la ./scripts/soak-monitor.sh

          # Debug: Check environment variables
          echo "Environment check:"
          echo "VERCEL_STAGING_URL: $VERCEL_STAGING_URL"
          echo "SOAK_DURATION: $SOAK_DURATION"
          echo "DATABASE_URL: ${DATABASE_URL:0:20}..."

          # Start soak period with error handling
          if ./scripts/soak-monitor.sh start staging $SOAK_DURATION; then
            echo "✅ Soak period started successfully"
          else
            echo "❌ Failed to start soak period"
            exit 1
          fi
      - name: Monitor During Soak Period
        run: |
          echo "Monitoring deployment during soak period..."

          # Debug: Check if soak directory was created
          echo "=== Pre-monitor soak directory check ==="
          ls -la ./.soak/ 2>/dev/null || echo "Soak directory not found before monitoring"

          # Monitor with error handling
          if ./scripts/soak-monitor.sh monitor staging $SOAK_DURATION; then
            echo "✅ Soak monitoring completed successfully"
          else
            echo "❌ Soak monitoring failed"
            # Don't exit here, let the artifact upload still happen
          fi
        continue-on-error: true
      - name: Check Soak Status
        run: |
          echo "=== Final Soak Status ==="
          ./scripts/soak-monitor.sh status

          echo "=== Soak Directory Contents ==="
          if [ -d ./.soak/ ]; then
            ls -la ./.soak/
            echo "=== Soak Directory Size ==="
            du -sh ./.soak/
            echo "=== All Files in Soak Directory ==="
            find ./.soak/ -type f -exec ls -la {} \;
          else
            echo "❌ Soak directory not found"
            echo "Creating minimal soak directory for artifact upload..."
            mkdir -p ./.soak
            echo '{"status":"failed","error":"Soak directory was not created","timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > ./.soak/status.json
          fi

          if [ -f ./.soak/status.json ]; then
            echo "=== Status File ==="
            cat ./.soak/status.json | jq '.' 2>/dev/null || cat ./.soak/status.json
          else
            echo "❌ Status file not found"
            echo "Creating minimal status file..."
            echo '{"status":"failed","error":"Status file was not created","timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > ./.soak/status.json
          fi
      - name: Upload Soak Artifacts
        run: |
          echo "=== Preparing and uploading soak results ==="

          # Ensure soak directory exists
          if [ ! -d ./.soak/ ]; then
            echo "Creating soak directory..."
            mkdir -p ./.soak
          fi

          # Ensure status file exists
          if [ ! -f ./.soak/status.json ]; then
            echo "Creating fallback status file..."
            echo '{"status":"failed","error":"Soak period did not complete properly","timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > ./.soak/status.json
          fi

          # Create a summary file
          echo "=== Soak Period Summary ===" > ./.soak/summary.txt
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> ./.soak/summary.txt
          echo "Environment: staging" >> ./.soak/summary.txt
          echo "Deployment URL: $VERCEL_STAGING_URL" >> ./.soak/summary.txt
          echo "Soak Duration: $SOAK_DURATION seconds" >> ./.soak/summary.txt
          echo "Files in soak directory:" >> ./.soak/summary.txt
          ls -la ./.soak/ >> ./.soak/summary.txt 2>&1 || echo "No files found" >> ./.soak/summary.txt

          # Create additional debug files
          echo "=== Debug Information ===" > ./.soak/debug.log
          echo "Current directory: $(pwd)" >> ./.soak/debug.log
          echo "Soak directory exists: $([ -d ./.soak/ ] && echo "yes" || echo "no")" >> ./.soak/debug.log
          echo "Status file exists: $([ -f ./.soak/status.json ] && echo "yes" || echo "no")" >> ./.soak/debug.log
          echo "Directory contents:" >> ./.soak/debug.log
          ls -la ./.soak/ >> ./.soak/debug.log 2>&1 || echo "Directory listing failed" >> ./.soak/debug.log

          echo "Soak directory contents:"
          ls -la ./.soak/

          # Verify files exist before upload
          if [ ! -d ./.soak/ ]; then
            echo "❌ Soak directory still doesn't exist after creation attempt"
            exit 1
          fi

          if [ ! -f ./.soak/status.json ]; then
            echo "❌ Status file still doesn't exist after creation attempt"
            exit 1
          fi

          echo "✅ Soak artifacts prepared successfully"
        if: always()

      - name: Upload Soak Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soak-period-results
          path: |
            ./.soak/
          retention-days: 30
          if-no-files-found: error
        if: always()
      - name: Fail if Soak Failed
        if: failure()
        run: |
          echo "❌ Soak period failed - deployment may be unstable"
          exit 1

  post-deployment-validation:
    name: Post-Deployment Validation
    needs: [soak-period]
    runs-on: ubuntu-latest
    if: success()
    environment: Staging
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VERCEL_STAGING_URL: ${{ secrets.VERCEL_STAGING_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - name: Run Post-Deployment E2E Tests
        run: |
          echo "Running comprehensive post-deployment validation..."
          DEPLOYMENT_URL="$VERCEL_STAGING_URL" pnpm test:e2e:smoke
          DEPLOYMENT_URL="$VERCEL_STAGING_URL" pnpm test:e2e:critical
      - name: Upload Post-Deployment Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: post-deployment-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 30

  deployment-summary:
    name: Deployment Summary
    needs: [post-deployment-validation]
    runs-on: ubuntu-latest
    if: always()
    environment: Staging
    steps:
      - uses: actions/checkout@v4
      - name: Download Soak Results
        uses: actions/download-artifact@v4
        with:
          name: soak-period-results
          path: ./.soak
        continue-on-error: true
      - name: Generate Deployment Summary
        run: |
          echo "## 🚀 Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f ./.soak/status.json ]; then
            echo "### Soak Period Results" >> $GITHUB_STEP_SUMMARY
            cat ./.soak/status.json | jq -r '
              "**Status:** " + .status + "\n" +
              "**Environment:** " + .environment + "\n" +
              "**Start Time:** " + .start_time + "\n" +
              "**End Time:** " + (.end_time // "N/A") + "\n" +
              "**Duration:** " + (.duration // "N/A") + " seconds\n"
            ' >> $GITHUB_STEP_SUMMARY

            if [ -f ./.soak/metrics.json ]; then
              echo "### Final Metrics" >> $GITHUB_STEP_SUMMARY
              cat ./.soak/metrics.json | jq -r '
                "**Total Checks:** " + (.total_checks // 0) + "\n" +
                "**Healthy Checks:** " + (.healthy_checks // 0) + "\n" +
                "**Error Rate:** " + ((.error_rate // 0) * 100 | tostring) + "%\n" +
                "**Avg Response Time:** " + (.avg_response_time // 0) + "ms\n"
              ' >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "### Soak Period Results" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** Not available (soak period may have failed or artifact not uploaded)" >> $GITHUB_STEP_SUMMARY
          fi

          echo "### Job Results" >> $GITHUB_STEP_SUMMARY
          echo "- Quality Gate: ${{ needs.quality-gate.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Unit Tests: ${{ needs.unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- E2E Tests: ${{ needs.e2e.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Responsive Tests: ${{ needs.e2e-responsive.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Deployment: ${{ needs.deploy.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Soak Period: ${{ needs.soak-period.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Post-Deployment Validation: ${{ needs.post-deployment-validation.result }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.post-deployment-validation.result }}" = "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Staging deployment completed successfully!**" >> $GITHUB_STEP_SUMMARY
            echo "🔄 **Hourly workflow will check for commits ready to merge to master.**" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Staging deployment failed during validation!**" >> $GITHUB_STEP_SUMMARY
          fi
