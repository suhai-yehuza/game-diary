name: Vercel Preview Deployment

# NOTE: This workflow runs on pull_request events for validation only.
# Automatic Vercel preview deployments are disabled to save resources.
# Preview deployments can be triggered manually if needed.
on:
  pull_request:
    branches:
      - master
      - staging
  workflow_call:
    inputs:
      workflow-name:
        type: string
        description: The name of the workflow.
        default: 'Vercel Preview Deployment'
      environment:
        type: string
        description: The environment to deploy to.
        default: 'Preview'
      deploy-to-vercel:
        type: boolean
        description: Whether to deploy to Vercel.
        default: false # Changed from true to false to save resources
    secrets:
      VERCEL_ORG_ID:
        required: false
      VERCEL_PROJECT_ID:
        required: false
      VERCEL_TOKEN:
        required: false
      DATABASE_URL:
        required: false
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:
        required: false
      CLERK_SECRET_KEY:
        required: false
      CLERK_WEBHOOK_SIGNING_SECRET:
        required: false
      VERCEL_AUTOMATION_BYPASS_SECRET:
        required: false
      NEXT_PUBLIC_RAPID_API_KEY:
        required: false
      NEXT_PUBLIC_RAPID_API_HOST:
        required: false
      NEXT_PUBLIC_RAPID_API_BASE_URL:
        required: false

jobs:
  # Preview validation using reusable workflow
  validation:
    name: Preview Validation
    uses: ./.github/workflows/pre-deployment.yml
    with:
      workflow-name: 'Preview Validation'
      environment: 'Preview'
      skip-e2e-tests: false
    secrets:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
      NEXT_PUBLIC_RAPID_API_KEY: ${{ secrets.NEXT_PUBLIC_RAPID_API_KEY }}
      NEXT_PUBLIC_RAPID_API_HOST: ${{ secrets.NEXT_PUBLIC_RAPID_API_HOST }}
      NEXT_PUBLIC_RAPID_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_RAPID_API_BASE_URL }}

  # Preview deployment to Vercel (DISABLED to save resources)
  deploy:
    name: Deploy Preview to Vercel
    needs: [validation]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Preview
    # Skip deployment to save resources - only run validation
    if: false # This disables the job entirely
    outputs:
      deployment-url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Vercel Preview
        id: deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
          NEXT_PUBLIC_RAPID_API_KEY: ${{ secrets.NEXT_PUBLIC_RAPID_API_KEY }}
          NEXT_PUBLIC_RAPID_API_HOST: ${{ secrets.NEXT_PUBLIC_RAPID_API_HOST }}
          NEXT_PUBLIC_RAPID_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_RAPID_API_BASE_URL }}
          CI: 'true'
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          E2E_AUTH_BYPASS: 'true'
          TEST_USER_EMAIL: 'test@game-diary.com'
          TEST_USER_ID: 'test_user_123'
        run: |
          echo "🚫 Preview deployment disabled to save resources"
          echo "✅ Validation completed successfully"
          echo "📝 To deploy preview manually, use: gh workflow run preview.yml --field deploy-to-vercel=true"
          echo "url=https://game-diary.vercel.app" >> $GITHUB_OUTPUT

      - name: Comment PR with Preview Status
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## ✅ Preview Validation Complete

            **Status:** Validation passed, preview deployment skipped to save resources

            ### What was tested:
            - ✅ Code quality checks (linting, formatting)
            - ✅ Type checking
            - ✅ Unit tests
            - ✅ Integration tests
            - ✅ Database validation
            - ✅ Build process

            ### Preview Deployment:
            - 🚫 **Automatic preview deployment disabled** to save resources
            - 🔧 To deploy preview manually: \`gh workflow run preview.yml --field deploy-to-vercel=true\`
            - 📝 Preview deployments can be enabled per-PR if needed

            ### What's Next:
            - ✅ Preview validation passed
            - 🔍 Code review can proceed
            - 🚀 Once approved, this will be merged to master and deployed to staging

            **Note:** This change saves compute resources and reduces costs while maintaining code quality.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # Quick preview verification (DISABLED since no deployment)
  verify-preview:
    name: Verify Preview Deployment
    needs: [validation] # Changed from [deploy] to [validation]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: false # Disabled since no deployment occurs
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quick Preview Health Check
        env:
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment-url }}
        run: |
          echo "🔍 Running quick health check on preview deployment..."
          echo "Preview URL: $DEPLOYMENT_URL"

          # Wait for deployment to be ready
          echo "⏳ Waiting for deployment to be ready..."
          sleep 30

          # Basic health check
          if curl -f -s --max-time 30 "$DEPLOYMENT_URL/api/health" > /dev/null 2>&1; then
            echo "✅ Preview deployment is healthy and accessible"
          else
            echo "⚠️ Preview deployment health check failed, but deployment may still be working"
            echo "This is common for preview deployments that are still building..."
          fi

          # Basic smoke test
          if curl -f -s --max-time 30 "$DEPLOYMENT_URL" > /dev/null 2>&1; then
            echo "✅ Preview deployment homepage is accessible"
          else
            echo "⚠️ Preview deployment homepage check failed"
          fi
