name: Vercel Preview Deployment

# Optimized preview deployment workflow with:
# - Parallel job execution (unit-tests and e2e run in parallel)
# - Optimized Playwright installation using npx
# - Comprehensive artifact uploads for debugging
# - Vercel CLI caching
# - Better error handling and conditional deployment
# - Debug environment information

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  NODE_VERSION: '22'
  PNPM_VERSION: '10'
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  PORT: 3000
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
  CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}

on:
  push:
    branches-ignore:
      - master
      - staging

jobs:
  quality-gate:
    name: Quality Gate (Lint, Typecheck, Format, Build)
    runs-on: ubuntu-latest
    environment: Preview
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Run CI Quality Gate
        run: ./scripts/ci-quality-gate.sh preview

  unit-tests:
    name: Unit Tests
    needs: [quality-gate]
    runs-on: ubuntu-latest
    environment: Preview
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Run CI Unit Tests
        run: ./scripts/ci-unit-tests.sh
      - uses: codecov/codecov-action@v4
        if: success()
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
      - name: Upload unit test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            coverage/
            test-results/
          retention-days: 7

  e2e-functional:
    name: E2E Functional Tests
    needs: [quality-gate]
    runs-on: ubuntu-latest
    environment: Preview
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      E2E_MOCK_MODE: true
    strategy:
      matrix:
        test: [sanity, smoke] # progressive testing: sanity first, then smoke
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: ./scripts/install-playwright-browsers.sh --verbose
      - name: Run CI E2E Functional Tests
        run: ./scripts/ci-e2e-tests.sh ${{ matrix.test }}
        # Progressive testing: sanity runs first (30s), smoke runs second (includes sanity tests)
      - name: Upload E2E functional test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-functional-${{ matrix.test }}-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  e2e-pages:
    name: E2E Pages Tests
    needs: [quality-gate]
    runs-on: ubuntu-latest
    environment: Preview
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      E2E_MOCK_MODE: true
    strategy:
      matrix:
        test: [base, content] # progressive testing: base first, then content
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: ./scripts/install-playwright-browsers.sh --verbose
      - name: Run CI E2E Pages Tests
        run: ./scripts/ci-e2e-tests.sh ${{ matrix.test }}
        # Progressive testing: base runs first (20s), content runs second (includes base tests)
      - name: Upload E2E pages test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-pages-${{ matrix.test }}-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Vercel Preview
    needs: [unit-tests, e2e-functional, e2e-pages]
    runs-on: ubuntu-latest
    if: success() && needs.unit-tests.result == 'success' && needs.e2e-functional.result == 'success' && needs.e2e-pages.result == 'success'
    environment: Preview
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - name: Cache Vercel CLI
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-vercel-cli-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vercel-cli-
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        id: vercel_deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} --yes)
          echo "VERCEL_DEPLOYMENT_URL=$url" >> $GITHUB_ENV

  post-deployment-smoke:
    name: Post-Deployment Smoke Tests
    needs: [deploy]
    runs-on: ubuntu-latest
    if: success()
    environment: Preview
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      E2E_MOCK_MODE: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - run: DEPLOYMENT_URL="$VERCEL_DEPLOYMENT_URL" pnpm run timed test:e2e:smoke
      - name: Upload smoke test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
