name: Vercel Preview Deployment

on:
  push:
    branches-ignore:
      - deployment
      - master
      - staging
      - temp-deploy
  pull_request:
    branches:
      - master
      - staging
  workflow_call:
    inputs:
      workflow-name:
        type: string
        description: The name of the workflow.
        default: 'Vercel Preview Deployment'
      environment:
        type: string
        description: The environment to deploy to.
        default: 'Preview'
      deploy-to-vercel:
        type: boolean
        description: Whether to deploy to Vercel.
        default: true
    secrets:
      VERCEL_ORG_ID:
        required: false
      VERCEL_PROJECT_ID:
        required: false
      VERCEL_TOKEN:
        required: false
      DATABASE_URL:
        required: false
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:
        required: false
      CLERK_SECRET_KEY:
        required: false
      CLERK_WEBHOOK_SIGNING_SECRET:
        required: false
      VERCEL_AUTOMATION_BYPASS_SECRET:
        required: false
      NEXT_PUBLIC_RAPID_API_KEY:
        required: false
      NEXT_PUBLIC_RAPID_API_HOST:
        required: false
      NEXT_PUBLIC_RAPID_API_BASE_URL:
        required: false

jobs:
  # Preview validation using reusable workflow
  validation:
    name: Preview Validation
    uses: ./.github/workflows/pre-deployment.yml
    with:
      workflow-name: 'Preview Validation'
      environment: 'Preview'
      skip-e2e-tests: false
    secrets:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
      NEXT_PUBLIC_RAPID_API_KEY: ${{ secrets.NEXT_PUBLIC_RAPID_API_KEY }}
      NEXT_PUBLIC_RAPID_API_HOST: ${{ secrets.NEXT_PUBLIC_RAPID_API_HOST }}
      NEXT_PUBLIC_RAPID_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_RAPID_API_BASE_URL }}
