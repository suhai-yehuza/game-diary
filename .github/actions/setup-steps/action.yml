name: 'Setup Steps'
description: 'Reusable setup steps for Node.js and pnpm'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '22'
  pnpm-version:
    description: 'pnpm version to use'
    required: false
    default: '10'
  cache-key:
    description: 'Cache key for dependencies'
    required: false
    default: 'pnpm'

runs:
  using: 'composite'
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache-key }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
